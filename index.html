        var i = res.info;
        toast('지웠어요: 작업 ' + i.tasks + ' · 진행 기록 ' + i.logs + ' · RFP 항목 ' + i.items + ' · 일정 ' + i.milestones + ' · 연차 ' + i.years);
      }, noop);
    });
  }

  /* ==========================================================================
   * 업무보고 (PEO·PI): 일간·주간 업무 기록
   *  - 내 업무: 왼쪽 업무 기록 → 가운데 내 진행현황 → 오른쪽 일일 업무보고(이행내용 복사)
   *  - 연동: 그날 내가 쓴 유지보수 기록·사업 진행 기록(작업)이 자동으로 함께 보임 (고치는 건 원래 화면에서)
   *  - 팀 업무(주간): PI·PEO·PM이 쓰고 PEO 모두가 공지처럼 봄 (연구자는 보기만). 내 업무의 주간 업무와는 따로
   *  - 전체 현황(PI·PEO·PM): 연구원별 일간·주간 업무보고 + 사업별 + 진행현황표
   * 빌드할 때 app.html 화면 코드 안(BIZ_UI 자리)에 그대로 들어갑니다.
   * ========================================================================== */
  var RP_ST_CLS = { '대기': 'wait', '진행중': 'run', '완료': 'done', '보류': 'hold', '문제발생': 'bad' };
  var RP_ORDER = { '문제발생': 0, '진행중': 1, '보류': 2, '대기': 3, '완료': 4 };
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  function rpChip(st) { return '<span class="st st-' + (RP_ST_CLS[st] || 'wait') + '">' + esc(st) + '</span>'; }
  function rpAddDays(d, n) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
  function rpMD(d) { return d ? (+d.slice(5, 7)) + '.' + (+d.slice(8, 10)) : ''; }
  function rpDow(d) { return DOW[new Date(d + 'T00:00:00Z').getUTCDay()]; }
  function rpDay() { return S.rp.date || today(); }
  function rpWeekEnd(d) { return rpAddDays(L.mondayOf(d), 4); }
  // kind를 주면 그 단위로 (팀 업무는 늘 주간)
  function rpScopeLabel(kind) {
    var d = rpDay();
    if ((kind || S.rp.kind) === '주간') return rpMD(L.mondayOf(d)) + '(월) ~ ' + rpMD(rpWeekEnd(d)) + '(금)';
    return rpMD(d) + '(' + rpDow(d) + ')';
  }
  function canBoard() { return isPI() || (isPM() && myOrg() === 'PEO'); } // 전체 현황판
  function firstLineOf(s) { return String(s || '').split('\n')[0]; }
  function rpByOrder(a, b) { return (RP_ORDER[a.status] || 9) - (RP_ORDER[b.status] || 9); }
  // 사업 고르는 목록: 담당이 아니어도 전체 사업 (서버가 보내 준 전체 이름 목록, 없으면 볼 수 있는 과제)
  function rpProjects() {
    var list = (S.data.reportProjects && S.data.reportProjects.length ? S.data.reportProjects : S.data.projects).slice();
    return list.sort(projOrder);
  }
  function rpAssigned(name) {
    return S.data.projects.filter(function (p) { return p.members.indexOf(name) >= 0; }).sort(projOrder).map(function (p) { return p.name; });
  }

  /* ---------- 항목 모으기 ---------- */
  // 내가 그 날(일간)·그 주(주간)에 쓴 업무
  function rpOwn(name, kind, d) {
    var w = L.mondayOf(d);
    return (S.data.reports || []).filter(function (r) {
      return !r.linkKey && r.team !== 'Y' && (!name || r.author === name) && r.kind === kind && r.date === (kind === '주간' ? w : d);
    });
  }
  // 팀 업무 화면에 보이는 것: 그 주의 팀 업무 (PI·PEO·PM이 씀). 예전에 일간으로 쓴 팀 업무가 있어도 그 날이 든 주에 보임
  function rpTeam(d) {
    var w = L.mondayOf(d);
    return (S.data.reports || []).filter(function (r) { return r.team === 'Y' && L.mondayOf(r.date) === w; });
  }
  function planToRp(st) { return st === '예정' ? '대기' : (L.REPORT_STATUSES.indexOf(st) >= 0 ? st : '진행중'); }
  // 연동: 작성일이 그날인 기록만 (유지보수 기록의 작성일, 사업 진행 기록의 날짜)
  // 작업 자체를 고친 날짜(수정일시)는 보지 않음: 작업을 고치거나 상태만 바꿔도 한꺼번에 끌려오지 않게
  // 접수번호·업무번호·단계는 빼고 업무 내용만. 업무보고에서 고친 내용(linkKey가 있는 업무보고)이 있으면 그걸 보여 줌
  var RP_LINKS = {}; // linkKey → 지금 보이는 연동 항목 (수정 창에서 씀)
  var RP_LINK_FIELDS = ['project', 'content', 'note', 'status', 'progress', 'deadline'];
  // 업무보고에서 지운 연동 항목(hidden)은 빼고 보여 줌. 지운 것까지 모두: rpLinkedAll
  function rpLinked(name, d) { return rpLinkedAll(name, d).filter(function (t) { return !t.hidden; }); }
  function rpLinkedAll(name, d) {
    var out = [], tasks = S.data.tasks || [];
    function add(item) {
      item.orig = {};
      RP_LINK_FIELDS.forEach(function (k) { item.orig[k] = item[k]; });
      var ov = (S.data.reports || []).filter(function (r) { return r.linkKey === item.linkKey; })[0];
      if (ov) {
        item.ovId = ov.id; item.hidden = ov.hidden === 'Y';
        RP_LINK_FIELDS.forEach(function (k) { item[k] = ov[k]; });
        // ‘고침’: 원래 기록과 실제로 다른 칸이 있을 때만 (지웠다가 다시 넣기만 한 건 아님)
        item.edited = RP_LINK_FIELDS.some(function (k) {
          var a = item.orig[k], b = ov[k];
          if (k === 'progress') return (+a || 0) !== (+b || 0);
          return String(a === undefined || a === null ? '' : a) !== String(b === undefined || b === null ? '' : b);
        });
      }
      RP_LINKS[item.linkKey] = item;
      out.push(item);
    }
    (S.data.records || []).forEach(function (r) {
      if (r.author !== name || r.date !== d) return;
      add({ linked: '유지보수', linkKey: 'rec:' + r.id, author: name, project: r.project, content: firstLineOf(r.content), note: '',
        status: planToRp(r.status), progress: r.status === '완료' ? 100 : (r.status === '진행중' ? (+r.progress || 0) : 0), deadline: r.dueDate });
    });
    (S.data.logs || []).forEach(function (l) {
      if (l.author !== name || l.date !== d) return;
      var t = tasks.filter(function (x) { return x.id === l.taskId; })[0];
      var st = l.status || (t ? t.status : '');
      add({ linked: '사업', linkKey: 'log:' + l.id, author: name, project: l.project, content: firstLineOf(l.content), note: '',
        status: planToRp(st), progress: st === '완료' ? 100 : '', deadline: t ? t.targetDate : '' });
    });
    return out;
  }
  // 일일 업무보고에 들어가는 것: 그날 일간 업무 + 그날 일간에 넣은 완료 주간 업무 + 연동
  // 주간 업무: 완료할 때 고른 ‘일간에 넣을 날짜’(dailyDate) 기준. ‘N’이면 넣지 않음. 예전 업무(비어 있음)는 완료한 날(doneDate)
  function rpWeeklyDailyOn(r) { return r.status === '완료' ? (r.dailyDate || r.doneDate || '') : ''; }
  // 일간 내 진행현황에 카드로 보일 ‘주간에서 넘어온’ 업무 (원래 업무를 바꾸지 않게 복사본에 표시만 붙임)
  function rpWeeklyInDaily(name, d) {
    return (S.data.reports || []).filter(function (r) {
      return !r.linkKey && r.team !== 'Y' && r.author === name && r.kind === '주간' && rpWeeklyDailyOn(r) === d;
    }).sort(rpByOrder).map(function (r) { var o = {}; Object.keys(r).forEach(function (k) { o[k] = r[k]; }); o.viaWeekly = d; return o; });
  }
  function rpDailyItems(name, d) {
    var mine = (S.data.reports || []).filter(function (r) {
      return !r.linkKey && r.team !== 'Y' && r.author === name && ((r.kind === '일간' && r.date === d) || (r.kind === '주간' && rpWeeklyDailyOn(r) === d));
    });
    return mine.concat(rpLinked(name, d));
  }
  function rpGroup(items, key) { // key: 'project' | 'author'
    var by = {}, order = [];
    items.forEach(function (t) { var k = t[key] || (key === 'project' ? '기타' : '-'); if (!by[k]) { by[k] = []; order.push(k); } by[k].push(t); });
    if (key === 'project') {
      var rank = {};
      rpProjects().forEach(function (p, i) { rank[p.name] = i; }); // 담당이 아닌 사업도 과제 순서대로
      order.sort(function (a, b) { return (rank[a] === undefined ? 999 : rank[a]) - (rank[b] === undefined ? 999 : rank[b]); });
    } else order.sort();
    return { by: by, order: order };
  }
  // 전체 현황에 나오는 사람: PEO 연구자 + 이 범위에 업무를 쓴 사람
  function rpMembers(extra) {
    var names = (S.data.users || []).filter(function (u) { return u.role === '연구자' && u.active; }).map(function (u) { return u.name; });
    (extra || []).forEach(function (n) { if (n && names.indexOf(n) < 0) names.push(n); });
    return names.sort();
  }

  // 한 사람의 그 범위 업무: 일간 = 그날 일간 + 그날 완료한 주간 + 연동, 주간 = 그 주 주간 업무
  function rpItems(name, d, kind) { return kind === '주간' ? rpOwn(name, '주간', d) : rpDailyItems(name, d); }
  function rpLine(t) { return '- ' + t.content + (t.note ? ' (' + t.note + ')' : ''); }

  /* ---------- 업무보고 (이행내용): 사람별 ---------- */
  // onlyDone: 전체 현황(사람별)은 이행내용만 (담당과제·미진행 과제 없이)
  function rpNarrative(name, d, withHead, kind, onlyDone) {
    var items = rpItems(name, d, kind || '일간'), g = rpGroup(items, 'project'), assigned = onlyDone ? [] : rpAssigned(name);
    var idle = assigned.filter(function (p) { return !g.by[p]; });
    var done = g.order.length ? g.order.map(function (pn) {
      return '<div class="rp-proj">[' + esc(pn) + ']</div>' + g.by[pn].slice().sort(rpByOrder).map(function (t) {
        return '<div class="rp-line">- ' + esc(t.content) + (t.note ? ' <span class="rp-nt">(' + esc(t.note) + ')</span>' : '') + '</div>';
      }).join('');
    }).join('') : '<div class="rp-none">기록 없음</div>';
    return '<div class="rp-rep">' +
      (withHead ? '<div class="rp-rep-h">' + esc(name) + (items.length ? '' : ' <span class="st st-wait">작성 안 함</span>') + '</div>' : '') +
      (onlyDone ? done :
        '<div class="rp-sub">담당과제</div><div class="rp-line">' + esc(assigned.join(', ') || '-') + '</div>' +
        '<div class="rp-sub">이행내용</div>' + done +
        '<div class="rp-sub">미진행 과제</div><div class="rp-line">' + esc(rpIdleLine(idle)) + '</div>') +
      '</div>';
  }
  // 미진행 과제 한 줄 (구글 시트 일일 업무보고와 같은 모양)
  function rpIdleLine(idle) { return idle.length ? '* ' + idle.join(', ') + ' 진행사항 없음' : '* 진행사항 없음'; }
  function rpCopyText(names, d, withHead, kind) {
    return names.map(function (name) {
      var items = rpItems(name, d, kind || '일간');
      if (!items.length) return '';
      var g = rpGroup(items, 'project');
      // 사람 머리: [약칭+직위 알파벳] (예: [1t], [표d]). 관리 > 사용자의 약칭·직위
      return (withHead ? '[' + personCodeOf(name) + ']\n' : '') + g.order.map(function (pn) {
        return '[' + pn + ']\n' + g.by[pn].slice().sort(rpByOrder).map(rpLine).join('\n');
      }).join('\n');
    }).filter(Boolean).join('\n\n');
  }

  /* ---------- 일일 업무보고 → 구글 시트 (AX 일일 업무보고) ----------
   * 오늘 내 이행내용·미진행 과제가 바뀌면(일간 업무 저장·수정·삭제, 오늘 쓴 유지보수·사업 기록, 일간에 넣은 주간 업무)
   * 잠깐 뒤에 서버로 보내고, 서버가 시트의 내 이름 칸(8행 이행내용 · 9행 미진행 과제)에 씀. 시트 C1 날짜가 오늘일 때만
   * 로그인하거나 새로 불러온 것만으로는 보내지 않음 (내용이 바뀌었을 때만). 일일 업무보고의 [시트에 올리기]로 직접 보낼 수도 있음
   * Supabase 서버에서만 (체험 모드·구글 시트 서버는 안 함) */
  var RP_SHEET = { base: null, timer: null, status: null, off: '' };
  var RP_SHEET_OFF = { setup: 1, secret: 1, name: 1, sheet: 1 }; // 이런 답이면 이번 접속에서는 자동으로 다시 보내지 않음
  function rpSheetOn() { return Backend.mode === 'supabase' && !!S.user && !!S.data && seesBiz(); }
  function rpSheetPayload(d) {
    var me = S.user.name, g = rpGroup(rpItems(me, d, '일간'), 'project');
    var idle = rpAssigned(me).filter(function (p) { return !g.by[p]; });
    return { date: d, text: rpCopyText([me], d, false), idle: rpIdleLine(idle) };
  }
  // 데이터가 새로 들어올 때마다 (initial: 로그인·처음 불러옴 → 기준만 잡고 보내지 않음)
  function rpSheetWatch(initial) {
    if (initial) { clearTimeout(RP_SHEET.timer); RP_SHEET.status = null; RP_SHEET.off = ''; } // 다른 계정으로 들어와도 처음부터
    if (!rpSheetOn()) return;
    var p = rpSheetPayload(today()), key = p.text + '\u0001' + p.idle, b = RP_SHEET.base;
    RP_SHEET.base = { date: p.date, key: key };
    if (initial || !b || b.date !== p.date || b.key === key || RP_SHEET.off) return;
    clearTimeout(RP_SHEET.timer);
    RP_SHEET.timer = setTimeout(function () { rpSheetPush(false); }, 1500); // 여러 건을 잇달아 저장해도 한 번만
  }
  function rpSheetPush(manual) {
    if (!rpSheetOn()) return;
    clearTimeout(RP_SHEET.timer);
    var p = rpSheetPayload(today());
    RP_SHEET.status = { busy: true };
    rpSheetPaint();
    // 저장 버튼 잠금·로딩 표시 없이 조용히 보냄 (다른 저장을 막지 않음)
    Backend.call({ action: 'pushDailySheet', payload: p, token: S.token }).then(function (res) {
      takeToken(res);
      var s = (res && res.sheet) || { ok: false, code: 'hook', error: '시트 답이 없어요.' };
      s.at = new Date();
      RP_SHEET.status = s;
      RP_SHEET.off = s.ok ? '' : (RP_SHEET_OFF[s.code] ? s.code : '');
      rpSheetPaint();
      if (manual) toast(s.ok ? '구글 시트(' + (s.cells || []).join('·') + ')에 올렸어요.' : s.error || '시트에 올리지 못했어요.', s.ok ? '' : 'error');
    }, function (err) {
      var msg = String((err && err.message) || err);
      if (msg.indexOf('AUTH:') === 0) { logout(msg.slice(5)); return; }
      RP_SHEET.status = { ok: false, code: 'hook', error: msg, at: new Date() };
      rpSheetPaint();
      if (manual) toast(msg, 'error');
    });
  }
  function rpSheetStatusHtml() {
    var s = RP_SHEET.status;
    if (!s) return '<span class="rp-sheet" id="rp-sheet" title="오늘 이행내용·미진행 과제가 바뀌면 구글 시트(AX 일일 업무보고)의 내 칸에 자동으로 써요">구글 시트 · 오늘 내용이 바뀌면 자동으로 써요</span>';
    if (s.busy) return '<span class="rp-sheet" id="rp-sheet">시트에 올리는 중…</span>';
    var at = s.at ? ('0' + s.at.getHours()).slice(-2) + ':' + ('0' + s.at.getMinutes()).slice(-2) : '';
    if (s.ok) return '<span class="rp-sheet ok" id="rp-sheet" title="구글 시트 AX 일일 업무보고에 썼어요">✓ 시트 ' + esc((s.cells || []).join('·')) + ' 반영 ' + at + '</span>';
    var short = s.code === 'date' ? '시트 날짜(C1)가 오늘이 아니라 안 씀' : s.code === 'name' ? '시트에 내 이름 칸 없음'
      : s.code === 'setup' || s.code === 'secret' ? '시트 연동 설정 전' : '시트 반영 실패';
    return '<span class="rp-sheet bad" id="rp-sheet" title="' + esc(s.error || '') + '">⚠ ' + short + (at ? ' ' + at : '') + '</span>';
  }
  function rpSheetPaint() { var el = $('#rp-sheet'); if (el) el.outerHTML = rpSheetStatusHtml(); }
  // 일일 업무보고 머리 아래 줄: 시트 상태 + [시트에 올리기] (오늘을 볼 때만)
  function rpSheetTools(d) {
    if (!rpSheetOn() || d !== today()) return '';
    return '<div class="rp-sheet-bar">' + rpSheetStatusHtml() +
      '<button class="btn sm" data-act="rp-sheet-push" title="오늘 이행내용·미진행 과제를 구글 시트의 내 칸(8·9행)에 지금 써요">⇪ 시트에 올리기</button></div>';
  }

  /* ---------- 업무보고: 사업별 (사업 → 사람 → 업무) ---------- */
  function rpByProject(members, d, kind) {
    var items = members.reduce(function (a, n) { return a.concat(rpItems(n, d, kind)); }, []);
    return rpGroup(items, 'project');
  }
  // 이 범위에 업무가 없는 사업 (참여자가 있는 사업만)
  function rpIdleProjects(g) {
    return S.data.projects.filter(function (p) { return p.members.length && !g.by[p.name]; }).sort(projOrder).map(function (p) { return p.name; });
  }
  function rpProjectCards(members, d, kind) {
    var g = rpByProject(members, d, kind), idle = rpIdleProjects(g);
    var cards = g.order.map(function (pn) {
      var byA = rpGroup(g.by[pn], 'author');
      return '<div class="rp-board-card"><div class="rp-rep-h">[' + esc(pn) + '] <span class="count">' + g.by[pn].length + '건</span></div>' +
        byA.order.map(function (a) {
          return '<div class="rp-sub">' + esc(a) + '</div>' + byA.by[a].slice().sort(rpByOrder).map(function (t) {
            return '<div class="rp-line">- ' + esc(t.content) + (t.note ? ' <span class="rp-nt">(' + esc(t.note) + ')</span>' : '') + '</div>';
          }).join('');
        }).join('') + '</div>';
    }).join('');
    return (cards || '<div class="empty"><strong>' + (kind === '주간' ? '이 주에' : '이 날짜에') + ' 기록한 업무가 없어요</strong></div>') +
      (idle.length ? '<div class="rp-board-card rp-idle"><div class="rp-rep-h">진행사항 없는 사업</div><div class="rp-line">* ' + esc(idle.join(', ')) + '</div></div>' : '');
  }
  function rpCopyByProject(members, d, kind) {
    var g = rpByProject(members, d, kind), idle = rpIdleProjects(g);
    var txt = g.order.map(function (pn) {
      var byA = rpGroup(g.by[pn], 'author');
      return '[' + pn + ']\n' + byA.order.map(function (a) { return '[' + personCodeOf(a) + ']\n' + byA.by[a].slice().sort(rpByOrder).map(rpLine).join('\n'); }).join('\n');
    }).join('\n\n');
    return txt + (txt && idle.length ? '\n\n* 진행사항 없음: ' + idle.join(', ') : '');
  }
  function copyText(txt, okMsg) {
    okMsg = okMsg || '이행내용을 복사했어요. 메신저나 메일에 붙여 넣으세요.';
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? okMsg : '복사하지 못했어요. 내용을 직접 선택해 복사해 주세요.', ok ? '' : 'error');
    }
    if (!txt) { toast('복사할 이행내용이 없어요.', 'error'); return; }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function () { toast(okMsg); }, fallback);
    else fallback();
  }

  /* ---------- 붙여넣기: 한 번에 적으면 사업·날짜별로 나눔 ----------
   *   10/28            ← 날짜 줄 (어제·오늘·월요일도 됨). 아래 줄은 그날로 (일간만)
   *   [HBM]            ← 사업 머리글. 아래 줄은 그 사업으로 ([HBM] 내용 처럼 한 줄에 써도 됨)
   *   - 내용(to 누구)  ← 한 줄 = 업무 하나. 끝의 (to/from/w …)는 비고로
   * 60자가 넘거나 ‘~했습니다’처럼 끝나는 설명문은 저장하지 않고 붙여넣기 칸에 남겨 둠 (skip) */
  var RP_DATELINE = /^\[?\s*(?:(\d{1,2})\s*[\/월.\-]\s*(\d{1,2})\s*일?|(어제|오늘|그저께|그제)|([월화수목금토일])\s*요일)\s*(?:\([^)]*\))?\s*\]?\s*[:：]?\s*$/;
  var RP_HEAD = /^\[([^\[\]]{1,20})\]\s*[:：]?\s*(.*)$/;
  var RP_BULLET = /^\s*(?:[-–—•·*]|>{1,2}|\d+[.)])\s*/;
  var RP_SENT = /[다요죠까!?.]\s*$/;
  var RP_NOTE = /\(([^()]*)\)\s*$/;
  var RP_NOTEHEAD = /^(to|from|w|with|t\.|f\.|to\.|w\.|from\.)(\s|$)/i;
  function rpNormName(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }
  function rpFindProject(label) {
    var key = rpNormName(label), hit = rpProjects().filter(function (p) { return rpNormName(p.name) === key; })[0];
    return hit ? hit.name : null;
  }
  function rpSplitNote(txt) {
    var c = String(txt || '').trim(), note = '', m = c.match(RP_NOTE);
    if (m && RP_NOTEHEAD.test(m[1].trim())) { note = m[1].trim(); c = c.replace(RP_NOTE, '').trim(); }
    return { content: c, note: note };
  }
  function rpResolveDate(m, base) {
    if (m[1] && m[2]) {
      var y = +base.slice(0, 4), d = y + '-' + ('0' + m[1]).slice(-2) + '-' + ('0' + m[2]).slice(-2);
      return d > rpAddDays(base, 60) ? (y - 1) + d.slice(4) : d; // 두 달 넘게 뒤면 작년 날짜로
    }
    if (m[3]) return m[3] === '오늘' ? base : m[3] === '어제' ? rpAddDays(base, -1) : rpAddDays(base, -2);
    if (m[4]) { var want = DOW.indexOf(m[4]), d2 = base; for (var i = 0; i < 7; i++) { if (new Date(d2 + 'T00:00:00Z').getUTCDay() === want) return d2; d2 = rpAddDays(d2, -1); } }
    return base;
  }
  function rpParsePaste(raw, base, kind) {
    var out = [], pj = null, head = '', dt = base;
    String(raw || '').split(/\r?\n/).forEach(function (line) {
      var s = line.trim();
      if (!s) return;
      var dm = s.match(RP_DATELINE);
      if (dm) { if (kind === '일간') dt = rpResolveDate(dm, base); return; } // 주간은 날짜 줄을 무시 (모두 그 주)
      var body = s, hm = s.match(RP_HEAD);
      if (hm) {
        head = hm[1].trim(); pj = rpFindProject(head);
        if (pj === null && head === '?') pj = null;
        body = hm[2].trim();
        if (!body) return;
      }
      body = body.replace(RP_BULLET, '').trim();
      if (!body) return;
      var sp = rpSplitNote(body);
      var skip = sp.content.length > 60 || RP_SENT.test(sp.content);
      out.push({ date: dt, project: pj || '', head: pj ? '' : head, unknown: !pj, content: sp.content, note: sp.note,
        status: kind === '일간' ? '완료' : '진행중', include: !skip, skip: skip });
    });
    return out;
  }
  // Claude(또는 다른 AI)에 넣을 지시문: 자유롭게 쓴 업무를 위 형식으로 정리하게 함
  // team: 팀 업무 붙여넣기용 (최근 문장도 팀 업무에서, 내 담당 사업은 빼고)
  function rpPromptText(kind, team) {
    var names = rpProjects().map(function (p) { return p.name; });
    var mine = team ? [] : rpAssigned(S.user.name);
    var since = rpAddDays(today(), -30), seen = {}, recent = [];
    (S.data.reports || []).filter(function (r) {
      return !r.linkKey && (team ? r.team === 'Y' : r.team !== 'Y' && r.author === S.user.name) && r.date >= since && r.project;
    })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
      .forEach(function (r) { if (recent.length < 15 && !seen[r.content]) { seen[r.content] = true; recent.push('[' + r.project + '] ' + r.content); } });
    return (team ? '아래에 이번 주 팀 업무를 적을게.' : kind === '주간' ? '아래에 이번 주 내 업무를 적을게.' : '아래에 내가 한 업무를 적을게.') + ' 다음 형식으로만 정리해서 출력해. 다른 말은 붙이지 마.\n\n' +
      '[사업약어]\n- 업무 내용(to 받는 사람)\n\n규칙\n' +
      '· 사업약어는 이 중에서만: ' + names.join(', ') + '\n' +
      '· 어느 사업인지 확실하지 않으면 [?]로 적어. 추측해서 배정하지 마.\n' +
      '· 한 줄에 업무 하나. 명사형으로 끝내(작성/검토/송부/요청/회의 등). 60자를 넘기지 마.\n' +
      '· "~했습니다" 같은 설명문은 쓰지 마.\n' +
      '· 받는 사람이나 같이 한 사람이 있으면 줄 끝 괄호에 to/from/w로 적어. 괄호 앞은 띄우지 마. 예: 자료 송부(to 김주무관)\n' +
      '· 진행률이나 상태는 쓰지 마.\n' +
      (kind === '주간' ? '· 날짜 줄은 쓰지 마.\n' : '· 여러 날 치면 10/28처럼 날짜를 한 줄로 먼저 적고 그 아래에 그날 업무를 적어.\n') +
      (mine.length ? '\n참고: 내 담당 사업: ' + mine.join(', ') + '\n' : '') +
      (recent.length ? '\n참고: 최근 ' + (team ? '팀 업무' : '내가 쓴') + ' 문장\n' + recent.join('\n') + '\n' : '') +
      (team ? '\n팀 업무:\n' : '\n내 업무:\n');
  }

  /* ---------- 진행현황표 ---------- */
  function rpProgCell(t) {
    if (t.progress === '' || t.progress === undefined) return '<span class="hint">-</span>';
    var v = +t.progress || 0;
    return '<span class="rp-bar"><i style="width:' + v + '%"></i></span><span class="rp-pct">' + v + '%</span>';
  }
  function rpDeadline(t) {
    if (!t.deadline) return '<span class="hint">-</span>';
    var late = t.status !== '완료' && t.deadline < today();
    return '<span class="' + (late ? 'rp-late' : '') + '">' + esc(rpMD(t.deadline)) + '</span>';
  }
  // 고칠 수 있는 사람: 쓴 사람, PI·PEO·PM (연동 항목도 업무보고에서만 고칠 수 있음). 팀 업무는 PI·PEO·PM만 (연구자는 보기만)
  // 지울 수 있는 사람: 쓴 사람, PI·PEO·PM
  function rpCanDelete(r) { return r.author === S.user.name || canBoard(); }
  function rpCanEdit(r) { return r.team === 'Y' ? canBoard() : rpCanDelete(r); }
  function rpEditAttr(t) {
    return t.linked ? ' data-act="rp-edit-link" data-key="' + esc(t.linkKey) + '"' : ' data-act="rp-edit" data-id="' + esc(t.id) + '"';
  }
  function rpLinkTag(t) {
    return '<span class="rp-link" title="' + esc(t.linked) + ' 화면에서 쓴 기록. 눌러서 고치면 업무보고에만 반영돼요">연동·' + esc(t.linked) + '</span>' +
      (t.edited ? '<span class="rp-edited" title="업무보고에서만 고친 내용 (원래 기록은 그대로)">고침</span>' : '');
  }
  function rpCarryTag(t) { return t.carryFrom ? ' <span class="rp-carried" title="지난 주에 안 끝나서 이어받은 업무">이월</span>' : ''; }
  /* 팀 업무 수정 기록: 누가·언제·무엇을 바꿨는지 (최신 → 이전) */
  function rpTeamLogs(id) {
    return (S.data.reportLogs || []).filter(function (l) { return l.reportId === id; })
      .sort(function (a, b) { return a.createdAt !== b.createdAt ? (a.createdAt < b.createdAt ? 1 : -1) : 0; });
  }
  function rpWhen(s) { s = String(s || ''); return s ? fmtDate(s.slice(0, 10)) + ' ' + s.slice(11, 16) : ''; }
  // withActs: PI·PEO·PM에게 ‘수정(내가 남긴 기록만)·삭제’ 단추 (등록 기록은 빼고). 연구자는 보기만
  function rpLogText(l, withActs) {
    var w = canBoard(), mine = w && l.author === S.user.name;
    var acts = withActs && w && l.changes !== '등록'
      ? '<span class="rp-log-acts">' + (mine ? '<button type="button" class="link" data-act="rp-log-edit" data-id="' + esc(l.id) + '">수정</button>' : '') +
        '<button type="button" class="link danger" data-act="rp-log-del" data-id="' + esc(l.id) + '">삭제</button></span>' : '';
    return '<span class="ml-log-when">' + esc(rpWhen(l.createdAt)) + '</span><b class="ml-log-who">' + esc(l.author) + '</b>' +
      (l.changes === '등록' ? '<span class="tag">등록</span> ' + rpChip(l.status) : (l.changes ? '<span class="rp-log-chg">' + esc(l.changes) + '</span>' : '')) +
      (l.memo ? '<span class="ml-log-memo">' + esc(l.memo) + '</span>' : '') + // + 다음 단계로 남긴 진행 내용
      (l.editedAt ? '<span class="hint rp-log-edited">(고침)</span>' : '') + acts;
  }
  // 수정 창 아래 수정 기록 (기록이 있을 때만. 최신이 맨 위, 이전은 ‘이전 n’ 뒤에)
  function rpHistoryBlock(logs) {
    if (!logs.length) return '';
    return '<div class="fld ml-hist"><span class="lbl">진행 기록 <span class="hint">누가 어떻게 바꿨는지 · 최신이 맨 위</span></span>' +
      '<div class="ml-hist-front">' + rpLogText(logs[0], true) + '</div>' +
      (logs.length > 1 ? '<button type="button" class="stack-btn" id="rp-hist-more" aria-expanded="false">이전 ' + (logs.length - 1) + '</button>' +
        '<div class="ml-hist-back" id="rp-hist-back" hidden>' + logs.slice(1).map(function (l) { return '<div class="ml-hist-item"><span class="stack-mark" aria-hidden="true">↳</span>' + rpLogText(l, true) + '</div>'; }).join('') + '</div>' : '') +
      '</div>';
  }
  // 표에서 쌓인 수정 기록 펼치기/접기 (다시 그리지 않고 줄만)
  function rpToggleStack(id) {
    S.rpStack = S.rpStack || {};
    var open = !S.rpStack[id];
    if (open) S.rpStack[id] = true; else delete S.rpStack[id];
    $$('#view tr[data-rpstack]').forEach(function (tr) { if (tr.getAttribute('data-rpstack') === id) tr.hidden = !open; });
    $$('#view .stack-btn[data-act="rp-stack"]').forEach(function (b) {
      if (b.getAttribute('data-id') !== id) return;
      b.classList.toggle('on', open); b.setAttribute('aria-expanded', open);
      b.title = b.title.replace(/(보기|접기)$/, open ? '접기' : '보기');
    });
  }
  // authorLabel: 사람 칸 이름 (기본 ‘담당자’, 팀 업무는 ‘작성자’)
  // 팀 업무 줄에는 진행상태 옆 ‘기록 n’ 단추, 그 아래에 수정 기록이 스택으로 쌓임 (최신이 맨 위)
  // withStep: 맨 오른쪽 관리 칸에 ‘+ 다음 단계’ (팀 업무 표, PI·PEO·PM에게만)
  // 사업별로 묶을 때(기본)는 사업 칸 없이 사업 이름 줄 아래에 그 사업 업무를 모아 보여 줌 (사업 이름이 줄마다 반복되지 않게)
  function rpTable(items, groupBy, showAuthor, authorLabel, emptyMsg, withStep) {
    if (!items.length) return '<div class="empty"><strong>' + (emptyMsg || '해당하는 업무가 없어요') + '</strong></div>';
    var byPerson = groupBy === 'person', projCol = byPerson; // 사람별로 묶을 때만 사업 칸
    var g = rpGroup(items, byPerson ? 'author' : 'project');
    var cols = (projCol ? 1 : 0) + (showAuthor ? 6 : 5) + (withStep ? 1 : 0);
    // 화면 높이 안에서 스크롤 → 머리글이 늘 위에 보임
    return '<div class="tbl-wrap"><table class="tbl rp-tbl"><thead><tr>' + (projCol ? '<th>사업</th>' : '') + (showAuthor ? '<th>' + esc(authorLabel || '담당자') + '</th>' : '') +
      '<th>세부내용</th><th>마감일</th><th>진행상태</th><th>진행도</th><th>비고</th>' + (withStep ? '<th class="sticky-act">관리</th>' : '') + '</tr></thead><tbody>' +
      g.order.map(function (k) {
        return '<tr class="rp-grp"><td colspan="' + cols + '"><span class="rp-grp-name">' + esc(k) + '</span> <span class="count">' + g.by[k].length + '건</span></td></tr>' +
          g.by[k].slice().sort(rpByOrder).map(function (t) {
            // 고칠 수 있는 줄만 눌러서 고침 (팀 업무는 PI·PEO·PM만, 연구자는 보기만)
            var rowAct = rpCanEdit(t) ? ' class="clickable"' + rpEditAttr(t) : '';
            var logs = t.team === 'Y' ? rpTeamLogs(t.id) : [], sOpen = !!(S.rpStack && S.rpStack[t.id]);
            var stack = logs.length ? '<button type="button" class="stack-btn' + (sOpen ? ' on' : '') + '" data-act="rp-stack" data-id="' + esc(t.id) + '" aria-expanded="' + sOpen + '" title="진행 기록 ' + logs.length + '건 ' + (sOpen ? '접기' : '보기') + '">기록 ' + logs.length + '</button>' : '';
            return '<tr' + rowAct + '>' +
              (projCol ? '<td><b>' + esc(t.project || '기타') + '</b></td>' : '') + (showAuthor ? '<td class="rp-who">' + esc(t.author) + '</td>' : '') +
              '<td class="wrap">' + esc(t.content) + (t.linked ? ' ' + rpLinkTag(t) : '') + rpCarryTag(t) + '</td>' +
              '<td class="date">' + rpDeadline(t) + '</td><td class="rp-st-cell">' + rpChip(t.status) + stack + '</td><td class="rp-prog-cell">' + rpProgCell(t) + '</td>' +
              '<td class="note">' + esc(t.note || '') + '</td>' +
              // 관리: + 다음 단계만 (삭제는 줄을 눌러 여는 창에서)
              (withStep ? '<td class="sticky-act"><div class="actions">' + (t.team === 'Y' ? '<button class="btn sm ghost" data-act="rp-step" data-id="' + esc(t.id) + '">+ 다음 단계</button>' : '') +
                '</div></td>' : '') +

              // 진행 기록 스택 (최신 → 이전). 내가 남긴 기록에는 수정·삭제
              logs.map(function (l, i) {
                return '<tr class="stack-back rp-log-row' + (i === 0 ? ' rp-log-latest' : '') + '" data-rpstack="' + esc(t.id) + '"' + (sOpen ? '' : ' hidden') + '><td colspan="' + cols + '">' +
                  '<span class="stack-mark" aria-hidden="true">↳</span>' + (i === 0 ? '<span class="tag ml-latest">최신</span>' : '') + rpLogText(l, true) + '</td></tr>';

          }).join('');

  /* ---------- 업무 입력칸 (오른쪽 위 기록칸과 수정 창이 같이 씀) ---------- */
  // 주간 업무를 완료로 두면 묻는 칸: 일간 이행내용에 넣을까요? (넣기/넣지 않기 + 날짜, 기본 오늘)
  // 이미 완료된 업무는 지금 값(넣은 날 / 넣지 않음 / 예전 업무는 완료한 날)을 보여 줌
  function rpDailyFld(r) {
    var on = !(r && r.status === '완료' && r.dailyDate === 'N');
    var dd = r && r.status === '완료' && r.dailyDate && r.dailyDate !== 'N' ? r.dailyDate : (r && r.status === '완료' && !r.dailyDate && r.doneDate ? r.doneDate : today());
    return '<div class="fld rp-daily"' + (r && r.status === '완료' ? '' : ' hidden') + '><span class="lbl">일간 이행내용에 넣을까요? <span class="hint">고른 날의 일일 업무보고에 들어가요 · 기본 오늘</span></span>' +
      '<div class="rp-daily-row"><div class="seg-group rp-st" role="radiogroup" aria-label="일간에 넣기">' +
      '<label class="seg-opt"><input type="radio" name="dailyOn" value="Y"' + (on ? ' checked' : '') + '><span>넣기</span></label>' +
      '<label class="seg-opt"><input type="radio" name="dailyOn" value="N"' + (on ? '' : ' checked') + '><span>넣지 않기</span></label></div>' +
      '<input type="date" class="inp" name="dailyDate" value="' + esc(dd) + '" max="' + today() + '" aria-label="일간에 넣을 날짜"' + (on ? '' : ' disabled') + '></div></div>';
  }
  // daily: 주간 업무 칸 (완료일 때 일간에 넣을지 묻는 칸을 함께 그림)
  function rpFields(r, defDeadline, daily) {
    // 사업 기본값: 마지막에 고른 사업, 없으면 목록의 첫 사업. ‘기타 (사업 없음)’는 목록 맨 아래
    var projs = rpProjects(), cur = r ? r.project : (S.rp.lastProject || (projs[0] ? projs[0].name : ''));
    var opts = projs.map(function (p) { return [p.name, p.name]; });
    if (cur && !projs.some(function (p) { return p.name === cur; })) opts.push([cur, cur]);
    var st = r ? r.status : '진행중', prog = r ? (+r.progress || 0) : 0;
    var lock = st === '대기' || st === '완료', dis = lock ? ' disabled' : '';
    if (st === '대기') prog = 0;
    if (st === '완료') prog = 100;
    return '<label class="fld"><span class="lbl">사업</span><select class="inp" name="project">' + options(opts, cur) +
      '<option value=""' + (cur ? '' : ' selected') + '>기타 (사업 없음)</option></select></label>' +
      '<label class="fld"><span class="lbl">마감일</span><input type="date" class="inp" name="deadline" value="' + esc(r ? r.deadline : (defDeadline || '')) + '"></label>' +
      '<label class="fld"><span class="lbl">세부내용 <em>*</em></span><textarea class="inp" name="content" rows="3" maxlength="1000" placeholder="예: 3차년도 중간보고서 초안 작성">' + esc(r ? r.content : '') + '</textarea></label>' +
      '<label class="fld"><span class="lbl">비고</span><input class="inp" name="note" maxlength="300" placeholder="후속 조치 등 (선택)" value="' + esc(r ? r.note : '') + '"></label>' +
      '<div class="fld"><span class="lbl">진행상태 <em>*</em></span><div class="seg-group rp-st" role="radiogroup" aria-label="진행상태">' + L.REPORT_STATUSES.map(function (s) {
        return '<label class="seg-opt"><input type="radio" name="status" value="' + s + '"' + (s === st ? ' checked' : '') + '><span>' + s + '</span></label>';
      }).join('') + '</div></div>' +
      '<div class="fld"><span class="lbl">진행도 <span class="hint">대기 0 · 완료 100</span></span><div class="rp-prog">' +
      '<input type="range" min="0" max="100" step="5" name="progRange" value="' + prog + '" aria-label="진행도"' + dis + '>' +
      '<input type="number" class="inp num" min="0" max="100" name="progress" value="' + prog + '" aria-label="진행도 숫자"' + dis + '><span>%</span>' +
      '<span class="rp-quick">' + [0, 25, 50, 75, 100].map(function (n) { return '<button type="button" class="btn sm" data-rp-prog="' + n + '"' + dis + '>' + n + '</button>'; }).join('') + '</span></div></div>' +
      (daily ? rpDailyFld(r) : '');
  }
  function rpCurStatus(form) { var c = form.querySelector('input[name=status]:checked'); return c ? c.value : '진행중'; }
  // 이 칸의 업무가 주간인지 (수정 창은 구분 고르기, 추가 칸은 data-kind)
  function rpFormKind(form) { return form.kind && form.kind.value ? form.kind.value : (form.getAttribute('data-kind') || ''); }
  // 대기는 0, 완료는 100으로 고정. 주간 업무를 완료로 두면 ‘일간에 넣을까요?’ 칸을 보여 줌
  function rpSyncProg(form) {
    var st = rpCurStatus(form), lock = st === '대기' || st === '완료';
    if (st === '대기') { form.progress.value = 0; form.progRange.value = 0; }
    if (st === '완료') { form.progress.value = 100; form.progRange.value = 100; }
    form.progress.disabled = form.progRange.disabled = lock;
    $$('[data-rp-prog]', form).forEach(function (b) { b.disabled = lock; });
    var df = form.querySelector('.rp-daily');
    if (df) {
      df.hidden = !(st === '완료' && rpFormKind(form) === '주간');
      var on = form.querySelector('input[name=dailyOn]:checked');
      form.dailyDate.disabled = !!on && on.value === 'N';
    }
  }
  function rpPayload(form) {
    var payload = { project: form.project.value, deadline: form.deadline.value, content: form.content.value.trim(), note: form.note.value.trim(), status: rpCurStatus(form), progress: form.progress.value };
    if (!payload.content) { toast('세부내용을 입력해 주세요.', 'error'); form.content.focus(); return null; }
    // 주간 업무를 완료로 둘 때: 일간에 넣을 날짜 (넣지 않으면 'N')
    var df = form.querySelector('.rp-daily');
    if (df && !df.hidden) {
      var on = form.querySelector('input[name=dailyOn]:checked');
      if (on && on.value === 'N') payload.dailyDate = 'N';
      else {
        var dd = form.dailyDate.value;
        if (!dd) { toast('일간에 넣을 날짜를 골라 주세요.', 'error'); form.dailyDate.focus(); return null; }
        if (dd > today()) { toast('일간에 넣을 날짜는 오늘 이후로 고를 수 없어요.', 'error'); form.dailyDate.focus(); return null; }
        payload.dailyDate = dd;
      }
    }
    return payload;
  }
  // 쓰는 중인 내용 기억 (자동 새로고침으로 화면을 다시 그려도 남게)
  function rpSaveDraft(form) {
    if (form.id !== 'rp-form') return;
    // dlSet: 마감일을 직접 고쳤는지 (안 고쳤으면 날짜를 바꿀 때 마감일도 그날 / 그 주 금요일로 따라감)
    S.rp.draft = { project: form.project.value, deadline: form.deadline.value, content: form.content.value, note: form.note.value, status: rpCurStatus(form), progress: form.progress.value,
      dlSet: !!(S.rp.draft && S.rp.draft.dlSet) };
  }
  function rpFormEvent(e) {
    var f = e.target.closest && e.target.closest('form.rp-form-box');
    if (!f) return;
    if (e.type === 'change' && (e.target.name === 'status' || e.target.name === 'dailyOn' || e.target.name === 'kind')) rpSyncProg(f);
    if (e.type === 'input' && e.target.name === 'progRange') f.progress.value = e.target.value;
    if (e.type === 'input' && e.target.name === 'progress') f.progRange.value = e.target.value;
    rpSaveDraft(f);
    if (e.target.name === 'deadline' && f.id === 'rp-form') S.rp.draft.dlSet = true;
  }
  document.addEventListener('change', rpFormEvent);
  document.addEventListener('input', rpFormEvent);

  /* ---------- 화면 ---------- */
  function viewReport() {
    var d = rpDay(), kind = S.rp.kind;
    // 하위 탭: 내 업무 · 팀 업무(주간, PEO 모두) · 전체 현황(일간·주간, PI·PEO·PM)
    var tabs = [['mine', '내 업무'], ['team', '팀 업무']].concat(canBoard() ? [['board', '전체 현황']] : []);
    var view = tabs.some(function (t) { return t[0] === S.rp.view; }) ? S.rp.view : 'mine';
    var head = '<div class="view-head"><h1>업무보고</h1></div>';
    var nav = '<div class="subtabs" role="tablist">' + tabs.map(function (t) {

    var team = view === 'team', k = team ? '주간' : kind;

    var filters = '<div class="filters rp-filters">' +
      (team ? '<span class="tag rp-week-tag">주간</span>' : '<div class="seg-group" role="radiogroup" aria-label="일간·주간">' + L.REPORT_KINDS.map(function (x) {
        return '<button type="button" class="seg-btn' + (kind === x ? ' on' : '') + '" data-act="rp-kind" data-kind="' + x + '">' + x + ' 업무</button>';
      }).join('') + '</div>') +
      '<span class="rp-datenav"><button type="button" class="btn sm" data-act="rp-day" data-step="-' + step + '" aria-label="이전">‹</button>' +
      '<input type="date" class="inp" data-filter="rp.date" value="' + esc(d) + '" aria-label="날짜">' +
      '<button type="button" class="btn sm" data-act="rp-day" data-step="' + step + '" aria-label="다음">›</button>' +
      '<button type="button" class="btn sm" data-act="rp-day" data-step="0">' + (k === '주간' ? '이번 주' : '오늘') + '</button></span>' +
      '<b class="rp-scope">' + esc(rpScopeLabel(k)) + '</b></div>';
    return head + nav + filters + (view === 'board' ? rpBoardView(d, kind) : team ? rpTeamView(d) : rpMineView(d, kind));
  }

  /* ---------- 팀 업무: PI·PEO·PM이 쓰고 PEO 모두가 공지처럼 보는 주간 업무 ----------
   * 주간(그 주) 단위만. PI·PEO·PM: 왼쪽 붙여넣기 칸(내 업무 붙여넣기와 같은 형식) + 표(눌러서 고치기, + 다음 단계)
   * 연구자: 표만 (고치기·다음 단계 없이 보기만, 진행 기록은 ‘기록 n’으로 볼 수 있음)
   * 내 업무 > 주간 업무와는 연동되지 않음 */
  function rpTeamView(d) {

    if (!pm) return listBox;

    var formBox = '<section class="panel"><div class="panel-head"><h2>팀 업무 추가</h2><span class="h-sub">' + esc(rpScopeLabel('주간')) + '</span></div>' +

  // 팀 업무 복사: [사업] 아래 - 내용 (모든 계정 같음)
  function rpTeamCopyText(d) {
    var g = rpGroup(rpTeam(d), 'project');
    return g.order.map(function (pn) { return '[' + pn + ']\n' + g.by[pn].slice().sort(rpByOrder).map(rpLine).join('\n'); }).join('\n\n');
  }
  // 붙여넣기 칸: 저장을 누르면 바로 나눠서 저장, 고칠 것은 내 진행현황 카드(팀 업무는 표의 줄)를 눌러 고침
  // team: 팀 업무 추가 칸 (쓰던 글은 S.rp.teamPasteText에 따로 기억)
  function rpPasteBox(d, kind, team) {

      : kind === '일간' ? '10/28\n[HBM]\n- 중간보고서 초안 작성(to 김주무관)\n- 자문회의 자료 정리\n[KIND]\n- 마약류 데이터 정제' : '[HBM]\n- 3차년도 중간보고서 작성\n[KIND]\n- 분석 결과 정리';

  document.addEventListener('input', function (e) {

  // 주간: 최근 4주 안 끝난 주간 업무 (진행도 100% 아니고 완료·보류 아님, 아직 이어받지 않은 것)
  function rpCarryCands(me, d) {
    var w = L.mondayOf(d), from = rpAddDays(w, -28), list = S.data.reports || [];

      if (r.status === '완료' || r.status === '보류' || (+r.progress || 0) >= 100) return false;
      if (list.some(function (x) { return x.carryFrom === r.id; })) return false;
      return !cur.some(function (x) { return x.project === r.project && String(x.content).trim() === String(r.content).trim(); });
    }).sort(function (a, b) { return a.date !== b.date ? (a.date < b.date ? 1 : -1) : rpByOrder(a, b); });
  }
  function rpCarryBox(me, d) {

      (open ? '<div class="rp-pad"><div class="rp-carry-list">' + list.map(function (r) {

  function rpCarryPicked() { return $$('[data-carry]:checked').map(function (x) { return x.getAttribute('data-carry'); }); }

  function rpMineView(d, kind) {
    var me = S.user.name;
    var all = kind === '일간' ? rpLinkedAll(me, d) : [];
    var own = rpOwn(me, kind, d), linked = all.filter(function (t) { return !t.hidden; }), hiddenN = all.length - linked.length;
    // 일간: 주간 업무를 완료하며 이 날 일간에 넣은 것도 카드로 (눌러서 고치기, ×는 이 날 일간에서만 빼기)

    var dl = dr && dr.dlSet ? dr.deadline : (kind === '일간' ? d : rpWeekEnd(d));

    var mode = S.rp.inMode === 'line' ? 'line' : 'paste';

      '<span class="spacer"></span><div class="seg-group" role="tablist" aria-label="입력 방식">' + [['paste', '붙여넣기'], ['line', '한 줄 추가']].map(function (t) {
