      }).join('') + '</div></div>' +
      (mode === 'paste' ? rpPasteBox(d, kind) :
        '<form class="form rp-form-box rp-pad" id="rp-form" data-kind="' + esc(kind) + '" autocomplete="off" novalidate>' +
        rpFields(dr ? { project: dr.project, deadline: dl, content: dr.content, note: dr.note, status: dr.status, progress: dr.progress } : null, dl, kind === '주간') +
        '<button type="button" class="btn primary" data-act="rp-add">＋ 추가 (' + esc(rpScopeLabel()) + ' · ' + kind + ')</button></form>') + '</section>';
    // 내 진행현황: 과제별로 묶어서 (과제 순서대로, 과제 안에서는 내가 쓴 것 → 주간에서 넘어온 것 → 연동 순)
    var g = rpGroup(own.slice().sort(rpByOrder).concat(fromWeek, linked), 'project');
    var cards = g.order.map(function (pn) {
      return '<div class="rp-pgroup"><div class="rp-pgroup-h"><b>' + esc(pn) + '</b><span class="count">' + g.by[pn].length + '건</span></div>' +
        g.by[pn].map(function (t) { return rpCard(t, true); }).join('') + '</div>';
    }).join('');
    var listBox = '<section class="panel rp-col"><div class="panel-head"><h2>내 진행현황</h2><span class="count">' + (own.length + fromWeek.length + linked.length) + '건</span>' +
      (fromWeek.length ? '<span class="rp-daily-tag" title="주간 업무를 완료하면서 이 날 일간에 넣은 업무">주간 완료 ' + fromWeek.length + '건</span>' : '') +
      (linked.length ? '<span class="rp-link" title="유지보수 진행사항·사업 진행사항에서 이 날 쓴 기록이 자동으로 들어와요">연동 ' + linked.length + '건</span>' : '') +
      (hiddenN ? '<span class="spacer"></span><button class="btn sm" data-act="rp-hidden-list" title="업무보고에서만 지운 연동 업무 (다시 넣을 수 있어요)">지운 연동 ' + hiddenN + '건</button>' : '') + '</div>' +
      '<div class="rp-pad rp-cards">' + (cards || '<div class="empty"><strong>아직 기록한 업무가 없어요</strong>왼쪽에서 업무를 추가하세요.</div>') + '</div></section>';
    var right = kind === '일간'
      ? '<section class="panel rp-col"><div class="panel-head rp-daily-head"><h2>일일 업무보고</h2><span class="spacer"></span>' +
        '<button class="btn sm primary" data-act="rp-copy" data-who="me">⧉ 이행내용 복사</button></div>' + rpSheetTools(d) +
        '<div class="rp-pad">' + rpNarrative(me, d, false) + '</div></section>'
      : '<section class="panel rp-col"><div class="panel-head"><h2>주간 진행현황</h2><span class="spacer"></span>' +
        // 여러 건 한 번에 완료 (일간에 넣을 항목·날짜를 고름)
        (own.some(function (r) { return r.status !== '완료'; }) ? '<button class="btn sm" data-act="rp-week-done" title="이번 주 안 끝난 업무를 골라 한 번에 완료로 바꿔요. 일간 이행내용에 넣을 항목과 날짜도 골라요">완료 처리</button>' : '') +
        '</div>' + rpTable(own.map(function (r) { return r; }), 'project', false) + '</section>';
    return (kind === '주간' ? rpCarryBox(me, d) : '') + '<div class="rp-grid">' + formBox + listBox + right + '</div>';
  }
  // 완료한 주간 업무: 어느 날 일간 이행내용에 들어갔는지 (넣지 않았으면 그렇게)
  function rpDailyTag(t) {
    if (t.linked || t.team === 'Y' || t.kind !== '주간' || t.status !== '완료') return '';
    var on = rpWeeklyDailyOn(t);
    return t.dailyDate === 'N' ? ' <span class="rp-daily-tag off" title="일간 이행내용에 넣지 않았어요">일간 안 넣음</span>'
      : on ? ' <span class="rp-daily-tag" title="이 날의 일일 업무보고에 들어가요">일간 ' + esc(rpMD(on)) + '</span>' : '';
  }
  // 주간 업무 여러 건을 한 번에 완료: 줄마다 완료로 바꿀지 · 일간에 넣을지 · 넣을 날짜(기본 오늘)를 고름
  // ids가 없으면 보고 있는 주의 안 끝난 내 주간 업무, 있으면 그 업무 (지난 4주 안 끝난 업무에서 고른 것)
  function openWeekDone(ids) {
    var me = S.user.name, list = ids
      ? (S.data.reports || []).filter(function (r) { return ids.indexOf(r.id) >= 0; })
      : rpOwn(me, '주간', rpDay()).filter(function (r) { return r.status !== '완료'; }).sort(rpByOrder);
    if (!list.length) { toast('완료로 바꿀 업무가 없어요.', 'error'); return; }
    var t0 = today();
    var m = openModal({
      title: '주간 업무 완료 처리', size: 'wide',
      body: '<p class="hint" style="margin-top:0">완료로 바꿀 업무를 체크하고, 일일 업무보고(이행내용)에 넣을 날짜를 고르세요. 날짜는 오늘로 들어가 있고 바꿀 수 있어요. 넣지 않을 업무는 ‘일간에 넣기’를 풀어 두세요.</p>' +
        '<div class="tbl-wrap" style="max-height:none"><table class="tbl rp-done-tbl"><thead><tr><th>완료</th><th>업무</th><th>지금</th><th>일간에 넣기</th><th>날짜</th></tr></thead><tbody>' +
        list.map(function (r) {
          return '<tr data-wd="' + esc(r.id) + '"><td><input type="checkbox" class="wd-pick" checked aria-label="완료로 바꾸기"></td>' +
            '<td class="wrap"><b>' + esc(r.project || '기타') + '</b> ' + esc(r.content) + (ids ? ' <span class="hint">' + esc(rpMD(r.date)) + ' 주</span>' : '') + '</td>' +
            '<td class="nowrap">' + rpChip(r.status) + ' ' + rpProgCell(r) + '</td>' +
            '<td><label class="check"><input type="checkbox" class="wd-daily" checked> 넣기</label></td>' +
            '<td><input type="date" class="inp wd-date" value="' + t0 + '" max="' + t0 + '" aria-label="일간에 넣을 날짜"></td></tr>';
        }).join('') + '</tbody></table></div>',
      footer: '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="wd-go">완료 처리</button>'
    });
    // 완료를 풀면 그 줄의 일간 칸도 쓸 수 없게, 일간을 풀면 날짜도
    function sync(tr) {
      var pick = $('.wd-pick', tr).checked, daily = $('.wd-daily', tr);
      daily.disabled = !pick; $('.wd-date', tr).disabled = !pick || !daily.checked;
    }
    m.addEventListener('change', function (e) { var tr = e.target.closest && e.target.closest('tr[data-wd]'); if (tr) sync(tr); });
    var going = false, btn = $('#wd-go', m);
    btn.addEventListener('click', function () {
      if (going) return;
      var picked = [], daily = {}, bad = null;
      $$('tr[data-wd]', m).forEach(function (tr) {
        if (!$('.wd-pick', tr).checked) return;
        var id = tr.getAttribute('data-wd'), dd = $('.wd-date', tr).value;
        picked.push(id);
        if (!$('.wd-daily', tr).checked) { daily[id] = 'N'; return; }
        if (!dd || dd > t0) bad = bad || $('.wd-date', tr);
        daily[id] = dd;
      });
      if (!picked.length) { toast('완료로 바꿀 업무를 체크해 주세요.', 'error'); return; }
      if (bad) { toast('일간에 넣을 날짜를 오늘이나 그 전으로 골라 주세요.', 'error'); bad.focus(); return; }
      going = true; btn.disabled = true;
      call('setReportsStatus', { ids: picked, status: '완료', daily: daily }).then(function (res) {
        closeModal(); applyState(res);
        var n = picked.filter(function (id) { return daily[id] !== 'N'; }).length;
        toast(picked.length + '건을 완료로 바꿨어요' + (n ? ' · 일간에 ' + n + '건 넣었어요' : '') + '.');
      }, function () { going = false; btn.disabled = false; });
    });
  }
  // 카드 오른쪽 위 × : 내가 쓴 업무는 삭제, 연동(유지보수·사업 기록) 업무는 업무보고에서만 빼기 (원래 기록은 그대로)
  // 누르면 확인 창이 뜨고, 카드를 눌러 여는 수정 창의 삭제와 같음
  function rpCardDel(t) {
    // 주간에서 넘어온 카드: 주간 업무는 그대로 두고 이 날 일간 이행내용에서만 뺌
    if (t.viaWeekly) {
      return rpCanEdit(t) ? '<button type="button" class="rp-card-x" data-act="rp-daily-out" data-id="' + esc(t.id) + '" aria-label="일간에서 빼기" title="이 날 일간 이행내용에서만 빼요 (주간 업무는 완료 그대로)">×</button>' : '';
    }
    if (t.linked) {
      return rpCanEdit(t) ? '<button type="button" class="rp-card-x" data-act="rp-link-hide" data-key="' + esc(t.linkKey) + '" aria-label="업무보고에서 삭제" title="업무보고에서만 지워요 (원래 ' + esc(t.linked) + ' 기록은 그대로)">×</button>' : '';
    }
    return rpCanDelete(t) ? '<button type="button" class="rp-card-x" data-act="rp-del" data-id="' + esc(t.id) + '" aria-label="삭제" title="삭제">×</button>' : '';
  }
  // inGroup: 과제 묶음 안의 카드 (과제 이름은 묶음 제목에 있으니 빼고)
  function rpCard(t, inGroup) {
    var edit = rpCanEdit(t), del = rpCardDel(t);
    return '<div class="rp-card' + (t.linked ? ' linked' : '') + (t.viaWeekly ? ' from-week' : '') + (edit ? ' clickable' : '') + (del ? ' has-x' : '') + '"' + (edit ? rpEditAttr(t) : '') + '>' + del +
      '<div class="rp-card-h">' + (inGroup ? '' : '<b>' + esc(t.project || '기타') + '</b>') + rpChip(t.status) +
      (t.linked ? rpLinkTag(t) : '') + rpCarryTag(t) +
      (t.viaWeekly ? '<span class="rp-daily-tag" title="주간 업무를 완료하면서 이 날 일간에 넣은 업무예요. 눌러서 날짜를 바꾸거나 뺄 수 있어요">주간 업무</span>' : rpDailyTag(t)) +
      '<span class="spacer"></span>' + (t.deadline ? '<span class="rp-dl">마감 ' + rpDeadline(t) + '</span>' : '') + '</div>' +
      '<div class="rp-card-b">' + esc(t.content) + (t.note ? '<div class="rp-nt">' + esc(t.note) + '</div>' : '') + '</div>' +
      '<div class="rp-card-f">' + rpProgCell(t) + '</div></div>';
  }
  // 전체 현황(일간·주간): 사람별(연구원마다 업무보고) / 사업별(사업 → 사람 → 업무) / 진행현황표
  function rpBoardMembers(d, kind) { return rpMembers(rpOwn(null, kind, d).map(function (r) { return r.author; })); }
  function rpBoardView(d, kind) {
    var members = rpBoardMembers(d, kind);
    var items = members.reduce(function (a, n) { return a.concat(rpItems(n, d, kind)); }, []);
    var wrote = members.filter(function (n) { return items.some(function (t) { return t.author === n; }); });
    var missing = members.filter(function (n) { return wrote.indexOf(n) < 0; });
    var mode = ['person', 'project', 'table'].indexOf(S.rp.board) >= 0 ? S.rp.board : 'person';
    var copyBtn = mode === 'person' ? '<button class="btn sm primary" data-act="rp-copy" data-who="all">⧉ 이행내용 복사 (사람별 전체)</button>'
      : mode === 'project' ? '<button class="btn sm primary" data-act="rp-copy" data-who="project">⧉ 이행내용 복사 (사업별 전체)</button>' : '';
    var tools = '<div class="panel-head"><div class="seg-group">' + [['person', '사람별'], ['project', '사업별'], ['table', '진행현황표']].map(function (t) {
        return '<button type="button" class="seg-btn' + (mode === t[0] ? ' on' : '') + '" data-act="rp-board" data-mode="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      '<span class="count">작성 ' + wrote.length + ' / ' + members.length + '명</span>' +
      (missing.length ? '<span class="rp-missing">작성 안 함: ' + esc(missing.join(', ')) + '</span>' : '') +
      '<span class="spacer"></span>' + copyBtn + '</div>';
    var body = mode === 'person'
      ? '<div class="rp-pad rp-board-grid">' + members.map(function (n) { return '<div class="rp-board-card">' + rpNarrative(n, d, true, kind, true) + '</div>'; }).join('') + '</div>'
      : mode === 'project' ? '<div class="rp-pad rp-board-grid">' + rpProjectCards(members, d, kind) + '</div>'
        : rpTable(items, 'project', true);
    return '<section class="panel">' + tools + body + '</section>';
  }

  /* ---------- 수정 창 ---------- */
  function openReportModal(id) {
    var r = (S.data.reports || []).filter(function (x) { return x.id === id; })[0];
    if (!r || !rpCanEdit(r)) return;
    var team = r.team === 'Y';
    var m = openModal({
      title: (team ? '팀 업무 수정 · 작성 ' : '업무 수정 · ') + r.author, size: 'wide',
      body: '<form class="form rp-form-box" id="rp-edit-form" autocomplete="off" novalidate>' +
        // 팀 업무는 주간만: 구분 고르기 없이 ‘주’만 (그 주 아무 날을 골라도 월요일로 저장)
        (team
          ? '<div class="form-grid"><label class="fld"><span class="lbl">주 <span class="hint">그 주 아무 날을 고르면 돼요</span></span><input type="date" class="inp" name="date" value="' + esc(r.date) + '"></label>' +
            '<div class="fld"><span class="lbl">구분</span><div class="ml-status-now"><span class="tag rp-week-tag">주간</span></div><input type="hidden" name="kind" value="주간"></div></div>'
          : '<div class="form-grid"><label class="fld"><span class="lbl">구분</span><select class="inp" name="kind">' + options(L.REPORT_KINDS, r.kind) + '</select></label>' +
            '<label class="fld"><span class="lbl">날짜 <span class="hint">주간은 그 주 월요일로 저장</span></span><input type="date" class="inp" name="date" value="' + esc(r.date) + '"></label></div>') +
        rpFields(r, undefined, !team) + (team ? rpHistoryBlock(rpTeamLogs(r.id)) : '') + '</form>',
      // 삭제: 쓴 사람과 PI·PEO·PM만
      footer: (rpCanDelete(r) ? '<span class="left"><button class="btn danger-line" data-act="rp-del" data-id="' + esc(r.id) + '">삭제</button></span>' : '') +
        (team ? '<button class="btn" data-act="rp-step" data-id="' + esc(r.id) + '">+ 다음 단계</button>' : '') +
        '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="rp-save">저장</button>'
    });
    var form = $('#rp-edit-form', m);
    rpSyncProg(form);
    var more = $('#rp-hist-more', m);
    if (more) more.addEventListener('click', function () {
      var back = $('#rp-hist-back', m), open = back.hidden;
      back.hidden = !open; more.classList.toggle('on', open); more.setAttribute('aria-expanded', open);
    });
    var saving = false;
    $('#rp-save', m).addEventListener('click', function () {
      if (saving) return;
      var payload = rpPayload(form);
      if (!payload) return;
      payload.id = r.id; payload.kind = form.kind.value; payload.date = form.date.value || r.date;
      saving = true;
      call('saveReport', payload).then(function (res) {
        if (team) { S.rpStack = S.rpStack || {}; S.rpStack[r.id] = true; } // 고친 기록이 스택 맨 위에 보이게 펼쳐 둠
        closeModal(); applyState(res); toast(team ? '팀 업무를 고쳤어요. 진행 기록에 남았어요.' : '업무를 고쳤어요.');
      }, function () { saving = false; });
    });
  }

  /* 팀 업무 + 다음 단계: 진행상태·진행도를 바꾸고 진행 내용(선택)을 남김 → 수정 기록이 맨 위에 쌓임 (PI·PEO·PM) */
  function openReportStep(id) {
    var r = (S.data.reports || []).filter(function (x) { return x.id === id; })[0];
    if (!r || r.team !== 'Y' || !canBoard()) return;
    var st = r.status, prog = +r.progress || 0, lock = st === '대기' || st === '완료', dis = lock ? ' disabled' : '';
    var m = openModal({
      title: '다음 단계 · ' + (r.project ? '[' + r.project + '] ' : '') + r.content, size: 'wide',
      body: '<form class="form rp-form-box" id="rp-step-form" autocomplete="off" novalidate>' +
        '<p class="ml-step-now">지금 ' + rpChip(st) + ' <span class="rp-pct">' + prog + '%</span>' +
        '<span class="hint">작성 ' + esc(r.author) + ' · 팀 업무</span></p>' +
        '<div class="fld"><span class="lbl">진행상태 <em>*</em></span><div class="seg-group rp-st" role="radiogroup" aria-label="진행상태">' + L.REPORT_STATUSES.map(function (s) {
          return '<label class="seg-opt"><input type="radio" name="status" value="' + s + '"' + (s === st ? ' checked' : '') + '><span>' + s + '</span></label>';
        }).join('') + '</div></div>' +
        '<div class="fld"><span class="lbl">진행도 <span class="hint">대기 0 · 완료 100</span></span><div class="rp-prog">' +
        '<input type="range" min="0" max="100" step="5" name="progRange" value="' + prog + '" aria-label="진행도"' + dis + '>' +
        '<input type="number" class="inp num" min="0" max="100" name="progress" value="' + prog + '" aria-label="진행도 숫자"' + dis + '><span>%</span>' +
        '<span class="rp-quick">' + [0, 25, 50, 75, 100].map(function (n) { return '<button type="button" class="btn sm" data-rp-prog="' + n + '"' + dis + '>' + n + '</button>'; }).join('') + '</span></div></div>' +
        '<label class="fld"><span class="lbl">진행 내용 <span class="hint">선택</span></span><textarea class="inp" name="memo" rows="3" maxlength="1000" placeholder="예: 세부별 원고 3건 취합 완료, 1건 대기" autofocus></textarea></label>' +
        rpHistoryBlock(rpTeamLogs(r.id)) + '</form>',
      footer: (rpCanDelete(r) ? '<span class="left"><button class="btn danger-line" data-act="rp-del" data-id="' + esc(r.id) + '">삭제</button></span>' : '') +
        '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="rp-step-save">기록</button>'
    });
    var form = $('#rp-step-form', m);
    var more = $('#rp-hist-more', m);
    if (more) more.addEventListener('click', function () {
      var back = $('#rp-hist-back', m), open = back.hidden;
      back.hidden = !open; more.classList.toggle('on', open); more.setAttribute('aria-expanded', open);
    });
    var saving = false, btn = $('#rp-step-save', m);
    btn.addEventListener('click', function () {
      if (saving) return; // 두 번 눌러도 한 번만
      var payload = { id: r.id, status: rpCurStatus(form), progress: form.progress.value, memo: form.memo.value.trim() };
      var p2 = payload.status === '대기' ? 0 : payload.status === '완료' ? 100 : (+payload.progress || 0);
      if (payload.status === r.status && p2 === prog && !payload.memo) { toast('진행상태·진행도를 바꾸거나 진행 내용을 적어 주세요.', 'error'); form.memo.focus(); return; }
      saving = true; btn.disabled = true;
      call('addReportStep', payload).then(function (res) {
        S.rpStack = S.rpStack || {}; S.rpStack[r.id] = true; // 남긴 기록이 스택 맨 위에 보이게 펼쳐 둠
        closeModal(); applyState(res); toast('진행 기록을 남겼어요.');
      }, function () { saving = false; btn.disabled = false; });
    });
  }

  /* 내가 남긴 진행 기록 고치기 (진행상태·진행도·진행 내용) · 삭제 (PI·PEO·PM)
   * 가장 최근 기록이면 업무의 진행상태·진행도도 함께 바뀜 */
  function openLogEdit(id) {
    var l = (S.data.reportLogs || []).filter(function (x) { return x.id === id; })[0];
    if (!l || l.author !== S.user.name || !canBoard()) return;
    var r = (S.data.reports || []).filter(function (x) { return x.id === l.reportId; })[0];
    var latest = rpTeamLogs(l.reportId)[0] === l;
    var st = L.REPORT_STATUSES.indexOf(l.status) >= 0 ? l.status : (r ? r.status : '진행중');
    var prog = +l.progress || 0, lock = st === '대기' || st === '완료', dis = lock ? ' disabled' : '';
    if (st === '대기') prog = 0;
    if (st === '완료') prog = 100;
    var m = openModal({
      title: '진행 기록 고치기' + (r ? ' · ' + (r.project ? '[' + r.project + '] ' : '') + r.content : ''), size: 'wide',
      body: '<form class="form rp-form-box" id="rp-log-form" autocomplete="off" novalidate>' +
        '<p class="ml-step-now"><span class="ml-log-when">' + esc(rpWhen(l.createdAt)) + '</span>' + (l.changes ? '<span class="rp-log-chg">' + esc(l.changes) + '</span>' : '') + '</p>' +
        '<div class="fld"><span class="lbl">진행상태</span><div class="seg-group rp-st" role="radiogroup" aria-label="진행상태">' + L.REPORT_STATUSES.map(function (s) {
          return '<label class="seg-opt"><input type="radio" name="status" value="' + s + '"' + (s === st ? ' checked' : '') + '><span>' + s + '</span></label>';
        }).join('') + '</div></div>' +
        '<div class="fld"><span class="lbl">진행도 <span class="hint">대기 0 · 완료 100</span></span><div class="rp-prog">' +
        '<input type="range" min="0" max="100" step="5" name="progRange" value="' + prog + '" aria-label="진행도"' + dis + '>' +
        '<input type="number" class="inp num" min="0" max="100" name="progress" value="' + prog + '" aria-label="진행도 숫자"' + dis + '><span>%</span>' +
        '<span class="rp-quick">' + [0, 25, 50, 75, 100].map(function (n) { return '<button type="button" class="btn sm" data-rp-prog="' + n + '"' + dis + '>' + n + '</button>'; }).join('') + '</span></div></div>' +
        '<label class="fld"><span class="lbl">진행 내용</span><textarea class="inp" name="memo" rows="3" maxlength="1000">' + esc(l.memo || '') + '</textarea></label>' +
        '<p class="hint" style="margin:0">' + (latest ? '가장 최근 기록이라, 여기서 바꾼 진행상태·진행도가 업무에도 바로 반영돼요.' : '이전 기록이라 업무의 지금 진행상태·진행도는 그대로예요(기록만 고쳐요).') + '</p></form>',
      footer: '<span class="left"><button class="btn danger-line" data-act="rp-log-del" data-id="' + esc(l.id) + '">삭제</button></span>' +
        '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="rp-log-save">저장</button>'
    });
    var form = $('#rp-log-form', m), saving = false, btn = $('#rp-log-save', m);
    btn.addEventListener('click', function () {
      if (saving) return;
      var payload = { id: l.id, memo: form.memo.value.trim(), status: rpCurStatus(form), progress: form.progress.value };
      saving = true; btn.disabled = true;
      call('updateReportLog', payload).then(function (res) {
        S.rpStack = S.rpStack || {}; S.rpStack[l.reportId] = true;
        closeModal(); applyState(res); toast(res.info && res.info.latest ? '진행 기록을 고쳤어요. 업무의 진행상태·진행도도 바뀌었어요.' : '진행 기록을 고쳤어요.');
      }, function () { saving = false; btn.disabled = false; });
    });
  }
  function deleteLog(id) {
    var l = (S.data.reportLogs || []).filter(function (x) { return x.id === id; })[0];
    if (!l) return;
    var latest = rpTeamLogs(l.reportId)[0] === l && l.changes;
    confirmBox('이 진행 기록을 삭제할까요?' + (latest ? '<br><span class="hint">가장 최근 기록이라, 이 기록으로 바뀐 진행상태·진행도가 그 전으로 돌아가요.</span>' : '') + '<br><span class="hint">되돌릴 수 없어요.</span>', '삭제', true).then(function (ok) {
      if (!ok) return;
      call('deleteReportLog', { id: id }).then(function (res) {
        S.rpStack = S.rpStack || {}; S.rpStack[l.reportId] = true;
        closeModal(); applyState(res);
        toast('진행 기록을 삭제했어요' + (res.info && res.info.reverted ? '. 진행상태·진행도를 그 전으로 되돌렸어요.' : '.'));
      }, noop);
    });
  }

  // 연동 항목 고치기: 업무보고에만 반영 (원래 유지보수·사업 기록은 그대로). '원래 내용으로'를 누르면 고친 내용을 지움
  function openLinkModal(key) {
    var t = RP_LINKS[key];
    if (!t) return;
    var src = t.linked === '유지보수' ? '유지보수 진행 기록' : '사업 진행 기록';
    var m = openModal({
      title: '연동 업무 고치기 · ' + t.author, size: 'wide',
      body: '<div class="callout">여기서 고친 내용은 <b>업무보고에만</b> 보여요. 원래 ' + src + '은 바뀌지 않아요.</div>' +
        '<div class="rp-orig"><span class="lbl">원래 내용</span><div>' + esc(t.orig.content) + '</div></div>' +
        '<form class="form rp-form-box" id="rp-link-form" autocomplete="off" novalidate>' + rpFields(t) + '</form>',
      footer: '<span class="left"><button class="btn danger-line" data-act="rp-link-hide" data-key="' + esc(key) + '" title="업무보고에서만 빼요. 원래 기록은 그대로">업무보고에서 삭제</button>' +
        (t.edited ? '<button class="btn" data-act="rp-link-reset" data-id="' + esc(t.ovId) + '">원래 내용으로</button>' : '') + '</span>' +
        '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="rp-link-save">저장</button>'
    });
    var form = $('#rp-link-form', m);
    rpSyncProg(form);
    $('#rp-link-save', m).addEventListener('click', function () {
      var payload = rpPayload(form);
      if (!payload) return;
      payload.linkKey = key; payload.kind = '일간';
      call('saveReport', payload).then(function (res) { closeModal(); applyState(res); toast('업무보고에만 반영했어요.'); }, noop);
    });
  }

  // 업무보고에서만 지우기·되살리기: 지금 보이는 내용 그대로 숨김 표시만 바꿔 저장 (원래 기록은 그대로)
  function rpSetHidden(key, hidden) {
    var t = RP_LINKS[key];
    if (!t) return Promise.reject();
    var payload = { linkKey: key, kind: '일간', hidden: hidden };
    RP_LINK_FIELDS.forEach(function (k) { payload[k] = t[k] === undefined || t[k] === null ? '' : String(t[k]); });
    if (!payload.content) payload.content = t.orig.content || '(내용 없음)';
    return call('saveReport', payload);
  }
  function openHiddenModal() {
    var list = rpLinkedAll(S.user.name, rpDay()).filter(function (t) { return t.hidden; });
    if (!list.length) { closeModal(); return; }
    openModal({
      title: '업무보고에서 지운 연동 업무 · ' + rpScopeLabel(), size: 'wide',
      body: '<div class="callout">업무보고에서만 지운 항목이에요. 원래 유지보수·사업 기록은 그대로 있어요.</div>' +
        '<div class="rp-hidden-list">' + list.map(function (t) {
          return '<div class="rp-hidden-row"><b>' + esc(t.project || '기타') + '</b><span class="rp-link">연동·' + esc(t.linked) + '</span>' +
            '<span class="rp-hidden-txt">' + esc(t.content) + '</span>' +
            '<button class="btn sm" data-act="rp-link-unhide" data-key="' + esc(t.linkKey) + '">다시 넣기</button></div>';
        }).join('') + '</div>',
      footer: '<button class="btn" data-act="modal-close">닫기</button>'
    });
  }

  var REPORT_ACTIONS = {
    'rp-edit-link': function (el) { openLinkModal(el.getAttribute('data-key')); },
    'rp-link-hide': function (el) {
      var key = el.getAttribute('data-key'), lt = RP_LINKS[key];
      confirmBox((lt ? '<b>' + esc(lt.content) + '</b><br>' : '') + '이 연동 업무를 <b>업무보고에서만</b> 지울까요?<br><span class="hint">원래 유지보수·사업 기록은 그대로 남아요. ‘지운 연동’에서 다시 넣을 수 있어요.</span>', '업무보고에서 삭제', true).then(function (ok) {
        if (ok) rpSetHidden(key, true).then(function (res) { closeModal(); applyState(res); toast('업무보고에서 지웠어요. 원래 기록은 그대로예요.'); }, noop);
      });
    },
    'rp-link-unhide': function (el) {
      var t = RP_LINKS[el.getAttribute('data-key')];
      if (!t) return;
      // 고친 적 없으면 따로 저장한 줄을 지워 원래 기록 그대로, 고친 적 있으면 고친 내용으로 다시 넣음
      var p = t.edited ? rpSetHidden(t.linkKey, false) : call('deleteReport', { id: t.ovId });
      p.then(function (res) { applyState(res); openHiddenModal(); toast('업무보고에 다시 넣었어요.'); }, noop);
    },
    'rp-hidden-list': function () { openHiddenModal(); },
    'rp-link-reset': function (el) {
      var id = el.getAttribute('data-id');
      confirmBox('업무보고에서 고친 내용을 지우고 원래 기록 내용으로 되돌릴까요?', '되돌리기').then(function (ok) {
        if (ok) call('deleteReport', { id: id }).then(function (res) { closeModal(); applyState(res); toast('원래 내용으로 되돌렸어요.'); }, noop);
      });
    },
    'rp-view': function (el) { S.rp.view = el.getAttribute('data-tab'); renderView(); },
    // 업무 기록: 붙여넣기 / 한 줄 추가
    'rp-in': function (el) { S.rp.inMode = el.getAttribute('data-mode'); renderView(); },
    // 붙여넣기 저장: 바로 사업·날짜별로 나눠 저장. 고칠 것은 내 진행현황 카드(팀 업무는 표의 줄)를 눌러 고침
    // 설명문 같은 줄(60자 넘거나 ‘~했습니다’)은 저장하지 않고 칸에 남겨 둠
    // data-team: 팀 업무 추가 칸 (PI·PEO·PM, 늘 주간 → 그 주 월요일로, 마감일은 그 주 금요일)
    'rp-paste-save': function (el) {
      var team = el.hasAttribute('data-team'), textKey = team ? 'teamPasteText' : 'pasteText';
      var ta = $(team ? '#rp-team-paste' : '#rp-paste'), raw = ta ? ta.value : '', kind = team ? '주간' : S.rp.kind;
      S.rp[textKey] = raw;
      if (!raw.trim()) { toast('붙여넣을 ' + (team ? '팀 업무' : '업무') + '를 적어 주세요.', 'error'); if (ta) ta.focus(); return; }
      var parsed = rpParsePaste(raw, rpDay(), kind);
      var save = parsed.filter(function (x) { return !x.skip; }), keep = parsed.filter(function (x) { return x.skip; });
      if (!save.length) { toast('저장할 줄을 찾지 못했어요. [사업] 줄 아래에 - 업무 형식으로 적어 주세요.', 'error'); return; }
      var items = save.map(function (x) {
        return { date: x.date, project: x.project, content: x.content, note: x.note, status: x.status,
          progress: x.status === '완료' ? 100 : 0, deadline: kind === '일간' ? x.date : rpWeekEnd(x.date || rpDay()) };
      });
      call('saveReportsBatch', { kind: kind, items: items, team: team }).then(function (res) {
        // 저장 안 한 설명문 줄만 칸에 남김 (사업이 있었으면 [사업]을 붙여서)
        S.rp[textKey] = keep.map(function (x) { return (x.project ? '[' + x.project + '] ' : '') + x.content + (x.note ? '(' + x.note + ')' : ''); }).join('\n');
        applyState(res);
        var info = res.info || {}, days = {}, noProj = save.filter(function (x) { return !x.project; }).length;
        save.forEach(function (x) { days[x.date] = (days[x.date] || 0) + 1; });
        var dk = Object.keys(days).sort();
        toast((info.added || 0) + (team ? '줄을 팀 업무에 올렸어요' : '줄 저장했어요') +
          (kind === '일간' && dk.length > 1 ? ' (' + dk.map(function (d) { return rpMD(d) + ' ' + days[d] + '줄'; }).join(' · ') + ')' : '') +
          (info.skipped ? ' · 이미 있는 ' + info.skipped + '줄은 건너뜀' : '') +
          (noProj ? ' · 사업을 못 찾은 ' + noProj + '줄은 ‘기타’로' : '') +
          (keep.length ? ' · 설명문 같은 ' + keep.length + '줄은 저장하지 않고 칸에 남겨 뒀어요' : '') +
          (team ? '. 고칠 것은 오른쪽 표에서 눌러 고치세요.' : '. 고칠 것은 내 진행현황에서 눌러 고치세요.'));
      }, noop);
    },
    'rp-prompt': function (el) {
      var team = el.hasAttribute('data-team');
      copyText(rpPromptText(team ? '주간' : S.rp.kind, team), '지시문을 복사했어요. Claude 대화창에 붙여 넣고, 그 아래에 ' + (team ? '이번 주 팀 업무' : '한 일') + '를 자유롭게 적으세요.');
    },
    // 주간: 지난 4주 안 끝난 업무
    'rp-carry-fold': function () { S.rp.carryOpen = S.rp.carryOpen === false; renderView(); },
    'rp-carry': function () {
      var ids = rpCarryPicked();
      if (!ids.length) { toast('가져올 업무를 체크해 주세요.', 'error'); return; }
      call('carryReports', { ids: ids, week: rpDay() }).then(function (res) {
        applyState(res);
        var info = res.info || {};
        toast((info.added || 0) + '건을 이번 주로 가져왔어요' + (info.skipped ? ' · 이미 있는 ' + info.skipped + '건은 건너뛰었어요' : '') + '. 지난 줄은 그대로 남아요.');
      }, noop);
    },
    'rp-carry-set': function (el) {
      var ids = rpCarryPicked(), st = el.getAttribute('data-status');
      if (!ids.length) { toast('업무를 체크해 주세요.', 'error'); return; }
      if (st === '완료') { openWeekDone(ids); return; } // 완료는 일간에 넣을 항목·날짜를 고르는 창으로
      call('setReportsStatus', { ids: ids, status: st }).then(function (res) { applyState(res); toast(ids.length + '건을 ' + st + ' 처리했어요.'); }, noop);
    },
    'rp-week-done': function () { openWeekDone(null); },
    // 주간에서 넘어온 카드의 ×: 이 날 일간에서만 빼기 (주간 업무는 완료 그대로, 주간 카드를 눌러 다시 넣을 수 있음)
    'rp-daily-out': function (el) {
      var id = el.getAttribute('data-id'), r = (S.data.reports || []).filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      var on = rpWeeklyDailyOn(r);
      confirmBox('<b>' + esc(r.content) + '</b><br>이 주간 업무를 <b>' + esc(rpMD(on)) + ' 일간 이행내용에서</b> 뺄까요?<br>' +
        '<span class="hint">주간 업무는 완료 그대로 남아요. 주간 업무 카드를 눌러 다시 넣을 수 있어요.</span>', '일간에서 빼기', true).then(function (ok) {
        if (!ok) return;
        call('saveReport', { id: r.id, kind: r.kind, date: r.date, project: r.project, deadline: r.deadline, content: r.content, note: r.note,
          status: r.status, progress: r.progress, dailyDate: 'N' }).then(function (res) { applyState(res); toast('일간에서 뺐어요. 주간 업무는 완료 그대로예요.'); }, noop);
      });
    },
    'rp-sheet-push': function () { RP_SHEET.off = ''; rpSheetPush(true); }, // 직접 올리면 자동도 다시 켬
    'rp-kind': function (el) {
      S.rp.kind = el.getAttribute('data-kind');
      if (S.rp.draft) S.rp.draft.dlSet = false; // 일간↔주간을 바꾸면 마감일은 다시 기본값(그날 / 그 주 금요일)
      renderView();
    },
    'rp-board': function (el) { S.rp.board = el.getAttribute('data-mode'); renderView(); },
    'rp-day': function (el) {
      var n = +el.getAttribute('data-step');
      S.rp.date = n ? rpAddDays(rpDay(), n) : '';
      renderView();
    },
    'rp-add': function () {
      var form = $('#rp-form');
      if (!form) return;
      var payload = rpPayload(form);
      if (!payload) return;
      payload.kind = S.rp.kind; payload.date = rpDay();
      S.rp.lastProject = payload.project;
      call('saveReport', payload).then(function (res) {
        S.rp.draft = null;
        applyState(res);
        toast('업무를 기록했어요.');
        var f2 = $('#rp-form'); if (f2) f2.content.focus();
      }, noop);
    },
    'rp-stack': function (el) { rpToggleStack(el.getAttribute('data-id')); },
    'rp-step': function (el) { openReportStep(el.getAttribute('data-id')); },
    'rp-log-edit': function (el) { openLogEdit(el.getAttribute('data-id')); },
    'rp-log-del': function (el) { deleteLog(el.getAttribute('data-id')); },
    'rp-team-copy': function () { copyText(rpTeamCopyText(rpDay()), '팀 업무를 복사했어요. 메신저나 메일에 붙여 넣으세요.'); },
    'rp-edit': function (el) { openReportModal(el.getAttribute('data-id')); },
    'rp-del': function (el) {
      var id = el.getAttribute('data-id'), t = (S.data.reports || []).filter(function (x) { return x.id === id; })[0];
      confirmBox((t ? '<b>' + esc(t.content) + '</b><br>' : '') + '이 업무를 삭제할까요? 되돌릴 수 없어요.', '삭제', true).then(function (ok) {
        if (ok) call('deleteReport', { id: id }).then(function (res) { closeModal(); applyState(res); toast('삭제했어요.'); }, noop);
      });
    },
    'rp-copy': function (el) {
      // 전체 현황(사람별·사업별)은 고른 일간/주간 그대로. 팀 업무 복사는 rp-team-copy
      var d = rpDay(), kind = S.rp.kind, who = el.getAttribute('data-who');
      if (who === 'all') copyText(rpCopyText(rpBoardMembers(d, kind), d, true, kind));
      else if (who === 'project') copyText(rpCopyByProject(rpBoardMembers(d, kind), d, kind));
      else copyText(rpCopyText([S.user.name], d, false));
    }
  };
  // 진행도 빠른 버튼 (0·25·50·75·100): data-act를 쓰지 않고 직접 처리 (폼 안 버튼)
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-rp-prog]');
    if (!b) return;
    var f = b.closest('form.rp-form-box');
    if (!f || b.disabled) return;
    f.progress.value = f.progRange.value = b.getAttribute('data-rp-prog');
    // 0은 대기, 100은 완료로 맞춰 줌
    var v = +b.getAttribute('data-rp-prog'), st = rpCurStatus(f);
    if (v === 100 && st !== '완료') { var c = f.querySelector('input[name=status][value="완료"]'); if (c) { c.checked = true; rpSyncProg(f); } }
    rpSaveDraft(f);
  });
  Object.keys(REPORT_ACTIONS).forEach(function (k) { BIZ_ACTIONS[k] = REPORT_ACTIONS[k]; });

  /* ==========================================================================
   * 성과관리 (PEO·PI): 과제·연차별 정량적 성과
   *  - 성과유형 = 대분류 → 중분류 → 소분류(성과지표). 지표마다 목표치·달성치·누적 달성, 예정일·완료일
   *  - 과제별: 연구자는 참여 과제만, PI·PEO·PM은 모든 연구사업
   *  - 전체 현황(PI·PEO·PM): 고른 해의 연차 기준으로 모든 연구사업 성과를 한눈에
   * 빌드할 때 app.html 화면 코드 안(BIZ_UI 자리)에 그대로 들어갑니다.
   * ========================================================================== */
  var OC_ST_CLS = { '완료': 'done', '지연': 'bad', '진행': 'run' };
  var OC_RANK = (function () { // 정렬용: 분류표 순서
    var r = {}, i = 0;
    L.OUTCOME_TYPES.forEach(function (a) { a[1].forEach(function (b) { b[1].forEach(function (c) { r[c] = i++; }); }); });
    return r;
  })();
  function ocProjects() { return S.data.projects.filter(function (p) { return p.kind === '연구'; }).sort(projOrder); }
  function ocNum(v) { return v === '' || v === undefined || v === null ? null : +v; }
  function ocRate(x) { var t = ocNum(x.target), a = ocNum(x.achieved) || 0; return t ? Math.round(a / t * 100) : null; }
  // 상태: 완료(완료일이 있거나 목표 달성) / 지연(예정일 지남) / 진행
  function ocState(x) {
    var t = ocNum(x.target), a = ocNum(x.achieved) || 0;
    if (x.doneDate || (t && a >= t)) return '완료';
    if (x.dueDate && x.dueDate < today()) return '지연';
    return '진행';
  }
  function ocChip(st) { return '<span class="st st-' + OC_ST_CLS[st] + '">' + st + '</span>'; }
  function ocSort(a, b) { return (OC_RANK[a.cat3] || 0) - (OC_RANK[b.cat3] || 0); }
  function ocList(project, yearNo) {
    return (S.data.outcomes || []).filter(function (x) { return x.project === project && x.yearNo === yearNo; }).sort(ocSort);
  }
  function ocVal(v, unit) { return v === '' || v === undefined ? '<span class="hint">-</span>' : esc(v) + (unit ? '<span class="oc-unit">' + esc(unit) + '</span>' : ''); }
  function ocRateCell(x) {
    var r = ocRate(x);
    if (r === null) return '<span class="hint">-</span>';
    return '<span class="rp-bar oc-bar' + (r >= 100 ? ' full' : '') + '"><i style="width:' + Math.min(100, r) + '%"></i></span><span class="rp-pct">' + r + '%</span>';
  }
  function ocSummary(items) {
    var c = { '완료': 0, '진행': 0, '지연': 0 }, rates = [];
    items.forEach(function (x) { c[ocState(x)]++; var r = ocRate(x); if (r !== null) rates.push(Math.min(100, r)); });
    var avg = rates.length ? Math.round(rates.reduce(function (s, v) { return s + v; }, 0) / rates.length) : null;
    return { n: items.length, c: c, avg: avg };
  }
  function ocSumChips(s) {
    return '<span class="stat-chips"><span class="count">지표 ' + s.n + '개</span>' + ['완료', '진행', '지연'].map(function (k) { return ocChip(k) + '<b>' + s.c[k] + '</b>'; }).join('') +
      '<span class="count">평균 달성률 ' + (s.avg === null ? '-' : s.avg + '%') + '</span></span>';
  }

  /* ---------- 화면 ---------- */
  function viewOutcome() {
    var head = '<div class="view-head"><h1>성과 관리</h1></div>';
    var nav = canBoard() ? '<div class="subtabs" role="tablist">' + [['project', '과제별'], ['board', '전체 현황']].map(function (t) {
      return '<button role="tab" class="subtab' + (S.oc.view === t[0] ? ' on' : '') + '" data-act="oc-view" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>' : '';
    if (canBoard() && S.oc.view === 'board') return head + nav + ocBoard();
    var projs = ocProjects();
    if (!projs.length) return head + nav + emptyProjects();
    var p = projByName(S.oc.project);
    if (!p || p.kind !== '연구') { var dp = projByName(DEFAULT_BIZ_PROJECT); p = dp && dp.kind === '연구' ? dp : projs[0]; S.oc.project = p.name; }
    var years = yearsOf(p.name);
    if (!years.some(function (y) { return y.yearNo === S.oc.yearNo; })) { var cy = currentYearOf(p.name); S.oc.yearNo = cy ? cy.yearNo : ''; }
    var y = years.filter(function (x) { return x.yearNo === S.oc.yearNo; })[0] || null;
    var editable = canEditBizP(p);
    var filters = '<div class="filters"><select class="inp" data-filter="oc.project" aria-label="과제">' + options(projs.map(function (x) { return [x.name, x.name]; }), p.name) + '</select>' +
      (years.length ? '<select class="inp" data-filter="oc.yearNo" aria-label="연차">' + options(years.map(function (x) { return [x.yearNo, yearLabel(x)]; }), S.oc.yearNo) + '</select>' : '') + '</div>';
    if (!y) return head + nav + filters + '<section class="panel"><div class="panel-head"><h2>정량적 성과</h2></div><div class="empty"><strong>아직 연차가 없어요</strong>RFP 관리에서 연차를 먼저 추가해 주세요.</div></section>';
    var items = ocList(p.name, y.yearNo);
    var addBtn = editable ? '<button class="btn primary" data-act="oc-add">+ 성과지표 추가</button>' : '';
    var body = items.length ? ocTable(items, false, editable) : '<div class="empty"><strong>등록한 성과지표가 없어요</strong>' + (editable ? '‘+ 성과지표 추가’로 이 연차의 목표를 넣어 주세요.' : '') + '</div>';
    return head + nav + filters + '<section class="panel"><div class="panel-head"><h2>' + esc(yearLabel(y)) + ' 정량적 성과</h2>' + ocSumChips(ocSummary(items)) +
      '<span class="spacer"></span>' + addBtn + '</div>' + body + '</section>';
  }
  // 성과 표: 대분류마다 묶음 줄, 그 아래 중분류·성과지표 (withProject: 전체 현황에서 과제 칸 추가)
  function ocTable(items, withProject, editable) {
    var groups = {}, order = [];
    items.forEach(function (x) { var k = withProject ? x.project : x.cat1; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(x); });
    var cols = 11 + (withProject ? 1 : 0);
    return '<div class="tbl-wrap"><table class="tbl oc-tbl"><thead><tr>' + (withProject ? '<th>과제</th>' : '') +
      '<th>대분류</th><th>중분류</th><th>성과지표 (소분류)</th><th>목표치</th><th>달성치</th><th>달성률</th><th>누적 달성</th><th>예정일</th><th>완료일</th><th>상태</th><th>비고</th></tr></thead><tbody>' +
      order.map(function (k) {
        return '<tr class="rp-grp"><td colspan="' + cols + '">' + esc(k) + (withProject ? ' <span class="count">' + esc(yearLabel(yearsOf(k).filter(function (v) { return v.yearNo === groups[k][0].yearNo; })[0])) + '</span>' : '') + '</td></tr>' +
          groups[k].map(function (x) {
            var st = ocState(x), can = editable === true || (editable === 'auto' && canEditBizP(projByName(x.project)));
            return '<tr' + (can ? ' class="clickable" data-act="oc-edit" data-id="' + esc(x.id) + '"' : '') + '>' + (withProject ? '<td><b>' + esc(x.project) + '</b></td>' : '') +
              '<td>' + esc(x.cat1) + '</td><td>' + esc(x.cat2) + '</td><td class="wrap"><b>' + esc(x.cat3) + '</b></td>' +
              '<td class="num">' + ocVal(x.target, x.unit) + '</td><td class="num">' + ocVal(x.achieved, x.unit) + '</td><td class="rp-prog-cell">' + ocRateCell(x) + '</td>' +
              '<td class="num">' + ocVal(x.cumulative, x.unit) + '</td>' +
              '<td class="date' + (st === '지연' ? ' rp-late' : '') + '">' + fmtDate(x.dueDate) + '</td><td class="date">' + fmtDate(x.doneDate) + '</td>' +
              '<td>' + ocChip(st) + '</td><td class="note">' + esc(x.note || '') + '</td></tr>';
          }).join('');
      }).join('') + '</tbody></table></div>';
  }
  // 전체 현황: 고른 해와 겹치는 연차 기준
  function ocBoard() {
    var t = today(), Y = +(S.oc.year || t.slice(0, 4));
    var ys = {}; ys[t.slice(0, 4)] = true; ys[String(Y)] = true;
    (S.data.years || []).forEach(function (y) { ys[y.startMonth.slice(0, 4)] = true; ys[y.endMonth.slice(0, 4)] = true; });
    var rows = ocProjects().map(function (p) {
      var y = yearInYear(p.name, Y);
      return y ? { p: p, y: y, items: ocList(p.name, y.yearNo) } : null;
    }).filter(Boolean);
    var cat1s = L.OUTCOME_TYPES.map(function (a) { return a[0]; });
    var filters = '<div class="filters"><select class="inp" data-filter="oc.year" aria-label="연도">' + options(yearSpan(Object.keys(ys)), String(Y)) + '</select>' +
      '<select class="inp" data-filter="oc.cat1" aria-label="대분류">' + options(cat1s, S.oc.cat1, '전체 대분류') + '</select>' +
      '<select class="inp" data-filter="oc.status" aria-label="상태">' + options(['완료', '진행', '지연'], S.oc.status, '전체 상태') + '</select></div>';
    if (!rows.length) return filters + '<div class="card empty"><strong>' + Y + '년에 진행하는 연구사업이 없어요</strong></div>';
    var sumRows = rows.map(function (r) {
      var s = ocSummary(r.items);
      var next = r.items.filter(function (x) { return ocState(x) !== '완료' && x.dueDate; }).sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; })[0];
      return '<tr class="clickable" data-act="oc-open" data-project="' + esc(r.p.name) + '" data-year="' + esc(r.y.yearNo) + '"><td><b>' + esc(r.p.name) + '</b></td><td>' + esc(yearLabel(r.y)) + '</td>' +
        '<td class="num">' + s.n + '</td><td class="num">' + s.c['완료'] + '</td><td class="num">' + s.c['진행'] + '</td><td class="num' + (s.c['지연'] ? ' rp-late' : '') + '">' + s.c['지연'] + '</td>' +
        '<td class="rp-prog-cell">' + (s.avg === null ? '<span class="hint">-</span>' : '<span class="rp-bar oc-bar' + (s.avg >= 100 ? ' full' : '') + '"><i style="width:' + s.avg + '%"></i></span><span class="rp-pct">' + s.avg + '%</span>') + '</td>' +
        '<td>' + (next ? esc(next.cat3) + ' <span class="hint">' + fmtDate(next.dueDate) + '</span>' : '<span class="hint">-</span>') + '</td></tr>';
    }).join('');
    var all = [];
    rows.forEach(function (r) { all = all.concat(r.items); });
    var shown = all.filter(function (x) { return (!S.oc.cat1 || x.cat1 === S.oc.cat1) && (!S.oc.status || ocState(x) === S.oc.status); });
    return filters +
      '<section class="panel"><div class="panel-head"><h2>연구사업별 성과 요약</h2><span class="h-sub">' + Y + '년 연차 기준 · 줄을 누르면 그 과제로</span>' + ocSumChips(ocSummary(all)) + '</div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>과제</th><th>연차</th><th>지표</th><th>완료</th><th>진행</th><th>지연</th><th>평균 달성률</th><th>다음 예정</th></tr></thead><tbody>' + sumRows + '</tbody></table></div></section>' +
      '<section class="panel"><div class="panel-head"><h2>전체 성과지표</h2><span class="count">' + shown.length + ' / ' + all.length + '개</span></div>' +
      (shown.length ? ocTable(shown, true, 'auto') : '<div class="empty"><strong>조건에 맞는 성과지표가 없어요</strong></div>') + '</section>';
  }

  /* ---------- 추가·수정 창 ---------- */
  function openOutcomeModal(id) {
    var x = id ? (S.data.outcomes || []).filter(function (o) { return o.id === id; })[0] : null;
    var project = x ? x.project : S.oc.project, yearNo = x ? x.yearNo : S.oc.yearNo;
    var y = yearsOf(project).filter(function (v) { return v.yearNo === yearNo; })[0];
    var REQ = ' <em>*</em>';
    var c1 = x ? x.cat1 : '', c2 = x ? x.cat2 : '', c3 = x ? x.cat3 : '';
    var m = openModal({
      title: (x ? '성과지표 수정' : '성과지표 추가') + ' · ' + project + (y ? ' ' + yearLabel(y) : ''), size: 'wide',
      body: '<form class="form" id="oc-form" autocomplete="off" novalidate>' +
        '<div class="form-grid three"><label class="fld"><span class="lbl">대분류' + REQ + '</span><select class="inp" name="cat1"></select></label>' +
        '<label class="fld"><span class="lbl">중분류' + REQ + '</span><select class="inp" name="cat2"></select></label>' +
        '<label class="fld"><span class="lbl">성과지표 (소분류)' + REQ + '</span><select class="inp" name="cat3"></select></label></div>' +
        '<div class="form-grid four"><label class="fld"><span class="lbl">목표치</span><input class="inp num" name="target" inputmode="decimal" value="' + esc(x ? x.target : '') + '" placeholder="예: 3"></label>' +
        '<label class="fld"><span class="lbl">달성치</span><input class="inp num" name="achieved" inputmode="decimal" value="' + esc(x ? x.achieved : '') + '" placeholder="이번 연차"></label>' +
        '<label class="fld"><span class="lbl">누적 달성</span><input class="inp num" name="cumulative" inputmode="decimal" value="' + esc(x ? x.cumulative : '') + '" placeholder="전체 연차 합"></label>' +
        '<label class="fld"><span class="lbl">단위</span><input class="inp" name="unit" maxlength="10" list="dl-oc-unit" value="' + esc(x ? x.unit : '건') + '"></label></div>' +
        '<datalist id="dl-oc-unit"><option value="건"><option value="편"><option value="점"><option value="명"><option value="회"><option value="%"></datalist>' +
        '<div class="form-grid"><label class="fld"><span class="lbl">예정일 <span class="hint">언제 달성할지</span></span><input type="date" class="inp" name="dueDate" value="' + esc(x ? x.dueDate : '') + '"></label>' +
        '<label class="fld"><span class="lbl">완료일 <span class="hint">달성한 날</span></span><input type="date" class="inp" name="doneDate" value="' + esc(x ? x.doneDate : '') + '"></label></div>' +
        '<label class="fld"><span class="lbl">비고</span><input class="inp" name="note" maxlength="300" value="' + esc(x ? x.note : '') + '" placeholder="예: SCI 1편 투고 중"></label></form>',
      footer: (x ? '<span class="left"><button class="btn danger-line" data-act="oc-del" data-id="' + esc(x.id) + '">삭제</button></span>' : '') +
        '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="oc-save">저장</button>'
    });
    var form = $('#oc-form', m);
    // 대분류 → 중분류 → 성과지표를 차례로 고름. 목록에는 실제 항목만 (고르기 안내 항목 없음):
    // 새 성과지표는 각 목록의 첫 항목이 골라져 있고, 위 칸을 바꾸면 아래 칸은 그 분류의 첫 항목으로
    function fill() {
      var a = L.OUTCOME_TYPES.filter(function (t) { return t[0] === form.cat1.value; })[0];
      form.cat2.innerHTML = options(a ? a[1].map(function (t) { return t[0]; }) : [], c2);
      var b = a ? a[1].filter(function (t) { return t[0] === form.cat2.value; })[0] : null;
      form.cat3.innerHTML = options(b ? b[1] : [], c3);
    }
    form.cat1.innerHTML = options(L.OUTCOME_TYPES.map(function (t) { return t[0]; }), c1);
    fill();
    form.addEventListener('change', function (e) {
      if (e.target.name === 'cat1') { c2 = ''; c3 = ''; fill(); }
      if (e.target.name === 'cat2') { c2 = form.cat2.value; c3 = ''; fill(); }
    });
    $('#oc-save', m).addEventListener('click', function () {
      var payload = { project: project, yearNo: yearNo, cat1: form.cat1.value, cat2: form.cat2.value, cat3: form.cat3.value,
        target: form.target.value.trim(), achieved: form.achieved.value.trim(), cumulative: form.cumulative.value.trim(), unit: form.unit.value.trim(),
        dueDate: form.dueDate.value, doneDate: form.doneDate.value, note: form.note.value.trim() };
      if (!payload.cat1 || !payload.cat2 || !payload.cat3) { toast('대분류·중분류·성과지표를 모두 골라 주세요.', 'error'); return; }
      var bad = ['target', 'achieved', 'cumulative'].filter(function (k) { return payload[k] && !/^\d+(\.\d+)?$/.test(payload[k].replace(/,/g, '')); });
      if (bad.length) { toast('목표치·달성치·누적 달성은 숫자로 입력해 주세요.', 'error'); form[bad[0]].focus(); return; }
      if (x) payload.id = x.id;
      call('saveOutcome', payload).then(function (res) { closeModal(); applyState(res); toast('성과지표를 저장했어요.'); }, noop);
    });
  }

  var OUTCOME_ACTIONS = {
    'oc-view': function (el) { S.oc.view = el.getAttribute('data-tab'); renderView(); },
    'oc-add': function () { openOutcomeModal(null); },
    'oc-edit': function (el) { openOutcomeModal(el.getAttribute('data-id')); },
    'oc-open': function (el) { S.oc.view = 'project'; S.oc.project = el.getAttribute('data-project'); S.oc.yearNo = el.getAttribute('data-year'); renderView(); window.scrollTo(0, 0); },
    'oc-del': function (el) {
      var id = el.getAttribute('data-id');
      var x = (S.data.outcomes || []).filter(function (o) { return o.id === id; })[0];
      confirmBox('<b>' + esc(x ? x.cat3 : '') + '</b> 성과지표를 삭제할까요? 되돌릴 수 없어요.', '삭제', true).then(function (ok) {
        if (ok) call('deleteOutcome', { id: id }).then(function (res) { closeModal(); applyState(res); toast('삭제했어요.'); }, noop);
      });
    }
  };
  Object.keys(OUTCOME_ACTIONS).forEach(function (k) { BIZ_ACTIONS[k] = OUTCOME_ACTIONS[k]; });

  /* ==========================================================================
   * 메일송부현황 (식품AX팀 PEO → PMO 요청 메일). 화면의 이름은 위 메뉴와 같게 ‘메일송부현황’(붙여 씀)
   *  - 보는 사람: PI, PEO 전체(PM·연구자), PMO는 PM만 (서버도 같은 기준으로 데이터를 보냄)
   *  - 열은 ‘PEO→PMO 메일 송부 현황’ 엑셀(식품AX 시트)과 같음. 분야 구분 없음
   *  - 진행 기록: 등록·진행상황 변경 때마다 누가·언제·무엇을 썼는지. 최신이 맨 앞, 이전 것은 뒤에 쌓임(이전 n)
   *  - 엑셀 가져오기는 PI만, 과제 관리 > 메일송부현황 가져오기에서 (엑셀 내려받기는 없음)
   * 빌드할 때 app.html 화면 코드 안(BIZ_UI 자리)에 그대로 들어갑니다.
   * ========================================================================== */
  function mlAll() { return S.data.mails || []; }
  function mlDone(x) { return /완료/.test(x.status || ''); }
  function mlStCls(s) {
    if (/완료/.test(s)) return 'st-done';
    if (s === '보류') return 'st-hold';
    if (/^PM팀/.test(s)) return 'st-run';   // PMO 쪽에서 처리 중
    if (/^AX팀/.test(s)) return 'st-ax';    // PEO 쪽에서 확인 중
    return 'st-wait';
  }
  function mlChip(s) { return s ? '<span class="st ' + mlStCls(s) + '">' + esc(s) + '</span>' : '<span class="hint">-</span>'; }
  // 구분: 일반·긴급 모두 같은 크기의 칩 (일반 = 회색, 긴급 = 빨강)
  function mlUrg(x) { return x.urgency === '긴급' ? '<span class="st st-bad ml-urg">긴급</span>' : '<span class="st st-wait ml-urg">일반</span>'; }
  function mlDbDev(x) {
    var list = L.splitNames(x.dbDev);
    return list.length ? list.map(function (d) { return '<span class="tag ml-dd">' + esc(d) + '</span>'; }).join('') : '<span class="hint">-</span>';
  }
  function mlCanDelete(x) { return x.author === S.user.name || isPM(); }
  // 이 메일의 진행 기록 (최신 → 이전)
  function mlLogs(id) {
    return (S.data.mailLogs || []).filter(function (l) { return l.mailId === id; })
      .sort(function (a, b) { return a.createdAt !== b.createdAt ? (a.createdAt < b.createdAt ? 1 : -1) : 0; });
  }
  function mlWhen(s) { s = String(s || ''); return s ? fmtDate(s.slice(0, 10)) + ' ' + s.slice(11, 16) : ''; }
  function mlLogText(l) {
    var st = l.prevStatus && l.prevStatus !== l.status ? esc(l.prevStatus) + ' → ' + mlChip(l.status) : mlChip(l.status);
    return '<span class="ml-log-when">' + esc(mlWhen(l.createdAt)) + '</span><b class="ml-log-who">' + esc(l.author) + '</b>' + st +
      (l.memo ? '<span class="ml-log-memo">' + esc(l.memo) + '</span>' : '');
  }
  // 사업명 고르기: 연구사업 중 기간이 지나지 않은 과제 (서버가 보내 준 목록, 과제 순서대로)
  function mlProjectNames() { return (S.data.mailProjects || []).map(function (p) { return p.name; }); }
  // 정렬: 기본은 요청일 최근 순 (같은 날이면 나중에 넣은 것 먼저). 머리글을 누르면 그 열 기준
  SORTERS.mail = {
    urgency: function (x) { return x.urgency === '긴급' ? 0 : 1; }, dbDev: function (x) { return x.dbDev; },
    requestDate: function (x) { return x.requestDate; }, requester: function (x) { return x.requester; }, type: function (x) { return x.type; },
    project: function (x) { return x.project; }, title: function (x) { return x.title; }, reviewer: function (x) { return x.reviewer; },
    developer: function (x) { return x.developer; }, doneDate: function (x) { return x.doneDate; },
    status: function (x) { var i = L.MAIL_STATUSES.indexOf(x.status); return i < 0 ? 99 : i; }
  };
  function mlFiltered() {
    var f = S.ml;
    var idx = {};
    mlAll().forEach(function (x, i) { idx[x.id] = i; });
    return mlAll().filter(function (x) {
      if (f.year && String(x.requestDate || '').slice(0, 4) !== f.year) return false;
      if (f.status && x.status !== f.status) return false;
      if (f.type && x.type !== f.type) return false;
      if (f.urgency && x.urgency !== f.urgency) return false;
      if (f.dbDev && L.splitNames(x.dbDev).indexOf(f.dbDev) < 0) return false;
      if (f.hideDone && mlDone(x)) return false;
      return matchQ(f.q, [x.title, x.content, x.project, x.requester, x.reviewer, x.developer, x.note, x.status, x.type]);
    }).sort(function (a, b) {
      if (a.requestDate !== b.requestDate) return a.requestDate < b.requestDate ? 1 : -1;
      return idx[b.id] - idx[a.id];
    });
  }

  /* ---------- 화면 ---------- */
  function viewMail() {
    var f = S.ml, all = mlAll();
    var head = '<div class="view-head"><h1>메일송부현황</h1></div>';
    var ys = {};
    all.forEach(function (x) { if (x.requestDate) ys[x.requestDate.slice(0, 4)] = true; });
    var statuses = L.MAIL_STATUSES.slice();
    all.forEach(function (x) { if (x.status && statuses.indexOf(x.status) < 0) statuses.push(x.status); });
    var filters = '<div class="filters">' +
      '<select class="inp" data-filter="ml.year" aria-label="연도">' + options(Object.keys(ys).sort().reverse(), f.year, '전체 연도') + '</select>' +
      '<select class="inp" data-filter="ml.status" aria-label="진행상황">' + options(statuses, f.status, '전체 진행상황') + '</select>' +
      '<select class="inp" data-filter="ml.type" aria-label="유형">' + options(L.MAIL_TYPES, f.type, '전체 유형') + '</select>' +
      '<select class="inp" data-filter="ml.urgency" aria-label="구분">' + options(L.MAIL_URGENCY, f.urgency, '긴급·일반') + '</select>' +
      '<select class="inp" data-filter="ml.dbDev" aria-label="DB/개발">' + options(L.MAIL_DBDEV, f.dbDev, 'DB/개발 전체') + '</select>' +
      '<input type="search" class="inp search" data-filter="ml.q" placeholder="제목·내용·사업명·담당 검색" value="' + esc(f.q) + '" aria-label="검색">' +
      '<label class="check"><input type="checkbox" data-filter="ml.hideDone"' + (f.hideDone ? ' checked' : '') + '> 완료 숨기기</label></div>';
    return head + filters + mlResults();
  }
  // 조건 줄 아래 (검색할 때는 이 부분만 다시 그림)
  var ML_COLS = 14;
  function mlResults() {
    var rows = applySort('mail', mlFiltered());
    var open = rows.filter(function (x) { return !mlDone(x) && x.status !== '보류'; });
    var urgent = open.filter(function (x) { return x.urgency === '긴급'; }).length;
    var sh = function (k, l, cls) { return sortHead('mail', k, l, cls); };
    var two = function (k, l, cls) { return sh(k, l, cls).replace('<th ', '<th rowspan="2" '); };
    var thead = '<thead><tr>' + two('urgency', '구분') + two('dbDev', 'DB/개발') +
      '<th colspan="6" class="ml-grp">요청 내용</th><th colspan="2" class="ml-grp">담당</th>' +
      two('status', '진행상황') + two('doneDate', '완료일') + '<th rowspan="2">비고</th><th rowspan="2" class="sticky-act">관리</th></tr><tr>' +
      sh('requestDate', '요청일') + sh('requester', '요청자') + sh('type', '유형') + sh('project', '사업명') + sh('title', '제목') + '<th>내용</th>' +
      sh('reviewer', '검토자') + sh('developer', '개발자') + '</tr></thead>';
    var body = rows.map(function (x) {
      var late = !mlDone(x) && x.status !== '보류' && x.urgency === '긴급';
      // 진행 기록은 모두 메일 줄 아래 스택 줄로 (최신이 맨 위). 진행상황 칸에는 지금 상황과 ‘기록 n’ 단추만
      var logs = mlLogs(x.id), sOpen = !!(S.mlStack && S.mlStack[x.id]);
      var stCell = mlChip(x.status) +
        (logs.length ? '<button type="button" class="stack-btn' + (sOpen ? ' on' : '') + '" data-act="ml-stack" data-id="' + esc(x.id) + '" aria-expanded="' + sOpen + '" title="진행 기록 ' + logs.length + '건 ' + (sOpen ? '접기' : '보기') + '">기록 ' + logs.length + '</button>' : '');
      return '<tr class="clickable' + (late ? ' ml-urgent' : '') + '" data-act="ml-edit" data-id="' + esc(x.id) + '">' +
        '<td>' + mlUrg(x) + '</td><td class="ml-ddc">' + mlDbDev(x) + '</td>' +
        '<td class="date">' + fmtDate(x.requestDate) + '</td><td>' + (esc(x.requester) || '-') + '</td><td class="ml-type">' + (esc(x.type) || '-') + '</td>' +
        '<td><b>' + (esc(x.project) || '-') + '</b></td>' +
        '<td class="wrap ml-title">' + esc(x.title) + '</td>' +
        '<td class="wrap ml-body"><span class="ml-clip" title="' + esc(x.content) + '">' + (esc(x.content) || '<span class="hint">-</span>') + '</span></td>' +
        '<td>' + (esc(x.reviewer) || '-') + '</td><td>' + (esc(x.developer) || '-') + '</td>' +
        '<td class="ml-stc">' + stCell + '</td><td class="date">' + fmtDate(x.doneDate) + '</td>' +
        '<td class="note"><span class="ml-clip" title="' + esc(x.note) + '">' + esc(x.note) + '</span></td>' +
        // 관리: + 다음 단계 (진행상황을 바꾸고 진행 내용을 남김 → 진행 기록이 쌓임)
        '<td class="sticky-act"><div class="actions"><button class="btn sm ghost" data-act="ml-next" data-id="' + esc(x.id) + '">+ 다음 단계</button></div></td></tr>' +
        // 메일 아래에 쌓인 진행 기록 (최신 → 이전). + 다음 단계로 남기면 맨 위에 한 장씩 쌓임
        logs.map(function (l, i) {
          return '<tr class="stack-back ml-log-row' + (i === 0 ? ' ml-log-latest' : '') + '" data-mlstack="' + esc(x.id) + '"' + (sOpen ? '' : ' hidden') + '><td colspan="' + ML_COLS + '">' +
            '<span class="stack-mark" aria-hidden="true">↳</span>' + (i === 0 ? '<span class="tag ml-latest">최신</span>' : '') + mlLogText(l) + '</td></tr>';
        }).join('');
    }).join('');
    var empty = mlAll().length
      ? '<div class="empty"><strong>조건에 맞는 메일이 없어요</strong></div>'
      : '<div class="empty"><strong>아직 기록한 메일이 없어요</strong>‘+ 메일 기록’으로 추가하세요.' + (isPI() ? ' 지금 쓰는 엑셀은 과제 관리 → 메일송부현황 가져오기에서 옮길 수 있어요.' : '') + '</div>';
    return '<section class="panel"><div class="panel-head"><h2>메일 기록</h2><span class="count">' + rows.length + '건</span>' +
      (open.length ? '<span class="count">진행 중 ' + open.length + '건' + (urgent ? ' · <b class="ml-urg-n">긴급 ' + urgent + '</b>' : '') + '</span>' : '') +
      '<span class="spacer"></span>' +
      '<button class="btn primary" data-act="ml-add">+ 메일 기록</button></div>' +
      (rows.length ? '<div class="tbl-wrap"><table class="tbl ml-tbl">' + thead + '<tbody>' + body + '</tbody></table></div>' : empty) + '</section>';
  }
  // 쌓인 이전 진행 기록 펼치기/접기 (다시 그리지 않고 줄만)
  function mlToggleStack(id) {
    S.mlStack = S.mlStack || {};
    var open = !S.mlStack[id];
    if (open) S.mlStack[id] = true; else delete S.mlStack[id];
    $$('#view tr[data-mlstack]').forEach(function (tr) { if (tr.getAttribute('data-mlstack') === id) tr.hidden = !open; });
    $$('#view .stack-btn[data-act="ml-stack"]').forEach(function (b) {
      if (b.getAttribute('data-id') !== id) return;
      b.classList.toggle('on', open); b.setAttribute('aria-expanded', open);
      b.title = b.title.replace(/(보기|접기)$/, open ? '접기' : '보기');
    });
  }

  // 엑셀에서 가져온 메일은 PI·PM만 고침. 그 밖의 메일은 볼 수 있는 사람 누구나 (진행 내용은 누구나 + 다음 단계로)
  function mlImported(x) { return x.author === L.IMPORT_AUTHOR; }
  function mlCanEdit(x) { return !mlImported(x) || isPM(); }
  // 진행 기록 칸: 기록이 있는 메일만 (최신이 맨 위, 이전 기록은 ‘이전 n’ 뒤에 쌓임). 기록이 없으면 칸 자체가 없음
  function mlHistoryBlock(logs) {
    if (!logs.length) return '';
    return '<div class="fld ml-hist"><span class="lbl">진행 기록 <span class="hint">최신이 맨 위, 이전 기록은 뒤에 쌓여 있어요</span></span>' +
      '<div class="ml-hist-front">' + mlLogText(logs[0]) + '</div>' +
      (logs.length > 1 ? '<button type="button" class="stack-btn" id="ml-hist-more" aria-expanded="false">이전 ' + (logs.length - 1) + '</button>' +
        '<div class="ml-hist-back" id="ml-hist-back" hidden>' + logs.slice(1).map(function (l) { return '<div class="ml-hist-item"><span class="stack-mark" aria-hidden="true">↳</span>' + mlLogText(l) + '</div>'; }).join('') + '</div>' : '') +
      '</div>';
  }
  function mlBindHistory(m) {
    var more = $('#ml-hist-more', m);
    if (more) more.addEventListener('click', function () {
      var back = $('#ml-hist-back', m), open = back.hidden;
      back.hidden = !open; more.classList.toggle('on', open); more.setAttribute('aria-expanded', open);
    });
  }
  // 다음 진행상황 (진행 순서상 다음. 완료는 그대로, 보류·모르는 값이면 PM팀 검토)
  function mlNextStatus(s) {
    var list = L.MAIL_STATUSES, i = list.indexOf(s);
    if (i < 0 || s === '보류') return 'PM팀 검토';
    var n = list[i + 1];
    return n && n !== '보류' ? n : s;
  }

  /* ---------- + 다음 단계: 진행상황을 바꾸고 진행 내용을 남김 (누구나, 가져온 메일도) ---------- */
  function openMailStep(id) {
    var x = mlAll().filter(function (m) { return m.id === id; })[0];
    if (!x) { toast('메일을 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.', 'error'); return; }
    var statuses = L.MAIL_STATUSES.slice();
    if (x.status && statuses.indexOf(x.status) < 0) statuses.push(x.status);
    var next = mlNextStatus(x.status), REQ = ' <em>*</em>';
    var m = openModal({
      title: '다음 단계 · ' + (x.title || ''), size: 'wide',
      body: '<form class="form" id="ml-step-form" autocomplete="off" novalidate>' +
        '<p class="ml-step-now">지금 진행상황 ' + mlChip(x.status) + '</p>' +
        '<div class="form-grid"><label class="fld"><span class="lbl">진행상황' + REQ + ' <span class="hint">같은 진행상황으로 내용만 더 남겨도 돼요</span></span><select class="inp" name="status">' + options(statuses, next) + '</select></label>' +
        '<label class="fld" id="ml-step-done"' + (/완료/.test(next) ? '' : ' hidden') + '><span class="lbl">완료일' + REQ + '</span><input type="date" class="inp" name="doneDate" value="' + esc(x.doneDate || today()) + '"></label></div>' +
        '<label class="fld"><span class="lbl">진행 내용 <span class="hint">선택</span></span><textarea class="inp" name="memo" rows="3" maxlength="1000" placeholder="예: 개발서버 반영 완료, AX팀 테스트 요청" autofocus></textarea></label>' +
        mlHistoryBlock(mlLogs(x.id)) + '</form>',
      footer: '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="ml-step-save">기록</button>'
    });
    var form = $('#ml-step-form', m);
    mlBindHistory(m);
    form.addEventListener('change', function (e) {
      if (e.target.name !== 'status') return;
      var done = /완료/.test(e.target.value);
      $('#ml-step-done', form).hidden = !done;
      if (done && !form.doneDate.value) form.doneDate.value = today();
    });
    var saving = false, btn = $('#ml-step-save', m);
    btn.addEventListener('click', function () {
      if (saving) return; // 두 번 눌러도 한 번만
      var payload = { id: x.id, status: form.status.value, memo: form.memo.value.trim(), doneDate: form.doneDate.value };
      // 진행 내용은 선택. 다만 진행상황도 그대로이고 내용도 없으면 남길 게 없음
      if (!payload.memo && payload.status === x.status) { toast('진행상황을 바꾸거나 진행 내용을 적어 주세요.', 'error'); form.memo.focus(); return; }
      if (/완료/.test(payload.status) && !payload.doneDate) { toast('완료일을 입력해 주세요.', 'error'); form.doneDate.focus(); return; }
      saving = true; btn.disabled = true;
      call('addMailStep', payload).then(function (res) {
        S.mlStack = S.mlStack || {};
        S.mlStack[x.id] = true; // 남긴 기록이 스택 맨 위에 보이게 그 메일의 스택을 펼쳐 둠
        closeModal(); applyState(res); toast('진행 기록을 남겼어요.');
      }, function () { saving = false; btn.disabled = false; });
    });
  }

  /* ---------- 추가·수정 창 ---------- */
  // 새 메일: 처음 진행상황을 고름 / 등록된 메일: 진행상황은 + 다음 단계로만 바꿈 (진행 기록이 쌓이게)
  // 엑셀에서 가져온 메일은 PI·PM만 고치고, 그 밖의 계정에는 보기만(+ 다음 단계는 가능)
  function openMailModal(id) {
    var x = id ? mlAll().filter(function (m) { return m.id === id; })[0] : null;
    if (id && !x) { toast('기록을 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.', 'error'); return; }
    var ro = !!x && !mlCanEdit(x); // 보기만
    // 드롭다운에는 ‘고르기’ 같은 빈 항목이 없음: 새 기록은 유형·사업명이 목록의 첫 번째로 미리 골라져 있음
    var v = x || { urgency: '일반', dbDev: '', requestDate: today(), requester: S.user.name, type: L.MAIL_TYPES[0],
      project: mlProjectNames()[0] || '', title: '', content: '', reviewer: '', developer: '', status: 'PM팀 검토', doneDate: '', note: '' };
    var REQ = ro ? '' : ' <em>*</em>';
    var statuses = L.MAIL_STATUSES.slice();
    if (v.status && statuses.indexOf(v.status) < 0) statuses.push(v.status);
    var types = L.MAIL_TYPES.slice();
    if (v.type && types.indexOf(v.type) < 0) types.push(v.type);
    var projs = mlProjectNames();
    if (v.project && projs.indexOf(v.project) < 0) projs.push(v.project); // 기간이 지난 과제 등 예전 기록의 사업명은 그대로 둠
    var dd = L.splitNames(v.dbDev);
    var history = x ? mlHistoryBlock(mlLogs(x.id)) : '';
    var doneOk = /완료/.test(v.status);
    // 진행상황 칸: 새 메일은 고르고, 등록된 메일은 지금 상황만 보여 줌
    var statusFld = x
      ? '<div class="fld"><span class="lbl">진행상황 <span class="hint">+ 다음 단계로 바꿔요</span></span><div class="ml-status-now">' + mlChip(v.status) + '</div><input type="hidden" name="status" value="' + esc(v.status) + '"></div>'
      : '<label class="fld"><span class="lbl">진행상황' + REQ + '</span><select class="inp" name="status">' + options(statuses, v.status || statuses[0]) + '</select></label>';
    var m = openModal({
      title: x ? '메일 기록 · ' + (x.title || '') : '메일 기록 추가', size: 'wide',
      body: (ro ? '<p class="warn-text">엑셀에서 가져온 메일은 PM만 고칠 수 있어요. 진행 내용은 아래 <b>+ 다음 단계</b>로 남겨 주세요.</p>' : '') +
        '<form class="form" id="ml-form" autocomplete="off" novalidate>' +
        (ro ? '<fieldset class="ml-ro" disabled>' : '') +
        '<div class="form-grid"><div class="fld"><span class="lbl">구분' + REQ + '</span><div class="seg-group" role="radiogroup" aria-label="구분">' + L.MAIL_URGENCY.map(function (u) {
          return '<label class="seg-btn' + (v.urgency === u ? ' on' : '') + '"><input type="radio" name="urgency" value="' + u + '"' + (v.urgency === u ? ' checked' : '') + ' hidden>' + u + '</label>';
        }).join('') + '</div></div>' +
        '<div class="fld"><span class="lbl">DB/개발' + REQ + ' <span class="hint">여러 개 고를 수 있어요</span></span><div class="ml-dd-pick">' + L.MAIL_DBDEV.map(function (d) {
          return '<label class="check"><input type="checkbox" name="dbDev" value="' + d + '"' + (dd.indexOf(d) >= 0 ? ' checked' : '') + '> ' + d + '</label>';
        }).join('') + '</div></div></div>' +
        '<div class="form-grid four"><label class="fld"><span class="lbl">요청일' + REQ + '</span><input type="date" class="inp" name="requestDate" value="' + esc(v.requestDate) + '"></label>' +
        '<label class="fld"><span class="lbl">요청자' + REQ + '</span><input class="inp" name="requester" maxlength="50" value="' + esc(v.requester) + '"></label>' +
        '<label class="fld"><span class="lbl">유형' + REQ + '</span><select class="inp" name="type">' + options(types, v.type) + '</select></label>' +
        '<label class="fld"><span class="lbl">사업명' + REQ + '</span><select class="inp" name="project">' + options(projs, v.project) + '</select></label></div>' +
        '<label class="fld"><span class="lbl">제목' + REQ + '</span><input class="inp" name="title" maxlength="200" value="' + esc(v.title) + '"></label>' +

  /* ---------- 엑셀 가져오기 (과제 관리 > 메일 송부 현황 가져오기, PI만) ---------- */
  // 머리글 이름 → 항목 (공백 무시). 엑셀 양식: 구분 | DB/개발 | 요청일 | 요청자 | 유형 | 사업명 | 제목 | 내용 | 검토자 | 개발자 | 진행상황 | 완료일 | 비고
  var ML_HEAD = { '구분': 'urgency', 'DB/개발': 'dbDev', 'DB개발': 'dbDev', '요청일': 'requestDate', '요청자': 'requester', '유형': 'type', '사업명': 'project', '사업': 'project',
    '제목': 'title', '내용': 'content', '검토자': 'reviewer', '개발자': 'developer', '진행상황': 'status', '진행상태': 'status', '완료일': 'doneDate', '비고': 'note' };
  // 날짜 읽기: 4.15 / 05.06 / 4.23. / 5/13 / 2026-04-15 / 2026.4.15 / 4/15/26. 연도가 없으면 year
  function mlParseDate(v, year) {
    var s = String(v === null || v === undefined ? '' : v).trim().replace(/\s+/g, '');
    if (!s || s === '-') return null;
    var m = /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s);
    if (m) return { y: +m[1], m: +m[2], d: +m[3] };
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s); // 엑셀 날짜 칸 (월/일/연)
    if (m) return { y: m[3].length === 2 ? 2000 + +m[3] : +m[3], m: +m[1], d: +m[2] };
    m = /^(\d{1,2})[./-](\d{1,2})\.?$/.exec(s);
    if (m) return { y: year, m: +m[1], d: +m[2], noYear: true };
    return null;
  }
  function mlYmd(o) {
    if (!o || o.m < 1 || o.m > 12 || o.d < 1 || o.d > 31) return '';
    var t = new Date(Date.UTC(o.y, o.m - 1, o.d));
    if (t.getUTCMonth() !== o.m - 1) return ''; // 2.30 같은 없는 날짜
    return o.y + '-' + ('0' + o.m).slice(-2) + '-' + ('0' + o.d).slice(-2);
  }
  // 시트 하나 읽기: ‘요청일’과 ‘제목’이 있는 줄을 머리글로 보고 그 아래 줄을 메일로
  function mlParseSheet(X, ws, sheetName, baseYear) {
    var aoa = X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    var map = null, items = [], bad = [], year = baseYear, prevMonth = 0;
    aoa.forEach(function (row, i) {
      var cells = row.map(function (c) { return String(c === null || c === undefined ? '' : c).trim(); });
      if (!map) {
        var hs = cells.map(function (c) { return c.replace(/\s+/g, ''); });
        if (hs.indexOf('요청일') >= 0 && hs.indexOf('제목') >= 0) {
          map = {};
          hs.forEach(function (h, j) { if (ML_HEAD[h] && map[ML_HEAD[h]] === undefined) map[ML_HEAD[h]] = j; });
        }
        return;
      }
      var get = function (k) { return map[k] === undefined ? '' : (cells[map[k]] || ''); };
      if (!get('title') && !get('content')) return; // 빈 줄
      var rd = mlParseDate(get('requestDate'), year);
      // 연도 없는 날짜가 12월 → 1월처럼 크게 줄면 다음 해로
      if (rd && rd.noYear) {
        if (prevMonth && rd.m < prevMonth - 6) { year++; rd.y = year; }
        prevMonth = rd.m;
      } else if (rd) { year = rd.y; prevMonth = rd.m; }
      var reqDate = mlYmd(rd);
      if (!reqDate) { bad.push((i + 1) + '행 요청일(' + (get('requestDate') || '빈칸') + ')'); return; }
      var dd = mlParseDate(get('doneDate'), rd.y);
      if (dd && dd.noYear && dd.m < rd.m - 6) dd.y = rd.y + 1; // 12월 요청 → 1월 완료
      items.push({
        sheet: sheetName, row: i + 1,
        urgency: get('urgency'), dbDev: get('dbDev'), requestDate: reqDate, requester: get('requester'), type: get('type'),
        project: get('project'), title: get('title'), content: get('content'), reviewer: get('reviewer'), developer: get('developer'),
        status: get('status'), doneDate: mlYmd(dd), note: get('note')
      });
    });
    return { sheet: sheetName, found: !!map, items: items, bad: bad };
  }

  function mlReadFile(file) {
    if (!file) return;
    if (!isPI()) { toast('엑셀 가져오기는 PI만 할 수 있어요.', 'error'); return; }
    setBusy(true);
    var reader = new FileReader();

    };

  function mlImportItems() {
    var imp = mlImp, have = {};

    mlAll().forEach(function (x) { have[key(x)] = true; });

   *  - 엑셀 내려받기: 사업마다 시트 하나, 양식과 같은 머리글(짙은 회청색·흰 글씨). ExcelJS를 필요할 때만 불러옴
   *  - 연구사업 > 진행사항(유지보수 과제)의 ‘이력’ 보기도 이 표(mhTable)를 씀
   * 빌드할 때 app.html 화면 코드 안(BIZ_UI 자리)에 그대로 들어갑니다.
   * ========================================================================== */
  var MH_STATUSES = ['대기', '진행중', '완료', '보류']; // 고르는 순서 (서버는 L.STATUSES로 확인)
  function mhAll() { return S.data.maintHistory || []; }
  function mhProjects() { return maintProjects().slice().sort(projOrder); }
  // 쓰기·고치기: PEO·PI면 볼 수 있는 유지보수 과제 모두 (연구자는 배정된 과제만 받음, 서버에서도 확인)
  function mhCanEdit() { return seesBiz() && mhProjects().length > 0; }
  function mhCat(x) { return x.category === '시스템' ? '<span class="st st-run mh-cat">시스템</span>' : '<span class="st st-wait mh-cat">' + esc(x.category || '일반') + '</span>'; }
  function mhLate(x) { return x.status !== '완료' && x.status !== '보류' && x.dueDate && x.dueDate < today(); }
  function mhMD(d) { return d ? d.slice(5, 7) + '.' + d.slice(8, 10) : ''; } // 엑셀 양식의 날짜 (12.26)

  // 정렬: 기본은 요청일 최근 순 (같은 날이면 나중에 넣은 것 먼저). 머리글을 누르면 그 열 기준
  SORTERS.mhist = {
    category: function (x) { return x.category; }, requester: function (x) { return x.requester; }, requestDate: function (x) { return x.requestDate; },
    status: function (x) { return MH_STATUSES.indexOf(x.status); }, dueDate: function (x) { return x.dueDate; },
    researcher: function (x) { return x.researcher; }, developer: function (x) { return x.developer; }, designer: function (x) { return x.designer; }
  };
  function mhByRecent(a, b) {
    if (a.requestDate !== b.requestDate) return a.requestDate < b.requestDate ? 1 : -1;
    return String(a.createdAt || '') < String(b.createdAt || '') ? 1 : -1;
  }
  // 연도·월: 그때 요청했거나, 작업 기한(완료일)이 그때인 이력 (월만 고르면 모든 해의 그 달)
  function mhInMonth(x, year, month) {
    function hit(d) { return !!d && (!year || d.slice(0, 4) === year) && (!month || d.slice(5, 7) === month); }
    return hit(x.requestDate) || hit(x.dueDate);
  }
  // f: 조건 (유지보수 > 이력은 S.mh, 연구사업 진행사항의 이력 보기는 그 화면 조건을 바꿔서 넘김)
  function mhFiltered(f, projectName) {
    return mhAll().filter(function (x) {
      if (projectName && x.project !== projectName) return false;
      if (!projectName && f.project && x.project !== f.project) return false;
      if ((f.year || f.month) && !mhInMonth(x, f.year, f.month)) return false;
      if (f.category && x.category !== f.category) return false;
      if (f.status && x.status !== f.status) return false;
      if (f.hideDone && x.status === '완료') return false;
      return matchQ(f.q, [x.project, x.requester, x.content, x.result, x.researcher, x.developer, x.designer, x.category, x.status]);
    }).sort(mhByRecent);
  }

  /* ---------- 화면: 유지보수 > 이력 ---------- */
  function viewMaintHistory() {
    var head = '<div class="view-head"><h1>유지보수 이력 <span class="title-pill">월간보고용</span></h1></div>';
    if (!mhProjects().length) return head + '<div class="card empty"><strong>표시할 유지보수 과제가 없어요</strong></div>';
    var f = S.mh, ys = {};
    ys[today().slice(0, 4)] = true;
    mhAll().forEach(function (x) { if (x.requestDate) ys[x.requestDate.slice(0, 4)] = true; if (x.dueDate) ys[x.dueDate.slice(0, 4)] = true; });
    var months = [];
    for (var i = 1; i <= 12; i++) months.push([('0' + i).slice(-2), i + '월']);
    var filters = '<div class="filters">' +
      '<select class="inp" data-filter="mh.project" aria-label="사업">' + options(mhProjects().map(function (p) { return p.name; }), f.project, '전체 사업') + '</select>' +
      '<select class="inp" data-filter="mh.year" aria-label="연도">' + options(Object.keys(ys).sort().reverse().map(function (y) { return [y, y + '년']; }), f.year, '전체 연도') + '</select>' +
      '<select class="inp" data-filter="mh.month" aria-label="월" title="그 달에 요청했거나 작업 기한(완료일)이 그 달인 이력">' + options(months, f.month, '전체 월') + '</select>' +
      '<select class="inp" data-filter="mh.category" aria-label="구분">' + options(L.MH_CATEGORIES, f.category, '전체 구분') + '</select>' +
      '<select class="inp" data-filter="mh.status" aria-label="작업 진행 상황">' + options(MH_STATUSES, f.status, '전체 진행 상황') + '</select>' +
      '<input type="search" class="inp search" data-filter="mh.q" placeholder="요청자·내용·담당 검색" value="' + esc(f.q) + '" aria-label="검색">' +
      '<label class="check"><input type="checkbox" data-filter="mh.hideDone"' + (f.hideDone ? ' checked' : '') + '> 완료 숨기기</label></div>';
    return head + filters + mhPanel(mhFiltered(f), '', true);
  }
  // 이력 표 패널. projectName: 한 사업만 (연구사업 진행사항). 여러 사업이면 사업 이름 줄 아래로 묶어 보여 줌
  function mhPanel(rows, projectName, withExport) {
    var edit = mhCanEdit();
    var all = projectName ? mhAll().filter(function (x) { return x.project === projectName; }) : mhAll();
    var empty = all.length

    return '<section class="panel"><div class="panel-head"><h2>이력</h2><span class="count">' + rows.length + (projectName ? ' / ' + all.length : '') + '건</span>' +
      '<span class="spacer"></span>' +
      (withExport ? '<button class="btn" data-act="mh-export"' + (projectName ? ' data-project="' + esc(projectName) + '"' : '') + '>⤓ 엑셀 다운로드</button>' : '') +
      (edit ? '<button class="btn primary" data-act="mh-add"' + (projectName ? ' data-project="' + esc(projectName) + '"' : '') + '>+ 이력 추가</button>' : '') + '</div>' +
      (rows.length ? mhTable(rows, !projectName) : empty) + '</section>';
  }
  var MH_COLS = 10;
  function mhTable(rows, groupByProject) {
    var sh = function (k, l, cls) { return sortHead('mhist', k, l, cls); };
    var two = function (k, l, cls) { return sh(k, l, cls).replace('<th ', '<th rowspan="2" '); };
    var thead = '<thead><tr>' + two('category', '구분') + '<th colspan="3" class="ml-grp">수정 요청 사항</th>' +
      '<th rowspan="2">특이사항(처리내용)</th>' + two('status', '작업 진행 상황') + two('dueDate', '작업 기한(완료일)') +
      '<th colspan="3" class="ml-grp">담당</th></tr><tr>' +
      sh('requester', '요청자') + sh('requestDate', '요청일') + '<th>세부 내용</th>' +
      sh('researcher', '연구원') + sh('developer', '개발자') + sh('designer', '디자인') + '</tr></thead>';
    var sorted = applySort('mhist', rows), edit = mhCanEdit();
    function row(x) {
      return '<tr' + (edit ? ' class="clickable" data-act="mh-edit" data-id="' + esc(x.id) + '"' : '') + '>' +
        '<td>' + mhCat(x) + '</td><td>' + (esc(x.requester) || '-') + '</td><td class="date">' + fmtDate(x.requestDate) + '</td>' +
        '<td class="wrap mh-content">' + esc(x.content) + '</td><td class="wrap mh-result">' + (esc(x.result) || '<span class="hint">-</span>') + '</td>' +
        '<td>' + statusChip(x.status) + '</td>' +
        '<td class="date">' + (fmtDate(x.dueDate) || '-') + (mhLate(x) ? ' <span class="late">⚠ 지연</span>' : '') + '</td>' +
        '<td>' + (esc(x.researcher) || '-') + '</td><td>' + (esc(x.developer) || '-') + '</td><td>' + (esc(x.designer) || '-') + '</td></tr>';
    }
    var body;
    if (groupByProject) {
      var by = {}, order = [];
      sorted.forEach(function (x) { if (!by[x.project]) { by[x.project] = []; order.push(x.project); } by[x.project].push(x); });
      var rank = {};
      mhProjects().forEach(function (p, i) { rank[p.name] = i; });
      order.sort(function (a, b) { return (rank[a] === undefined ? 999 : rank[a]) - (rank[b] === undefined ? 999 : rank[b]); });
      body = order.map(function (pn) {
        return '<tr class="mh-grp"><td colspan="' + MH_COLS + '"><span class="mh-grp-name">' + esc(pn) + '</span> <span class="count">' + by[pn].length + '건</span></td></tr>' + by[pn].map(row).join('');

  }

  /* ---------- 추가·수정 창 ---------- */
  function mhNameList() {

        '<label class="fld"><span class="lbl">요청일' + REQ + '</span><input type="date" class="inp" name="requestDate" value="' + esc(v.requestDate) + '"></label></div>' +
        '<label class="fld"><span class="lbl">세부 내용' + REQ + '</span><textarea class="inp" name="content" rows="3" maxlength="1000" placeholder="예: 사용자페이지 독성정보탭 오류 수정 요청">' + esc(v.content) + '</textarea></label>' +
        '<label class="fld"><span class="lbl">특이사항(처리내용)</span><textarea class="inp" name="result" rows="3" maxlength="2000" placeholder="예: 메뉴 추가 및 css 수정">' + esc(v.result) + '</textarea></label>' +
        '<div class="form-grid"><div class="fld"><span class="lbl">작업 진행 상황' + REQ + '</span>' + seg('status', MH_STATUSES, v.status) + '</div>' +

    });
