  /* ---------- 엑셀 내려받기 (월간보고 양식) ----------
   * 사업마다 시트 하나 (이름: ‘번호. 사업’, 예: 9. mToxInfo). 1~2줄 머리글, 3줄부터 요청일 순
   * 머리글: 맑은 회청색(44546A) 바탕·흰 굵은 글씨·가는 테두리, 날짜는 12.26 같은 글자 */
  var EXCELJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
  var excelJsPromise = null;
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (!excelJsPromise) {
      excelJsPromise = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = EXCELJS_URL;
        s.onload = function () { window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('엑셀 기능을 불러오지 못했어요.')); };
        s.onerror = function () { excelJsPromise = null; reject(new Error('엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')); };
        document.head.appendChild(s);
      });
    }
    return excelJsPromise;
  }
  // 시트 이름: 31자 이내, : \ / ? * [ ] 는 쓸 수 없음. 겹치면 뒤에 (2)
  function mhSheetName(pn, used) {
    var p = projByName(pn), base = ((p && p.no ? p.no + '. ' : '') + pn).replace(/[:\\\/?*\[\]]/g, ' ').slice(0, 31) || '이력';
    var name = base, n = 2;
    while (used[name.toLowerCase()]) { name = base.slice(0, 27) + ' (' + n + ')'; n++; }
    used[name.toLowerCase()] = true;
    return name;
  }
  // f: 화면 조건 (파일 이름에 연도·월을 붙임)
  function mhExport(rows, f) {
    if (!rows.length) { toast('내려받을 이력이 없어요.', 'error'); return; }
    setBusy(true);
    loadExcelJS().then(function (EJ) {
      var wb = new EJ.Workbook(), used = {};
      var by = {}, order = [];
      rows.slice().sort(function (a, b) { return -mhByRecent(a, b); }).forEach(function (x) { // 시트 안은 요청일 순 (오래된 것부터)
        if (!by[x.project]) { by[x.project] = []; order.push(x.project); } by[x.project].push(x);
      });
      var rank = {};
      mhProjects().forEach(function (p, i) { rank[p.name] = i; });
      order.sort(function (a, b) { return (rank[a] === undefined ? 999 : rank[a]) - (rank[b] === undefined ? 999 : rank[b]); });
      var thin = { style: 'thin', color: { argb: 'FF000000' } };
      var headStyle = {
        font: { name: 'Noto Sans KR', size: 9, bold: true, color: { argb: 'FFFFFFFF' } },
        fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF44546A' } },
        alignment: { horizontal: 'center', vertical: 'middle', wrapText: true },
        border: { top: thin, left: thin, bottom: thin, right: thin }
      };
      // 열 너비: 양식과 비슷하게 (담당 칸은 이름이 길 수 있어 조금 넓게). ExcelJS는 너비 9를 기본값으로 보고 빼 버리므로 9.5
      var widths = [12.5, 10, 7, 57.5, 70.5, 12, 12.5, 9.5, 9.5, 9.5];
      var center = [1, 2, 3, 6, 7, 8, 9, 10];
      order.forEach(function (pn) {
        var ws = wb.addWorksheet(mhSheetName(pn, used), { views: [{ state: 'frozen', xSplit: 0, ySplit: 2 }] });
        widths.forEach(function (w, i) { ws.getColumn(i + 1).width = w; });
        ws.getRow(1).values = ['구분', '수정 요청 사항', '', '', '특이사항(처리내용)', '작업 진행 상황', '작업 기한(완료일)', '담당', '', ''];
        ws.getRow(2).values = ['', '요청자', '요청일', '세부 내용', '', '', '', '연구원', '개발자', '디자인'];
        ['A1:A2', 'B1:D1', 'E1:E2', 'F1:F2', 'G1:G2', 'H1:J1'].forEach(function (r) { ws.mergeCells(r); });
        [1, 2].forEach(function (r) {
          for (var c = 1; c <= MH_COLS; c++) { var cell = ws.getCell(r, c); cell.font = headStyle.font; cell.fill = headStyle.fill; cell.alignment = headStyle.alignment; cell.border = headStyle.border; }
        });
        by[pn].forEach(function (x, i) {
          var row = ws.getRow(i + 3);
          row.values = [x.category, x.requester, mhMD(x.requestDate), x.content, x.result, x.status, mhMD(x.dueDate), x.researcher, x.developer, x.designer];
          for (var c = 1; c <= MH_COLS; c++) {
            var cell = row.getCell(c);
            cell.font = { name: 'Arial', size: 10 };
            cell.alignment = { horizontal: center.indexOf(c) >= 0 ? 'center' : 'left', vertical: 'middle', wrapText: c === 4 || c === 5 };

  /* ---------- 엑셀 가져오기 (과제 관리 > 유지보수 이력 가져오기, PI만) ----------

  function mhParseSheet(X, ws, sheetName, lastYear) {

    'admin-tab': function (el) { S.adminTab = el.getAttribute('data-tab'); renderView(); },
    'over-tab': function (el) { S.overTab = el.getAttribute('data-tab'); renderView(); },
    'user-menu': function () { var m = $('#user-menu'); m.hidden = !m.hidden; },
    'logout': function () {
      logout('', true);
      toast('로그아웃했어요. 이 계정으로 다른 곳에 열려 있던 화면도 함께 로그아웃됐어요.');
    },
    'change-password': function () { openPasswordModal(); },
    'storage-refresh': function () { loadStorage(); toast('저장 공간을 다시 확인했어요.'); },
    'modal-close': function (el) { if (el.getAttribute('data-confirm')) finishConfirm(false); else { historyOpen = null; closeModal(); } },
    // 바깥(어두운 배경)을 눌렀다가 바깥에서 뗐을 때만 닫음.
    // 팝업 안에서 글자를 드래그해 고르다 바깥에서 놓아도 click이 배경에서 생기므로, 누른 곳도 함께 확인
    'modal-backdrop': function (el, e) { if (e.target !== el || pressTarget !== el || releaseTarget !== el) return; if (el.getAttribute('data-confirm')) finishConfirm(false); else { historyOpen = null; closeModal(); } },
    'confirm-yes': function () { finishConfirm(true); },
    'confirm-no': function () { finishConfirm(false); },
    'new-record': function () { openRecordModal({}); },
    'edit-record': function (el) {
      var r = S.data.records.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (r) openRecordModal({ record: r });
    },
    'delete-record': function (el) { deleteRecord(el.getAttribute('data-id')); },
    'next-stage': function (el) { nextStage(el.getAttribute('data-project'), el.getAttribute('data-receipt')); },
    'toggle-stack': function (el) { toggleStack(el.getAttribute('data-key')); },
    'history': function (el) { openHistory(el.getAttribute('data-project'), el.getAttribute('data-receipt')); },
    'sort': function (el) { cycleSort(el.getAttribute('data-table'), el.getAttribute('data-key')); },
    'toggle-group': function (el) { toggleGroup(el.getAttribute('data-key')); },
    'close-case': function (el) { openCloseModal(el.getAttribute('data-project'), el.getAttribute('data-receipt')); },
    'reopen-case': function (el) { reopenCase(el.getAttribute('data-project'), el.getAttribute('data-receipt')); },
    'expand-all': function () { expandAll(true); },
    'collapse-all': function () { expandAll(false); },
    'pick-year': function (el) {
      var y = el.getAttribute('data-year');
      S.g.year = (S.g.year === y || y === '미상') ? '' : y;
      renderView();
    },
    'export-summary': function () { exportSummary(); },
    'backup-export': function () { exportBackup(); },
    'new-project': function () { openProjectModal(); },
    'edit-project': function (el) { openProjectModal(el.getAttribute('data-name')); },
    'delete-project': function (el) {
      var name = el.getAttribute('data-name');
      confirmBox('<b>' + esc(name) + '</b> 과제를 삭제할까요?', '삭제', true).then(function (ok) {
        if (ok) call('deleteProject', { name: name }).then(function (res) { if ($('#proj-form')) closeModal(); applyState(res); toast('삭제했어요.'); }, noop);
      });
    },
    'pj-reset': function () { S.pj.q = S.pj.kind = S.pj.ministry = S.pj.contract = S.pj.year = ''; renderView(); },
    'pj-drag': function () {}, // 손잡이는 누르기만 하면 아무 일도 없음 (줄 클릭 → 수정 창 막기)
    'new-user': function (el) { openUserModal(null, el.getAttribute('data-name') || ''); },
    'edit-user': function (el) { openUserModal(el.getAttribute('data-name')); },
    'delete-user': function (el) { deleteUser(el.getAttribute('data-name')); },
    'run-import': function () { runImport(); },
    'export-converted': function () { exportConverted(); },
    'clear-imported': function () { clearImported(); },
    'demo-seed': function () { Demo.seed(); toast('샘플 데이터를 넣었어요. 비밀번호는 1234예요.'); showLogin(); },
    'demo-reset': function () {
      confirmBox('체험 데이터를 모두 지우고 처음 상태로 돌아갈까요?', '초기화', true).then(function (ok) {
        if (!ok) return;
        Demo.reset(); sessionSet(null); S.token = null; S.tab = null; S.imp = null; showLogin();
      });
    }
  };
  Object.keys(BIZ_ACTIONS).forEach(function (k) { actions[k] = BIZ_ACTIONS[k]; });

  // 마우스·터치를 누른 곳과 뗀 곳 (팝업 바깥 클릭 판단용: 둘 다 바깥일 때만 닫음)
  var pressTarget = null, releaseTarget = null;
  document.addEventListener('pointerdown', function (e) { pressTarget = e.target; }, true);
  document.addEventListener('pointerup', function (e) { releaseTarget = e.target; }, true);
  document.addEventListener('click', function (e) {
    var menu = $('#user-menu');
    if (menu && !menu.hidden && !e.target.closest('.userbox')) menu.hidden = true;
    var el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.closest('.menu')) $('#user-menu').hidden = true;
    var fn = actions[el.getAttribute('data-act')];
    if (fn) fn(el, e);
  });

  function setFilter(path, el) {
    var parts = path.split('.'), obj = S[parts[0]], key = parts[1];
    if (el.type === 'checkbox') obj[key] = el.checked;
    else if (el.type === 'number') { var n = parseInt(el.value, 10); if (!(n >= 1)) return; obj[key] = Math.min(365, n); }
    else obj[key] = el.value;
    if (parts[0] === 'sf' && (key === 'hide' || key === 'days')) {
      savePrefs();
      var daysInput = $('[data-filter="sf.days"]');
      if (daysInput) daysInput.disabled = !S.sf.hide;
    }
    if (parts[0] === 'g') { renderView(); return; } // 연도는 모든 탭 공통이라 화면 전체를 다시 그림
    if (parts[0] === 'pj') { // 과제 관리 > 연구사업
      if (path === 'pj.hideEnded') { // 공통 설정: 서버에 저장 (화면은 먼저 바꾸고, 실패하면 되돌림)
        var on = el.checked;
        if (S.data) S.data.settings = Object.assign({}, S.data.settings, { hideEnded: on });
        renderView();
        call('saveSetting', { key: 'hideEnded', value: on }).then(function (res) {
          applyState(res); toast('기간이 지난 과제 ' + (on ? '숨기기' : '보이기') + '를 모든 사람에게 적용했어요.');
        }, function () { S.data.settings = Object.assign({}, S.data.settings, { hideEnded: !on }); renderView(); });
        return;
      }
      if (path === 'pj.q') renderBelowFilters(viewAdmin); else renderView(); // 검색 칸은 그대로 (한글 입력이 끊기지 않게)
      return;
    }
    if (path === 'bz.q') { renderBizResults(); return; } // 검색 칸은 그대로 두고 결과만 (한글 입력이 끊기지 않게)
    if (parts[0] === 'ml') { if (path === 'ml.q') renderBelowFilters(viewMail); else renderView(); return; } // 메일 송부 현황
    if (parts[0] === 'mh') { if (path === 'mh.q') renderBelowFilters(viewMaintHistory); else renderView(); return; } // 유지보수 이력
    if (parts[0] === 'rp' || parts[0] === 'oc') { // 업무보고·성과관리
      if (path === 'oc.project') S.oc.yearNo = '';
      renderView();
      return;
    }
    if (parts[0] === 'bz' || parts[0] === 'rf' || parts[0] === 'pv' || parts[0] === 'rv') { // 사업 화면: 상위 선택이 바뀌면 하위 선택은 처음부터
      if (path === 'bz.project') { S.bz.yearNo = ''; S.bz.code = ''; S.bzFocus = ''; }
      if (path === 'bz.hideDone') { S.bzFocus = ''; savePrefs(); }
      if (path === 'bz.yearNo') S.bz.code = '';
      if (path === 'rf.project') S.rf.yearNo = '';
      renderView();
      return;
    }
    if (path === 'f.grouped') { savePrefs(); renderView(); return; } // 모두 펼치기/접기 버튼도 바뀜
    if (path === 'f.hideDone') savePrefs();
    if (S.tab === 'summary') renderSummaryTable(); else renderProgressTable();
  }
  document.addEventListener('input', function (e) {
    var el = e.target;
    var path = el.getAttribute && el.getAttribute('data-filter');
    if (path && (el.type === 'search' || el.type === 'text' || el.type === 'number')) setFilter(path, el);
    if (el.hasAttribute && el.hasAttribute('data-imp-name')) S.imp.sheets[+el.getAttribute('data-imp-name')].project = el.value;
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    var path = el.getAttribute && el.getAttribute('data-filter');
    if (path && (el.tagName === 'SELECT' || el.type === 'checkbox')) setFilter(path, el);
    if (bizChange(el)) return;
    if (el.id === 'restore-file') { readRestoreFile(el.files[0]); el.value = ''; return; }
    if (el.id === 'import-file') readImportFile(el.files[0]);
    if (el.hasAttribute && el.hasAttribute('data-imp-sel')) { S.imp.sheets[+el.getAttribute('data-imp-sel')].selected = el.checked; renderView(); }
  });
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (form.id === 'login-form') {
      e.preventDefault();
      var err = $('#login-err');
      if (!form.name.value.trim()) { err.textContent = '이름을 입력해 주세요.'; form.name.focus(); return; }
      if (!form.password.value) { err.textContent = '비밀번호를 입력해 주세요.'; form.password.focus(); return; }
      var btn = form.querySelector('button[type=submit]'); btn.disabled = true;
      Backend.call({ action: 'login', payload: { name: form.name.value, password: form.password.value } }).then(function (session) {
        S.token = session.token;
        return call('load').then(function (res) { enter(res.state, session); });
      }).catch(function (ex) { btn.disabled = false; err.textContent = (ex && ex.message) || String(ex); form.password.select(); });
    }
    if (form.id === 'setup-form') {
      e.preventDefault();
      var err2 = $('#login-err');
      if (form.password.value !== form.password2.value) { err2.textContent = '비밀번호가 서로 달라요.'; return; }
      Backend.call({ action: 'setup', payload: { name: form.name.value, password: form.password.value } }).then(function (session) {
        S.token = session.token;
        return call('load').then(function (res) { S.tab = 'admin'; S.adminTab = 'users'; enter(res.state, session); toast('PI 계정을 만들었어요. 이제 팀원 계정과 과제를 추가하세요.'); });
      }).catch(function (ex) { err2.textContent = (ex && ex.message) || String(ex); });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (bizKeydown(e)) return;
    if (e.key !== 'Escape') return;
    if ($('#confirm-root').innerHTML) finishConfirm(false);
    else if ($('#modal-root').innerHTML) { historyOpen = null; closeModal(); }
    else if ($('#user-menu') && !$('#user-menu').hidden) $('#user-menu').hidden = true;
  });

  // 막대 툴팁
  var tip = $('#tip');
  document.addEventListener('mousemove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.classList.remove('on'); return; }
    tip.textContent = t.getAttribute('data-tip');
    tip.classList.add('on');
    var x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px';
    tip.style.top = (e.clientY - tip.offsetHeight - 10) + 'px';
  });

  // 테스트·점검용으로 일부 기능 노출
  window.MaintApp = {
    state: S, importFromBuffer: importFromBuffer, bizImportFromBuffer: bizImportFromBuffer, demo: Demo, summarize: L.summarize
  };

  start();
})();
</script>
</body>
</html>
