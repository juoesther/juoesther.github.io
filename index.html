<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  color-scheme: light;
  --page: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fa;
  --surface-3: #eef0f3;
  --line: #e4e6ea;
  --line-strong: #cdd1d8;
  --ink: #15171c;
  --ink-2: #4a505c;
  --muted: #80868f;
  --accent: #2a78d6;
  --accent-strong: #1c5cab;
  --accent-wash: #e9f1fc;
  --on-accent: #ffffff;
  --danger: #c62f2f;
  --danger-wash: #fdecec;
  --good-ink: #116611;
  --good-wash: #e6f4e6;
  --good-mark: #0ca30c;
  --warn-ink: #855600;
  --warn-wash: #fff2d4;
  --warn-mark: #fab219;
  --idle-ink: #555b66;
  --idle-wash: #eef0f3;
  --critical-mark: #d03b3b;
  --final-bg: #1d6b1d;
  --final-ink: #ffffff;
  /* 단계: 같은 파랑 계열을 단계 순서대로 진하게 */
  --s1: #86b6ef;
  --s2: #5598e7;
  --s3: #2a78d6;
  --s4: #1c5cab;
  --s5: #104281;
  --sN: #a9a8a0;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 10px 28px rgba(16, 24, 40, .10);
  --radius: 10px;
  /* 관리(버튼) 열, 검색 조건, 펼친 안건 */
  --act-bg: #f2f5fa;
  --act-head: #e3e9f2;
  --filter-bg: #e9eff7;
  --filter-line: #d5deea;
  --danger-line: #ebbcbc;
  --open-bg: #f0f6ff;
  /* 일정 종류: 같은 밝기의 차분한 색 */
  /* 색(점) / 연한 바탕 / 테두리 / 진한 글씨 */
  --k-report: #2a78d6; --k-report-w: #dce9fb; --k-report-b: #b7d0f3; --k-report-t: #18539c;
  --k-present: #7558d0; --k-present-w: #ebe5fb; --k-present-b: #d0c4f3; --k-present-t: #5034a8;
  --k-meet: #16917f; --k-meet-w: #dcf2ee; --k-meet-b: #b3e0d7; --k-meet-t: #0c6b5d;
  --k-etc: #868c96; --k-etc-w: #eceef1; --k-etc-b: #d5d9df; --k-etc-t: #4f5560;
  /* 진행 중인 연구 방법 수 (연한 → 진한 파랑) */
  --heat1: #d6e6fb; --heat2: #a9caf3; --heat3: #6fa6ea; --heat4: #2f7fdc;
  --period: #d9dee6;
  /* 과제별 RFP: RFP 묶음마다 다른 색 (진한 색 = 연구 방법 기간 / 연한 색 = 상위 항목 기간) */
  --rg1: #2f7fdc; --rg1-w: #cfe1f8;
  --rg2: #1f9d6b; --rg2-w: #cdeedd;
  --rg3: #e08a1e; --rg3-w: #fbe4c4;
  --rg4: #7a5ad6; --rg4-w: #e2d9f8;
  --rg5: #d64f73; --rg5-w: #f8d4de;
  --rg6: #1597a6; --rg6-w: #c8ecf0;
  /* 주관부처 칩: 식약처 장미 · 기후부 초록 · 농진청 회청 (구분 칩 색과 겹치지 않게) */
  --mi1-w: #fce4ea; --mi1-t: #a3294d;
  --mi2-w: #e1f2d6; --mi2-t: #34691d;
  --mi3-w: #e3e8ef; --mi3-t: #3d4a5c;
  /* 구분 칩: 연구용역 파랑 · 일반용역 청록 · 출연과제 보라 · 정책연구 주황 (유지보수는 노랑) */
  --c4-w: #fde8d2; --c4-t: #94500c; --c4-b: #f5c79a;
  /* 이번 달 표시 (연간 계획표·RFP): 그 달 열 오른쪽 끝에 빨간 세로선 + 머리글 빨간 배지 */
  --today: #e5484d;
  --font: Pretendard, "Pretendard Variable", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f1012;
    --surface: #18191c;
    --surface-2: #1d1f23;
    --surface-3: #26282d;
    --line: #2c2f35;
    --line-strong: #3b3f47;
    --ink: #eef0f3;
    --ink-2: #b9bec8;
    --muted: #8a909b;
    --accent: #3987e5;
    --accent-strong: #86b6ef;
    --accent-wash: #172840;
    --danger: #ef7a7a;
    --danger-wash: #3a1e1e;
    --good-ink: #6fd46f;
    --good-wash: #16301a;
    --warn-ink: #f2c35e;
    --warn-wash: #3a2e12;
    --idle-ink: #b9bec8;
    --idle-wash: #26282d;
    --final-bg: #2e7d32;
    --final-ink: #ffffff;
    --s1: #184f95;
    --s2: #256abf;
    --s3: #3987e5;
    --s4: #6da7ec;
    --s5: #9ec5f4;
    --sN: #6b6a63;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
    --act-bg: #1e222a;
    --act-head: #262c36;
    --filter-bg: #1b2230;
    --filter-line: #2b3546;
    --danger-line: #6e3434;
    --open-bg: #172134;
    --k-report: #6da7ec; --k-report-w: #1c3150; --k-report-b: #2a4a75; --k-report-t: #a9cbf5;
    --k-present: #a993ef; --k-present-w: #2b2347; --k-present-b: #45386f; --k-present-t: #cbbcf6;
    --k-meet: #4fc4b3; --k-meet-w: #133631; --k-meet-b: #22574f; --k-meet-t: #8fe0d3;
    --k-etc: #8a909b; --k-etc-w: #2a2d33; --k-etc-b: #3a3f47; --k-etc-t: #c3c8d0;
    --heat1: #1b3352; --heat2: #224d80; --heat3: #2d6db8; --heat4: #4f95ea;
    --period: #353c47;
    --rg1: #5c9be8; --rg1-w: #1d3554;
    --rg2: #3fbf8a; --rg2-w: #15392b;
    --rg3: #f0a64a; --rg3-w: #43301a;
    --rg4: #a08af0; --rg4-w: #2d2650;
    --rg5: #ec7c99; --rg5-w: #45202b;
    --rg6: #3dbccb; --rg6-w: #133b40;
    --mi1-w: #47202c; --mi1-t: #f3a7bb;
    --mi2-w: #1f3317; --mi2-t: #a5d98a;
    --mi3-w: #2a313b; --mi3-t: #c2ccd8;
    --c4-w: #43301a; --c4-t: #f5c084; --c4-b: #6b4a22;
    --today: #ff6b70;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: 0; }
.hint { color: var(--muted); font-size: 13px; font-weight: 400; }
.sub { color: var(--ink-2); margin: 4px 0 0; font-size: 14px; }
[hidden] { display: none !important; }

/* 로딩 막대 */
#loadbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .2s; }
#loadbar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1s ease-in-out infinite; }
body.busy #loadbar { opacity: 1; }
body.busy { cursor: progress; }
@keyframes slide { from { left: -30%; } to { left: 100%; } }

.boot { display: grid; place-items: center; min-height: 100vh; color: var(--muted); }

/* 버튼·입력 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.danger { color: var(--danger); }
/* 기능 버튼은 모두 테두리 있는 상자 모양 */
.btn.ghost { border-color: var(--line-strong); background: var(--surface); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.ghost.danger, .btn.danger-line { color: var(--danger); border-color: var(--danger-line); background: var(--surface); }
.btn.ghost.danger:hover, .btn.danger-line:hover { background: var(--danger-wash); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; font-weight: 500; border-radius: 6px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, .inp:focus-visible, .tab:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-strong); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-weight: 600; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; font-size: 22px; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-3); }
.inp {
  height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); min-width: 0;
}
textarea.inp { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
select.inp { padding-right: 28px; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }
.inp.num { width: 72px; text-align: right; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

/* 데모 안내 */
.demo-bar { background: var(--warn-wash); color: var(--warn-ink); font-size: 14px; padding: 8px 16px; text-align: center; }
.demo-bar .link { color: var(--warn-ink); margin-left: 8px; }
.ver-bar { background: var(--danger-wash, var(--warn-wash)); color: var(--danger, var(--warn-ink)); font-weight: 600; }

/* 상단 바 */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px;
  padding: 0 24px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 800; }
.tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.tab {
  height: 56px; padding: 0 14px; border: 0; background: none; cursor: pointer; color: var(--ink-2);
  font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
/* 하위 메뉴 줄 (PEO·PI: 연구사업·유지보수 아래) */
.subnav {
  position: sticky; top: 56px; z-index: 19; display: flex; align-items: center; gap: 4px; padding: 6px 24px;
  background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
}
.subnav-g { font-size: 13px; font-weight: 700; color: var(--muted); margin-right: 8px; white-space: nowrap; }
.subnav-btn { height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 600; cursor: pointer; white-space: nowrap; }
.subnav-btn:hover { background: var(--surface-2); color: var(--ink); }
.subnav-btn.on { background: var(--accent-wash); color: var(--accent-strong); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.userbox { position: relative; }
/* 저장 공간 남은 양 (PI·PM, 계정 옆) */
.storage-chip {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; margin-right: -8px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
}
.storage-chip:hover { background: var(--surface-3); }
.storage-chip .st-bar { width: 44px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.storage-chip .st-bar i { display: block; height: 100%; background: var(--good-ink, #2e7d32); }
.storage-chip.warn .st-bar i { background: var(--warn-ink); }
.storage-chip.bad { color: var(--danger); border-color: var(--danger-line); }
.storage-chip.bad .st-bar i { background: var(--danger); }
.user-chip {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 4px; border-radius: 18px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.user-chip:hover { background: var(--surface-2); }
.avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-wash); color: var(--accent-strong); font-weight: 700; font-size: 14px; }
.uname { font-weight: 600; }
.urole { font-size: 13px; color: var(--muted); }
.menu {
  position: absolute; right: 0; top: 42px; min-width: 160px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 30;
}
.menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--surface-3); }

/* 본문 */
.view { max-width: 1680px; margin: 0 auto; padding: 24px; }
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
/* 회색 설명문은 보이지 않게 (경고·빈 화면 안내는 남김) */
.view-head .sub, .card-head .sub, .lbl .hint, .form > p.hint, .drop .hint, #view > p.hint { display: none; }
/* 검색 조건(위) ↔ 결과(아래) */
.filters {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 14px; margin-bottom: 14px;
  background: var(--filter-bg); border: 1px solid var(--filter-line); border-radius: var(--radius);
}
.filters .search { flex: 1 1 200px; max-width: 300px; }
.filters .check { color: var(--ink); }
.filters .filter-break { flex-basis: 100%; height: 0; }
/* RFP 관리: 연차 관리 버튼 묶음 (연차 선택 옆) */
.filters .year-acts { display: inline-flex; flex-wrap: wrap; gap: 6px; padding-left: 10px; border-left: 1px solid var(--filter-line); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 16px; margin-right: 4px; }
.panel-head .spacer { flex: 1; }
.panel > .tbl-wrap, .panel #table-area > .tbl-wrap { border: 0; border-radius: 0; }
.panel .empty { padding: 32px 16px; }
.h-sub { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 6px; }
.warn-text { margin: 0 0 12px; font-size: 14px; color: var(--warn-ink); background: var(--warn-wash); padding: 8px 10px; border-radius: 8px; }
.muted-cell { color: var(--muted); }
.case-title { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
.brand-full { margin: -12px 0 6px; font-size: 13px; color: var(--ink-2); letter-spacing: .01em; }
.view-head h1 { font-size: 22px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.toolbar .search { flex: 1 1 220px; max-width: 320px; }
.toolbar .spacer { flex: 1; }
.count { color: var(--muted); font-size: 14px; white-space: nowrap; }
.inline-num { width: 52px; height: 28px; padding: 0 6px; text-align: right; }

/* 표 */
.tbl-wrap { overflow: auto; max-height: calc(100vh - 230px); min-height: 160px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
/* 머리글은 칸마다가 아니라 머리글 전체(thead)를 한 덩어리로 위에 고정: 두 줄 머리글(칸 합치기)도 스크롤할 때 윗줄이 가려지지 않음 */
.tbl thead { position: sticky; top: 0; z-index: 3; }
.tbl th {
  background: var(--surface-2); color: var(--ink-2); font-weight: 600;
  text-align: center; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.th-sort {
  display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 0; margin: 0;
  font: inherit; font-weight: 600; color: inherit; cursor: pointer; white-space: nowrap; border-radius: 4px;
}
.th-sort:hover { color: var(--ink); }
.th-sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sort-ind { display: inline-flex; flex-direction: column; justify-content: center; font-size: 10px; line-height: 9px; color: var(--muted); }
.sort-ind i { font-style: normal; opacity: .45; }
.th-sort:hover .sort-ind i { opacity: .8; }
.th-sort.asc .up, .th-sort.desc .dn { color: var(--accent); opacity: 1; }
.th-sort.asc .dn, .th-sort.desc .up { opacity: .25; }
.th-sort.asc, .th-sort.desc { color: var(--ink); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
.tbl td.wrap { white-space: pre-line; min-width: 280px; max-width: 520px; word-break: keep-all; overflow-wrap: anywhere; }
.tbl td.note { white-space: normal; min-width: 120px; max-width: 240px; color: var(--ink-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.alt td { background: var(--surface-2); }
.tbl tbody tr:hover td { background: var(--accent-wash); }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.picked td { background: var(--accent-wash); }
/* 버튼 열은 표를 옆으로 넘겨도 오른쪽에 고정 */
.tbl th.num { text-align: center; }
/* 관리(버튼) 열: 데이터와 구분되게 오른쪽에 고정하고 배경색을 다르게 */
.tbl tr td.sticky-act, .tbl tr th.sticky-act, .tbl tr td.act-col, .tbl tr th.act-col { position: sticky; right: 0; background: var(--act-bg); box-shadow: -1px 0 0 var(--line-strong); }
.tbl th.sticky-act, .tbl th.act-col { background: var(--act-head); color: var(--ink); z-index: 2; }
.tbl tbody tr:hover td.sticky-act, .tbl tbody tr:hover td.act-col { background: var(--act-bg); }
.tbl td.act-col .actions, .tbl td.sticky-act .actions { justify-content: center; }
/* 접수번호별 모아보기 */
.tbl th.tg, .tbl td.tg { width: 52px; min-width: 52px; padding-right: 0; white-space: nowrap; }
.tbl tr.has-rest { cursor: pointer; }
.tg-btn {
  display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; vertical-align: middle;
  border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink-2);
  font-size: 14px; line-height: 1; cursor: pointer; transition: transform .15s;
}
.tg-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
.tg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tbl tr.open .tg-btn { transform: rotate(90deg); border-color: var(--accent); color: var(--accent-strong); }
.tg-count { font-size: 12px; color: var(--muted); margin-left: 5px; font-variant-numeric: tabular-nums; vertical-align: middle; }
/* 펼친 안건: 위아래 줄을 한 덩어리로 (왼쪽 파란 선 + 연한 파란 배경 + 끝에 굵은 구분선) */
.tbl tr.child td { background: var(--open-bg); color: var(--ink-2); font-size: 13.5px; }
.tbl tr.child td.tg { text-align: right; padding-right: 6px; }
.tbl tr.grp.open.has-rest td, .tbl tr.grp.open td { background: var(--open-bg); }
.tbl tr.grp.open td:first-child, .tbl tr.child td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tbl tr.child.child-last td { border-bottom: 2px solid var(--line-strong); }
.tbl tbody tr.child:hover td { background: var(--accent-wash); }
.tg-line { color: var(--muted); }
/* 같은 단계 쌓기: 최신 줄의 ‘이전 n’ 단추는 카드가 겹쳐 쌓인 모양, 펼친 이전 줄은 한 단 들여서 흐리게 */
.tbl td.stage-cell { white-space: nowrap; }
.stack-btn { display: inline-flex; align-items: center; margin: 0 6px 0 6px; padding: 0 7px; border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12px; line-height: 18px; cursor: pointer; vertical-align: middle;
  box-shadow: 2px 2px 0 -1px var(--surface), 2px 2px 0 0 var(--line-strong), 4px 4px 0 -1px var(--surface), 4px 4px 0 0 var(--line-strong); }
.stack-btn:hover, .stack-btn.on { border-color: var(--accent); color: var(--accent-strong); }
.stack-btn.on { box-shadow: none; background: var(--accent-wash); }
.stack-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tbl tr.stack-back td { background: var(--surface-2); color: var(--ink-2); font-size: 13.5px; }
.tbl tr.stack-back td.stage-cell { padding-left: 14px; }
.stack-mark { color: var(--muted); margin-right: 4px; }
.tbl tr.grp.open td { border-bottom-color: var(--line); }
.head-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.tbl tr.dim td { color: var(--muted); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .date { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.tbl .actions { display: flex; gap: 4px; }
.receipt-link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent-strong); font-weight: 600; font-variant-numeric: tabular-nums; text-decoration: underline; text-decoration-color: transparent; }
.receipt-link:hover { text-decoration-color: currentColor; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* 단계·상태 표시 */
.stage { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.stage i { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--sN); }
.stage.s1 i { background: var(--s1); } .stage.s2 i { background: var(--s2); } .stage.s3 i { background: var(--s3); }
.stage.s4 i { background: var(--s4); } .stage.s5 i { background: var(--s5); }
.st { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.st-run { background: var(--accent-wash); color: var(--accent-strong); }
.st-done { background: var(--good-wash); color: var(--good-ink); }
.st-wait { background: var(--idle-wash); color: var(--idle-ink); }
.st-hold { background: var(--warn-wash); color: var(--warn-ink); }
.st-final { background: var(--final-bg); color: var(--final-ink); }
.st-bad { background: var(--danger-wash); color: var(--danger); } /* 문제발생·지연 */
.st-ax { background: var(--k-meet-w); color: var(--k-meet-t); } /* 메일 송부 현황: AX팀(PEO) 쪽에서 확인 중 */

/* 메일 송부 현황 */
.ml-tbl th.ml-grp { background: var(--surface-3); color: var(--ink); text-align: center; }
.ml-tbl td { vertical-align: top; }
.ml-tbl td.ml-title { min-width: 200px; max-width: 320px; font-weight: 600; }
.ml-tbl td.ml-body { min-width: 220px; max-width: 360px; color: var(--ink-2); }
.ml-tbl td.ml-ddc { white-space: nowrap; }
.ml-tbl td.ml-type { white-space: nowrap; }
.ml-tbl tr.ml-urgent td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
.ml-clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.st.ml-urg { min-width: 44px; justify-content: center; }
.tag.ml-dd { margin-right: 3px; }
.ml-urg-n { color: var(--danger); }
.ml-file { cursor: pointer; display: inline-flex; align-items: center; }
.ml-dd-pick { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; min-height: 36px; }
label.seg-btn { display: inline-flex; align-items: center; }
.ml-meta { margin: 4px 0 0; }
.ml-tbl td.ml-stc { min-width: 150px; white-space: nowrap; }
.ml-tbl tr.ml-log-row td { padding: 5px 10px 5px 24px; font-size: 13px; white-space: normal; }
.ml-tbl tr.ml-log-latest td { background: var(--accent-wash); color: var(--ink); }
.tag.ml-latest { background: var(--accent); color: #fff; border-color: var(--accent); margin-right: 8px; font-weight: 700; }
.ml-log-when { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
.ml-log-who { margin-right: 8px; }
.ml-log-memo { margin-left: 8px; color: var(--ink-2); }
.ml-hist { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }
.ml-hist-front { padding: 4px 0; font-size: 13.5px; }
.ml-hist-back { margin-top: 6px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.ml-hist-item { padding: 4px 0 4px 6px; border-top: 1px dashed var(--line); }
.ml-hist .stack-btn { margin: 2px 0 0; justify-self: start; width: auto; }
.ml-ro { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: inherit; }
.ml-status-now { min-height: 36px; display: flex; align-items: center; }
.ml-step-now { margin: 0 0 4px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.ml-tbl td.sticky-act .btn { white-space: nowrap; }

/* 유지보수 > 이력 (PEO 전용, 월간보고용): 제목 옆 작은 캡슐, 엑셀 양식과 같은 두 줄 머리글, 사업 이름 줄로 묶음 */
.title-pill { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; margin-left: 8px; border-radius: 999px; background: var(--accent-wash); color: var(--accent-strong); border: 1px solid var(--accent); font-size: 12px; font-weight: 700; vertical-align: middle; letter-spacing: 0; }
.mh-tbl th.ml-grp { background: var(--surface-3); color: var(--ink); text-align: center; }
.mh-tbl td { vertical-align: top; }
.mh-tbl td.mh-content { min-width: 240px; max-width: 420px; font-weight: 600; }
.mh-tbl td.mh-result { min-width: 220px; max-width: 420px; color: var(--ink-2); }
.mh-tbl tr.mh-grp td { background: var(--surface-2); font-weight: 700; border-top: 2px solid var(--line-strong); }
/* 사업 묶음 줄은 스크롤해도 머리글 바로 아래에 붙어 있음 (지금 보는 줄이 어느 사업인지 늘 보이게). --head-h는 화면이 머리글 높이를 재서 넣음 */
.mh-tbl tr.mh-grp td, .rp-tbl tr.rp-grp td, .oc-tbl tr.rp-grp td { position: sticky; top: var(--head-h, 38px); z-index: 2; box-shadow: 0 1px 0 var(--line-strong); }
.mh-tbl .mh-grp-name { font-size: 15px; color: var(--ink); }
.st.mh-cat { min-width: 52px; justify-content: center; }
.biz-mview { margin-left: 4px; }

/* 켜고 끄는 버튼 묶음 (일간/주간, 보고서/표 등) */
.seg-btn { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-2); font-weight: 600; cursor: pointer; }
.seg-btn:hover { background: var(--surface-2); }
.seg-btn.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-strong); }

/* 업무보고 */
.rp-filters { gap: 10px 14px; }
.rp-datenav { display: inline-flex; align-items: center; gap: 4px; }
.rp-datenav .inp { width: 150px; }
.rp-scope { font-size: 15px; color: var(--ink); }
.rp-grid { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1.1fr) minmax(320px, 1.1fr); gap: 14px; align-items: start; }
.rp-grid .panel { margin-bottom: 0; }
/* 업무보고 > 팀 업무: PI·PEO·PM은 왼쪽 추가 칸 + 오른쪽 사업별 표, 연구자는 표만 */
.rp-team-grid { display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
.rp-team-grid .panel { margin-bottom: 0; min-width: 0; }
.tag.rp-week-tag { background: var(--accent-wash); color: var(--accent-strong); border-color: var(--accent); font-weight: 700; height: 32px; padding: 0 14px; display: inline-flex; align-items: center; }
/* 팀 업무 수정 기록 스택 (진행상태 옆 ‘기록 n’, 아래 줄에 최신부터) */
.rp-tbl td.rp-st-cell { white-space: nowrap; }
.rp-tbl tr.rp-log-row td { padding: 5px 10px 5px 24px; font-size: 13px; white-space: normal; }
.rp-tbl tr.rp-log-latest td { background: var(--accent-wash); color: var(--ink); }
.rp-log-chg { color: var(--ink-2); }
.rp-log-acts { display: inline-flex; gap: 10px; margin-left: 12px; vertical-align: baseline; }
.rp-log-acts .link { font-size: 12.5px; padding: 0; }
.link.danger { color: var(--danger); }
.rp-log-edited { margin-left: 6px; font-size: 12px; }
.rp-pad { padding: 14px; }
.rp-form-box { gap: 12px; }
.rp-st { gap: 4px; }
.rp-st .seg-opt span { padding: 0 9px; }
.rp-prog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.rp-prog input[type=range] { flex: 1 1 120px; accent-color: var(--accent); }
.rp-prog .inp.num { width: 70px; }
.rp-quick { display: inline-flex; gap: 4px; }
.rp-quick .btn { min-width: 38px; padding: 0 6px; }
.rp-cards { display: grid; gap: 14px; align-content: start; max-height: calc(100vh - 260px); overflow: auto; }
.rp-pgroup { display: grid; gap: 6px; }
.rp-pgroup-h { display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 0 2px 4px; border-bottom: 1px solid var(--line); }
.rp-pgroup-h .count { margin-left: 0; }
.rp-card { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.rp-card.linked { border-left-color: var(--k-meet); background: var(--surface-2); }
.rp-card.from-week { border-left-color: var(--accent-strong); border-left-style: double; border-left-width: 5px; } /* 주간 업무를 완료하며 일간에 넣은 것 */
.rp-card.clickable { cursor: pointer; }
.rp-card.clickable:hover { background: var(--accent-wash); }
.rp-card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
/* 카드 오른쪽 위 모서리 × (삭제 / 연동은 업무보고에서만 빼기) */
.rp-card.has-x { position: relative; }
.rp-card.has-x .rp-card-h { padding-right: 24px; }
.rp-card-x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); font-size: 18px; line-height: 20px; cursor: pointer; }
.rp-card-x:hover, .rp-card-x:focus-visible { color: var(--danger); background: var(--danger-wash); border-color: var(--danger-line); }
.rp-card-b { margin: 6px 0; white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; }
.rp-card-f { display: flex; align-items: center; gap: 6px; }
.rp-dl { font-size: 13px; color: var(--ink-2); }
.rp-nt { color: var(--ink-2); font-size: 13px; }
.rp-link { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--k-meet-w); color: var(--k-meet-t); border: 1px solid var(--k-meet-b); white-space: nowrap; }
/* 업무 기록: 붙여넣기 (저장하면 바로 나눠 저장) */
.rp-paste textarea { width: 100%; min-height: 190px; font-size: 14px; line-height: 1.7; resize: vertical; }
.rp-paste-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.rp-carried { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--warn-wash); color: var(--warn-ink); border: 1px solid var(--warn-mark); white-space: nowrap; }
/* 주간 업무 완료 → 일간 이행내용에 넣은 날 / 넣지 않음 */
.rp-daily-tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--accent-wash); color: var(--accent-strong); border: 1px solid var(--accent); white-space: nowrap; }
.rp-daily-tag.off { background: var(--surface-3); color: var(--muted); border-color: var(--line); }
.rp-daily-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.rp-daily-row .inp[type=date] { width: 160px; }
.rp-done-tbl td { vertical-align: middle; }
.rp-done-tbl td.nowrap { white-space: nowrap; }
.rp-done-tbl .inp[type=date] { width: 150px; }
/* 일일 업무보고 → 구글 시트 반영 상태 (머리 아래 얇은 줄) */
.rp-sheet-bar { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.rp-sheet-bar .btn { margin-left: auto; }
.rp-sheet { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-sheet.ok { color: var(--good-ink); }
.rp-sheet.bad { color: var(--danger); }
/* 주간: 지난 4주 안 끝난 업무 */
.rp-carry { margin-bottom: 14px; border-color: var(--warn-mark); }
.rp-carry .panel-head .hint { font-size: 12.5px; }
.rp-carry-list { display: grid; gap: 4px; }
.rp-carry-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.rp-carry-row:hover { background: var(--accent-wash); }
.rp-carry-row input { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.rp-carry-wk { flex: none; width: 58px; font-size: 12px; color: var(--muted); }
.rp-carry-tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-carry-row .st, .rp-carry-row .rp-bar, .rp-carry-row .rp-pct { flex: none; }
.rp-edited { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--k-present-w); color: var(--k-present-t); border: 1px solid var(--k-present-b); white-space: nowrap; }
.rp-orig { margin: 12px 0 14px; padding: 10px 12px; border: 1px dashed var(--line-strong); border-radius: 8px; font-size: 14px; color: var(--ink-2); }
.rp-orig .lbl { display: block; font-size: 12px; margin-bottom: 2px; }
.rp-hidden-list { display: grid; gap: 8px; margin-top: 12px; }
.rp-hidden-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.rp-hidden-txt { flex: 1; min-width: 0; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-late { color: var(--danger); font-weight: 700; }
.rp-bar { display: inline-block; width: 70px; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; vertical-align: middle; }
.rp-bar i { display: block; height: 100%; background: var(--accent); }
.rp-pct { margin-left: 6px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.rp-prog-cell { white-space: nowrap; }
.rp-rep { font-size: 14px; line-height: 1.6; }
.rp-rep-h { font-weight: 700; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.rp-sub { margin-top: 8px; font-weight: 700; color: var(--accent-strong); font-size: 13px; }
.rp-proj { margin-top: 4px; font-weight: 700; }
.rp-line { padding-left: 4px; white-space: pre-line; overflow-wrap: anywhere; }
.rp-none { color: var(--muted); padding-left: 4px; }
.rp-missing { font-size: 13px; color: var(--warn-ink); background: var(--warn-wash); padding: 2px 8px; border-radius: 6px; }
.rp-board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.rp-board-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.rp-board-card.rp-idle { border-style: dashed; background: var(--surface-2); color: var(--ink-2); }
.rp-tbl tr.rp-grp td, .oc-tbl tr.rp-grp td { background: var(--surface-2); font-weight: 700; border-top: 2px solid var(--line-strong); }
/* 사업 묶음 줄: 사업 이름을 크게, 그 아래 줄들은 사업 칸 없이 */
.rp-tbl .rp-grp-name { font-size: 15px; color: var(--ink); }
.rp-tbl td.rp-who { white-space: nowrap; color: var(--ink-2); }
.rp-tbl tr.clickable, .oc-tbl tr.clickable { cursor: pointer; }
.rp-tbl tr.clickable:hover td, .oc-tbl tr.clickable:hover td { background: var(--accent-wash); }
@media (max-width: 1100px) { .rp-grid, .rp-team-grid { grid-template-columns: 1fr; } .rp-cards { max-height: none; } }

/* 성과관리 */
.form-grid.four { grid-template-columns: repeat(4, 1fr); }
.oc-unit { margin-left: 2px; font-size: 12px; color: var(--muted); }
.oc-bar.full i { background: var(--good-ink); }
.btn.final { background: var(--final-bg); border-color: var(--final-bg); color: var(--final-ink); }
.btn.final:hover { filter: brightness(1.1); background: var(--final-bg); }
.btn.sm.final { font-weight: 600; }
.late { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 7px; margin-left: 4px; border-radius: 11px; font-size: 13px; font-weight: 600; background: var(--danger-wash); color: var(--danger); white-space: nowrap; }
.pg { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.pg-bar { width: 44px; height: 6px; border-radius: 3px; background: var(--accent-wash); overflow: hidden; }
.pg-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--surface-3); color: var(--ink-2); font-size: 13px; margin: 1px 2px 1px 0; white-space: nowrap; }
/* 과제 관리 > 연구사업: 주관부처(부처마다 색) · 계약형태(테두리) */
.tag.mi { font-weight: 600; }
.tag.mi-1 { background: var(--mi1-w); color: var(--mi1-t); }
.tag.mi-2 { background: var(--mi2-w); color: var(--mi2-t); }
.tag.mi-3 { background: var(--mi3-w); color: var(--mi3-t); }
/* 구분 칩 (연구사업 종류마다 색 + 테두리) */
.tag.cat { font-weight: 600; border: 1px solid transparent; padding: 0 7px; }
.tag.cat-0 { background: var(--surface-3); color: var(--ink-2); border-color: var(--line-strong); }
.tag.cat-1 { background: var(--k-report-w); color: var(--k-report-t); border-color: var(--k-report-b); }
.tag.cat-2 { background: var(--k-meet-w); color: var(--k-meet-t); border-color: var(--k-meet-b); }
.tag.cat-3 { background: var(--k-present-w); color: var(--k-present-t); border-color: var(--k-present-b); }
.tag.cat-4 { background: var(--c4-w); color: var(--c4-t); border-color: var(--c4-b); }
.tag.cat-m { background: var(--warn-wash); color: var(--warn-ink); border-color: var(--warn-mark); }
/* 과제 관리 > 사용자: 줄을 누르면 상세 */
.tbl.us-tbl tr.clickable:hover td { background: var(--accent-wash); }
.tbl.us-tbl tr.clickable:hover .pj-name { text-decoration: underline; text-underline-offset: 2px; }
/* 업무보고 복사 표기 [약칭+직위 알파벳] */
.us-code { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); font-size: 12px; font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
.us-code-line { margin: -4px 0 0; font-size: 13px; color: var(--ink-2); }
.us-code-line b { font-family: ui-monospace, Consolas, monospace; color: var(--accent-strong); }
.tag.ct { background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); font-weight: 600; padding: 0 7px; }
.tbl.pj-tbl tr.clickable:hover td { background: var(--accent-wash); }
.pj-name { color: var(--accent-strong); }
.tbl.pj-tbl tr.clickable:hover .pj-name { text-decoration: underline; text-underline-offset: 2px; }
.filters .pj-q { flex: 1 1 220px; max-width: 280px; }
/* 과제 순서 바꾸기 손잡이 (끌기 · ↑↓) */
.tbl.pj-tbl .drag-col { width: 36px; padding: 0 0 0 6px; text-align: center; }
.drag-h { display: inline-grid; place-items: center; width: 26px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: grab; touch-action: none; }
.drag-h:hover:not(:disabled) { background: var(--surface-3); color: var(--ink); }
.drag-h:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.drag-h:disabled { opacity: .35; cursor: not-allowed; }
.tbl.pj-tbl tr.pj-dragging td { background: var(--accent-wash); box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
body.pj-drag-on, body.pj-drag-on * { cursor: grabbing !important; user-select: none; }
.kc-stack { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.kc-stack .tag { margin: 0; }
/* 긴 안내 글이 한 줄로 늘어나 창 밖으로 밀리지 않게 줄바꿈 허용 */
.pj-maint, .pj-hide { display: flex; flex-wrap: wrap; white-space: normal; min-width: 0; }
.pj-maint { margin-top: 8px; }
.pj-hide { padding: 10px 12px; border: 1px dashed var(--line-strong); border-radius: 8px; background: var(--surface-2); }
.pj-maint .hint, .pj-hide .hint { flex-basis: 100%; padding-left: 22px; }
.tag.pj-hidden-tag { background: var(--surface); border: 1px dashed var(--line-strong); color: var(--muted); font-size: 12px; padding: 0 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* 카드·현황판 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.card + .card { margin-top: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card-head h2 { font-size: 17px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.tile-label { color: var(--ink-2); font-size: 14px; font-weight: 600; }
.tile-value { font-size: 33px; font-weight: 700; margin-top: 4px; letter-spacing: -0.02em; }
.tile-value small { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.tile-foot { color: var(--muted); font-size: 13px; margin-top: 2px; }
.tile.alert .tile-value { color: var(--danger); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.dist { display: grid; grid-template-columns: minmax(90px, 160px) minmax(160px, 1fr) repeat(4, 76px); align-items: center; column-gap: 12px; }
.dist > div { padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.dist .dh { color: var(--muted); font-size: 13px; font-weight: 600; padding-top: 0; }
.dist .num { text-align: right; font-variant-numeric: tabular-nums; }
.dist .num.alert { color: var(--danger); font-weight: 700; }
.dist .pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { display: flex; align-items: center; gap: 8px; }
.bar { display: flex; gap: 2px; height: 20px; min-width: 0; }
.seg { height: 100%; min-width: 3px; cursor: default; }
.seg:last-child { border-radius: 0 4px 4px 0; }
.seg:hover { filter: brightness(1.08); }
.bar-total { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
#tip {
  position: fixed; z-index: 200; pointer-events: none; background: var(--ink); color: var(--surface);
  font-size: 13px; padding: 6px 9px; border-radius: 6px; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; white-space: nowrap;
}
#tip.on { opacity: 1; }

/* 관리 */
.subtabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-3); border-radius: 9px; margin-bottom: 16px; flex-wrap: wrap; }
.subtab { border: 0; background: none; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.subtab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: var(--radius); margin-bottom: 12px; background: var(--surface); }
.suggest-label { font-size: 14px; color: var(--ink-2); margin-right: 4px; }
.chip-btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 3px 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
.chip-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
.map-table { border-collapse: collapse; font-size: 14px; margin: 8px 0 4px; }
.map-table td { padding: 4px 12px 4px 0; vertical-align: top; }
.map-table td:first-child { color: var(--ink-2); }
.drop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: var(--surface-2); margin-top: 12px; }
.warn-list { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; max-height: 220px; overflow: auto; }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
.result { padding: 12px 14px; border-radius: 8px; background: var(--good-wash); color: var(--good-ink); margin-top: 12px; font-size: 14px; }

/* 로그인 */
.login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px 16px; }
.app-foot { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 16px 24px; letter-spacing: 0.01em; }
.login-wrap .app-foot { padding: 0; }
.login { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: var(--shadow); }
.login .brand { margin-bottom: 20px; font-size: 18px; }
.login h1 { font-size: 20px; margin-bottom: 4px; }
.login form { display: grid; gap: 12px; margin-top: 18px; }
.login .btn { height: 40px; }
.login .inp { height: 40px; width: 100%; }
.login .demo-note { margin-top: 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.err { color: var(--danger); font-size: 14px; min-height: 18px; }

/* 모달 */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15, 17, 22, .45); display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; }
.modal { width: 100%; max-width: 560px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.modal.wide { max-width: 760px; }
.modal.xwide { max-width: 1100px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 18px 20px; }
.modal-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
.modal-foot .left { margin-right: auto; color: var(--muted); font-size: 13px; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
body.modal-open { overflow: hidden; }
#confirm-root .overlay { z-index: 60; }
.form { display: grid; gap: 14px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld .inp { width: 100%; }
.lbl { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.lbl em { color: var(--danger); font-style: normal; }
.static { min-height: 36px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.seg-group { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-opt { position: relative; }
.seg-opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg-opt > span {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink-2);
}
.seg-opt input:checked + span { border-color: var(--accent); background: var(--accent-wash); color: var(--accent-strong); }
.seg-opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg-opt > span i { width: 9px; height: 9px; border-radius: 3px; }
.radio-line { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.radio-line label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.radio-line input { accent-color: var(--accent); margin: 0; }
.radio-line .receipt-new { width: 150px; height: 32px; padding: 0 8px; cursor: text; } /* 새 접수번호 (자동 번호, 고칠 수 있음) */
/* 참여자: PEO 주실무자·부실무자, PMO 참여자 */
.mem-grp { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 10px 2px 0; }
.mem-lbl { font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; line-height: 1.5; }
.mem-lbl.m-main { background: var(--accent); color: #fff; }
.mem-lbl.m-sub { background: var(--accent-wash); color: var(--accent-strong); }
.mem-lbl.m-other { background: var(--surface-3); color: var(--ink-2); }
.mem-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.mem-pick .mem-role { width: auto; height: 28px; padding: 0 26px 0 8px; font-size: 13px; }
.mem-role-text { font-size: 12px; color: var(--muted); }
.rv-members { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-left: 10px; vertical-align: middle; }
/* 주실무자 = 진한 파랑, 부실무자 = 연한 파랑 이름표 */
/* 주/부실무자 이름표: 클래스 이름을 rv-main/rv-sub로 (공통 .sub 글꼴·여백과 겹치면 줄 높이가 달라져서) */
.rv-mem { display: inline-block; margin: 0; padding: 0 8px; border: 1px solid transparent; border-radius: 10px; font-size: 12px; font-weight: 600; line-height: 18px; }
.rv-mem.rv-main { background: var(--accent); border-color: var(--accent); color: #fff; }
.rv-mem.rv-sub { background: var(--accent-wash); color: var(--accent-strong); border-color: var(--k-report-b); }
.rv-legend .rv-mem { margin-right: 2px; }
.progress-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.progress-row input[type=range] { flex: 1; max-width: 280px; accent-color: var(--accent); }
.progress-row .hint { white-space: nowrap; }
.fld .progress-row .inp.num { width: 80px; flex: none; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.check-grid .check { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
/* 과제 참여 팀원: 이름 + 주실무자/부실무자(또는 참여자)를 한 줄에 */
#member-grid .check-grid { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
#member-grid .mem-pick { flex-wrap: nowrap; }
#member-grid .mem-pick .check { flex: 1; min-width: 0; }
.callout { padding: 10px 12px; border-radius: 8px; background: var(--surface-3); color: var(--ink-2); font-size: 14px; }

/* 과제 구분 표시 */
.tag.kind-r { background: var(--accent-wash); color: var(--accent-strong); font-weight: 600; }
.tag.kind-m { background: var(--warn-wash); color: var(--warn-ink); font-weight: 600; }
.peo-tag { background: var(--good-wash); color: var(--good-ink); font-weight: 600; margin-left: 4px; }
.form-grid.three { grid-template-columns: repeat(3, 1fr); }
.info-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; margin: 0 0 14px; padding: 10px 14px; font-size: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.info-line .pi-bits { font-size: 14px; color: var(--ink); }
.info-line .pi-bits i { font-style: normal; color: var(--line-strong); margin: 0 6px; }
.info-line .pi-full { font-weight: 600; }
.stat-chips { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; flex-wrap: wrap; }
.stat-chips b { font-size: 14px; margin-right: 6px; font-variant-numeric: tabular-nums; }
.cnt-note { font-size: 13px; color: var(--ink-2); }
.sc-period { font-size: 12.5px; color: var(--ink-2); }
.sc-mem { display: grid; gap: 2px; margin-top: 4px; font-size: 12.5px; color: var(--ink); }
.sc-mg { display: flex; align-items: baseline; gap: 4px; line-height: 1.4; word-break: keep-all; }
.sc-mg .mem-lbl { font-size: 11px; padding: 0 5px; flex: none; }
.src-tag { background: var(--surface-3); color: var(--ink-2); font-weight: 600; }
.peo-link { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--good-wash); color: var(--good-ink); font-size: 14px; }
.tbl tr.grp.focus td { box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }

/* 연간 계획표 (전체 진행현황 > 사업) */
/* 화면 높이 안에서 스크롤 → 월 머리글(두 줄)이 늘 위에 보임 */
.plan-wrap { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 8px; }
/* 월 칸 너비를 고정: 일정 글자가 길면 칸이 넓어지지 않고 칸 안에서 줄이 바뀜 */
.plan { border-collapse: separate; border-spacing: 0; font-size: 13px; table-layout: fixed; width: 100%; min-width: 1200px; }
.plan col.c-sc { width: 70px; }
.plan col.c-sc2 { width: 160px; }
.plan th, .plan td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.plan thead { position: sticky; top: 0; z-index: 4; } /* 연도 줄 + 월 줄을 한 덩어리로 고정 */
.plan th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; padding: 6px 4px; text-align: center; white-space: nowrap; }
.plan th.mh { min-width: 66px; }
.plan th.nexty { background: var(--surface-3); }
.plan td.nexty { background: var(--surface-2); }
.plan td { padding: 4px; vertical-align: top; background: var(--surface); }
.plan td.sc, .plan th.sc { position: sticky; left: 0; z-index: 2; min-width: 70px; width: 70px; text-align: center; }
.plan td.sc2, .plan th.sc2 { position: sticky; left: 70px; z-index: 2; min-width: 120px; text-align: left; box-shadow: 1px 0 0 var(--line-strong); padding: 6px 8px; }
.plan thead th.sc, .plan thead th.sc2 { z-index: 3; }
.plan td.sc, .plan td.sc2 { background: var(--surface); }
.plan td.mc { height: 46px; }
.plan td.mc.in { background: var(--accent-wash); }
/* 이번 달: 그 달 열 오른쪽 끝에 빨간 세로선 (머리글부터 맨 아래까지, 날짜와 상관없이 고정) + 머리글 빨간 배지 */
.plan th.mh.now, .rv-gantt th.now,
.plan td.mc.now, .rv-gantt td.rv-m.now { box-shadow: inset -2px 0 0 var(--today); }
.now-pill { display: inline-block; min-width: 24px; padding: 0 7px; border-radius: 10px; background: var(--today); color: #fff; font-weight: 700; line-height: 18px; }
.rv-gantt .now-pill { min-width: 0; padding: 0 5px; }
.legend .today-key { display: inline-flex; align-items: center; gap: 5px; }
.legend .today-key i { display: inline-block; width: 2px; height: 14px; border-radius: 1px; background: var(--today); }
.plan td.mc.edit { cursor: pointer; }
.plan td.mc.edit:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
/* 일정 도형: 종류별 연한 바탕 + 진한 글씨 */
.ms { display: block; padding: 2px 6px; margin-bottom: 2px; border-radius: 5px; background: var(--kw, var(--surface)); border: 1px solid var(--kb, var(--line)); color: var(--kt, var(--ink)); font-size: 12.5px; font-weight: 600; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.k-report { --kc: var(--k-report); --kw: var(--k-report-w); --kb: var(--k-report-b); --kt: var(--k-report-t); }
.k-present { --kc: var(--k-present); --kw: var(--k-present-w); --kb: var(--k-present-b); --kt: var(--k-present-t); }
.k-meet { --kc: var(--k-meet); --kw: var(--k-meet-w); --kb: var(--k-meet-b); --kt: var(--k-meet-t); }
.k-etc { --kc: var(--k-etc); --kw: var(--k-etc-w); --kb: var(--k-etc-b); --kt: var(--k-etc-t); }
.ms-legend { margin: 0; gap: 6px; }
.ms-legend .ms { display: inline-block; margin: 0; padding: 1px 8px; }
.ms-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--kc); flex: none; }
.ms-row .ms-kind { width: 92px; flex: none; }
.ms-list { display: grid; gap: 6px; margin-bottom: 12px; }
.ms-row { display: flex; gap: 6px; align-items: center; }
.ms-row .inp { flex: 1; min-width: 0; }

/* 과제별 RFP: 전체 RFP 현황(.rv-gantt)과 같은 모양 + 성과물·작업·관리 칸 */
.rv-gantt.rp { min-width: 960px; }
.rv-gantt.rp col.c-code { width: 56px; }
.rv-gantt.rp col.c-out { width: 260px; }
.rv-gantt.rp col.c-cnt { width: 44px; }
.rv-gantt.rp td { height: 32px; vertical-align: middle; }
.rv-gantt.rp th:not(:first-child), .rv-gantt.rp td:not(:first-child) { border-left: 1px solid var(--line); } /* 열마다 세로 구분선 */
.rv-gantt.rp td.rv-title { left: 56px; }
.rv-gantt.rp td.rp-out { padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.rv-gantt.rp td.rp-cnt { text-align: center; }
.rv-gantt.rp tr.rp-lv1 td { border-top: 2px solid var(--line-strong); }
.rv-gantt.rp tr.rp-lv1 td:not(.rv-m) { background: var(--surface-2); font-weight: 700; }
.rv-gantt.rp tr.rp-lv2 td:not(.rv-m) { font-weight: 600; }
.rv-gantt.rp tr.rp-lv2 td.rv-title { padding-left: 20px; }
.rv-gantt.rp tr.rp-lv3 td.rv-title { padding-left: 32px; }
/* RFP 묶음 색: 번호 칸 왼쪽 띠 + 월 칸 (연구 방법 = 진한 색, 상위 항목 = 연한 색) */
.rv-gantt.rp tr.rg1 { --gc: var(--rg1); --gw: var(--rg1-w); }
.rv-gantt.rp tr.rg2 { --gc: var(--rg2); --gw: var(--rg2-w); }
.rv-gantt.rp tr.rg3 { --gc: var(--rg3); --gw: var(--rg3-w); }
.rv-gantt.rp tr.rg4 { --gc: var(--rg4); --gw: var(--rg4-w); }
.rv-gantt.rp tr.rg5 { --gc: var(--rg5); --gw: var(--rg5-w); }

@media (max-width: 900px) {

}

  var ROLES = ['PI', 'PM', '연구자', '개발자'];

        ['alias', '약칭']]          // 업무보고 복사에 쓰는 짧은 이름 (예: 송하나 → 1, 표수진 → 표). 비우면 이름 그대로
    },
    projects: {
      sheet: '사업', key: 'name', // 화면에서는 '과제'

        ['no', '번호'], ['fullName', '과제명'], ['ministry', '부처'], ['field', '분야'], ['leader', '연구책임자'],
