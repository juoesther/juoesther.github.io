  }

  /* ---------- 진행 기록 작성/수정 ---------- */
  function openRecordModal(o) {
    o = o || {};
    var r = o.record || null;
    var editing = !!r;
    // 다음 단계: 같은 안건에 이어 쓰므로 과제·접수번호는 고르지 않음
    // 담당은 어떤 기록에서도 고르지 않음: 새 기록은 작성자 이름으로 자동 저장, 수정할 때는 그대로
    var next = !editing && !!o.next && !!o.receiptNo;
    var projects = maintProjects();
    var project = editing ? r.project : (o.project || (S.f.project && memberOf(S.f.project) ? S.f.project : (projects[0] || {}).name));
    var stage = editing ? r.stage : (o.stage || '1');
    historyOpen = null;
    var REQ = ' <em title="필수">*</em>';
    var body = '<form class="form" id="rec-form" autocomplete="off" novalidate>' +
      '<p class="hint" style="margin:0"><em style="color:var(--danger);font-style:normal">*</em> 표시는 꼭 입력해야 하는 항목이에요.</p>' +
      '<div class="form-grid"><div class="fld"><span class="lbl">' + (next ? '안건' : '과제' + REQ) + '</span>' +
      (editing ? '<div class="static">' + esc(r.project) + '</div>' :
        next ? '<div class="static"><b class="mono">' + esc(o.receiptNo) + '</b> · ' + esc(project) + '</div>' :
        '<select class="inp" name="project">' + options(myProjectNames(), project) + '</select>') + '</div>' +
      // 작성일: 기본은 오늘, 바꿀 수 있음 (오늘 이후는 안 됨)
      '<label class="fld"><span class="lbl">작성일' + REQ + '</span><input type="date" class="inp" name="date" max="' + today() + '" value="' + esc(editing ? r.date : today()) + '"></label></div>' +
      '<div class="fld"><span class="lbl">단계' + REQ + '</span>' + (editing ? '<div class="static">' + stageChip(r.stage) + '</div>' :
        '<div class="seg-group" role="radiogroup" aria-label="단계">' + L.STAGES.map(function (s) {
          return '<label class="seg-opt"><input type="radio" name="stage" value="' + s.code + '"' + (s.code === stage ? ' checked' : '') + '><span><i style="background:var(--' + stageCls(s.code) + ')"></i>' + esc(s.label) + '</span></label>';
        }).join('') + '</div>') + '</div>' +
      (next ? '' : '<div class="fld" id="receipt-fld">' + (editing ? '<span class="lbl">접수번호' + REQ + '</span><div class="static mono">' + esc(r.receiptNo) + '</div>' : '') + '</div>') +
      '<label class="fld"><span class="lbl">업무 내용' + REQ + '</span><textarea class="inp" name="content" rows="3" placeholder="예: [메뉴명] 처리한 내용">' + esc(editing ? r.content : (o.content || '')) + '</textarea></label>' +
      '<div class="fld"><span class="lbl">상태' + REQ + '</span><div class="seg-group" role="radiogroup" aria-label="상태">' + L.STATUSES.map(function (st) {
        var cur = editing ? r.status : '진행중';
        return '<label class="seg-opt"><input type="radio" name="status" value="' + st + '"' + (st === cur ? ' checked' : '') + '><span>' + statusIcon(st) + esc(st) + '</span></label>';
      }).join('') + '</div>' +
      '<div class="progress-row" id="progress-row"><span class="hint">진도율</span><input type="range" min="0" max="100" step="5" name="progressRange" aria-label="진도율"><input type="number" class="inp num" min="0" max="100" name="progress" aria-label="진도율 숫자"><span>%</span></div></div>' +
      '<div class="form-grid"><label class="fld"><span class="lbl">완료예정일</span><input type="date" class="inp" name="dueDate" value="' + esc(editing ? r.dueDate : '') + '"></label>' +
      '<label class="fld"><span class="lbl">완료일</span><input type="date" class="inp" name="doneDate" value="' + esc(editing ? r.doneDate : '') + '"></label></div>' +
      '<div class="form-grid" id="request-fld"><label class="fld"><span class="lbl">요청자<span id="requester-mark"></span></span><input class="inp" name="requester" placeholder="예: 김남숙 주무관" value="' + esc(editing ? r.requester : '') + '"></label>' +
      '<label class="fld"><span class="lbl">요청마감일 <span class="hint">있을 때만</span></span><input type="date" class="inp" name="requestDeadline" value="' + esc(editing ? r.requestDeadline : '') + '"></label></div>' +
      '<label class="fld"><span class="lbl">비고</span><input class="inp" name="note" value="' + esc(editing ? r.note : '') + '"></label>' +
      '</form>';
    var m = openModal({
      title: editing ? '진행 기록 수정' : next ? '다음 단계 기록' : '새 진행 기록', size: 'wide', body: body,
      footer: '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="rec-save">저장</button>'
    });
    var form = $('#rec-form', m);
    var startProgress = editing && r.status === '진행중' ? (+r.progress || 0) : 0;
    form.progress.value = startProgress;
    form.progressRange.value = startProgress;
    var doneAuto = false;
    // 새 접수번호: 작성일 기준 자동 번호를 넣어 두고, 직접 고치면 그 번호를 씀
    var receiptEdited = false, receiptTyped = '';

    function dateValue() { return form.date.value || today(); }
    function autoReceiptNo() { return L.nextReceiptNo(S.data.records, currentProject(), dateValue()); }
    function currentProject() { return editing ? r.project : next ? project : form.project.value; }
    function currentStage() { if (editing) return r.stage; var c = form.querySelector('input[name=stage]:checked'); return c ? c.value : '1'; }
    function currentStatus() { var c = form.querySelector('input[name=status]:checked'); return c ? c.value : '진행중'; }
    function renderReceipt() {
      if (editing || next) return;
      var fld = $('#receipt-fld', m);
      var stg = currentStage(), proj = currentProject();
      var canNew = L.NEW_RECEIPT_STAGES.indexOf(stg) >= 0;
      var list = L.summarize(S.data.records.filter(function (x) { return x.project === proj; }), today(), 0).sort(sortByReceiptDesc);
      var prev = form.receiptNo ? form.receiptNo.value : (o.receiptNo || '');
      var prevMode = form.querySelector('input[name=receiptMode]:checked');
      var mode = canNew ? (prevMode ? prevMode.value : (o.receiptNo ? 'existing' : 'new')) : 'existing';
      // 고르기 안내 항목 없이 최근 안건이 먼저 골라져 있음 (목록에는 실제 접수번호만)
      var sel = '<select class="inp" name="receiptNo"' + (mode === 'new' ? ' hidden' : '') + '>' + options(list.map(function (s) {
        var t = s.title.length > 42 ? s.title.slice(0, 42) + '…' : s.title;
        return [s.receiptNo, s.receiptNo + ' · ' + t + ' (현재 ' + stageText(s.record.stage) + ')'];
      }), prev) + '</select>';
      var html = '<span class="lbl">접수번호' + REQ + '</span>';
      if (canNew) {
        html += '<div class="radio-line"><label class="receipt-new-opt"><input type="radio" name="receiptMode" value="new"' + (mode === 'new' ? ' checked' : '') + '> 새 접수번호 ' +
          '<input class="inp mono receipt-new" name="receiptNew" maxlength="30" value="' + esc(receiptEdited ? receiptTyped : autoReceiptNo()) + '" aria-label="새 접수번호 (자동으로 매긴 번호, 고칠 수 있음)"></label>' +
          '<label><input type="radio" name="receiptMode" value="existing"' + (mode === 'existing' ? ' checked' : '') + (list.length ? '' : ' disabled') + '> 기존 접수번호에 추가</label></div>';
      }
      html += sel;
      if (!canNew && !list.length) html += '<div class="callout">이 사업에는 아직 접수된 안건이 없어요. 1단계(접수 및 분석 배정)로 먼저 접수해 주세요.</div>';
      fld.innerHTML = html;
    }
    // 요청자·요청마감일: 새 기록에서는 늘 보이고(1단계 필수), 다음 단계·수정에서는 1단계일 때만 보임
    function showRequest() { return !(editing || next) || currentStage() === '1'; }
    function syncVisibility() {
      var stg = currentStage(), st = currentStatus();
      // 요청자: 1단계는 필수, 2~5단계·비기능은 선택
      $('#requester-mark', m).innerHTML = stg === '1' ? REQ : ' <span class="hint">선택</span>';
      $('#request-fld', m).hidden = !showRequest();
      $('#progress-row', m).hidden = st !== '진행중';
    }
    // 기존 접수번호에 이어 쓸 때: 업무 내용이 비어 있거나 자동으로 넣은 안건 제목이면 고른 안건의 제목으로 (직접 쓴 내용은 그대로)
    var autoTitle = '';
    function fillFromReceipt() {
      if (editing || !form.receiptNo) return;
      var cur = form.content.value.trim();
      if (!existingMode() || !form.receiptNo.value) { // 새 접수번호로 바꾸면 자동으로 넣은 제목은 지움
        if (autoTitle && cur === autoTitle) { form.content.value = ''; autoTitle = ''; }
        return;
      }
      if (cur && cur !== autoTitle) return;
      var s = L.summarize(recordsOf(currentProject(), form.receiptNo.value), today(), 0)[0];
      if (s) { form.content.value = s.title; autoTitle = s.title; }
    }

    renderReceipt(); syncVisibility(); fillFromReceipt();

    function setStatus(st) {
      var el = form.querySelector('input[name=status][value="' + st + '"]');
      if (!el || el.checked) return;
      el.checked = true;
      if (st === '완료' && !form.doneDate.value) { form.doneDate.value = dateValue(); doneAuto = true; }
      syncVisibility();
    }
    function existingMode() { var c = form.querySelector('input[name=receiptMode]:checked'); return next || (c && c.value === 'existing') || L.NEW_RECEIPT_STAGES.indexOf(currentStage()) < 0; }
    form.addEventListener('change', function (e) {
      var n = e.target.name;
      if (n === 'project') { renderReceipt(); fillFromReceipt(); }
      if (n === 'stage') {
        renderReceipt(); syncVisibility(); fillFromReceipt();
        // 이미 있는 안건에 비기능을 이어 쓰면 그 안건은 끝(종결) → 상태를 완료로 미리 골라 둠 (바꿀 수 있음)
        if (currentStage() === '비기능' && existingMode()) setStatus('완료');
      }
      if (n === 'receiptMode') {
        form.receiptNo.hidden = e.target.value !== 'existing';
        if (e.target.value === 'existing') { form.receiptNo.focus(); if (currentStage() === '비기능') setStatus('완료'); }
        fillFromReceipt();
      }
      if (n === 'receiptNo') fillFromReceipt();
      if (n === 'date' && form.receiptNew && !receiptEdited) form.receiptNew.value = autoReceiptNo(); // 자동 번호는 작성일을 따라감
      if (n === 'status') {
        var st = currentStatus();
        if (st === '완료' && !form.doneDate.value) { form.doneDate.value = dateValue(); doneAuto = true; }
        if (st !== '완료' && doneAuto) { form.doneDate.value = ''; doneAuto = false; }
        syncVisibility();
      }
    });
    form.addEventListener('input', function (e) {
      if (e.target.name === 'progressRange') form.progress.value = e.target.value;
      if (e.target.name === 'progress') form.progressRange.value = e.target.value;
      if (e.target.name === 'doneDate') doneAuto = false;
      if (e.target.name === 'receiptNew') { // 번호를 고치면 ‘새 접수번호’로
        receiptTyped = e.target.value.trim();
        receiptEdited = !!receiptTyped && receiptTyped !== autoReceiptNo();
        var nr = form.querySelector('input[name=receiptMode][value=new]');
        if (nr && !nr.checked) { nr.checked = true; form.receiptNo.hidden = true; }
      }
    });
    form.addEventListener('submit', function (e) { e.preventDefault(); save(); });
    $('#rec-save', m).addEventListener('click', save);

    function save() {
      var content = form.content.value.trim();
      if (!content) { toast('업무 내용을 입력해 주세요.', 'error'); form.content.focus(); return; }
      var stg = currentStage();
      if (!form.date.value) { toast('작성일을 입력해 주세요.', 'error'); form.date.focus(); return; }
      if (form.date.value > today()) { toast('작성일은 오늘 이후로 정할 수 없어요.', 'error'); form.date.focus(); return; }
      var payload = {
        content: content, date: form.date.value,
        status: currentStatus(), progress: form.progress.value,
        dueDate: form.dueDate.value, doneDate: form.doneDate.value, note: form.note.value
      };
      // 담당은 보내지 않음 → 서버가 새 기록은 작성자를 담당으로 저장, 수정은 기존 담당 유지
      // 숨긴 요청자 항목은 보내지 않음 → 수정할 때 기존 값이 그대로 남음
      if (showRequest()) {
        payload.requester = form.requester.value;
        payload.requestDeadline = form.requestDeadline.value;
        if (stg === '1' && !payload.requester.trim()) { toast('1단계(접수 및 분석 배정)는 요청자를 입력해 주세요.', 'error'); form.requester.focus(); return; }
      }
      if (editing) {
        payload.id = r.id;
      } else if (next) {
        payload.project = project;
        payload.stage = stg;
        payload.receiptNo = o.receiptNo;
      } else {
        payload.project = currentProject();
        payload.stage = stg;
        var modeEl = form.querySelector('input[name=receiptMode]:checked');
        var useExisting = L.NEW_RECEIPT_STAGES.indexOf(stg) < 0 || (modeEl && modeEl.value === 'existing');
        if (useExisting) {
          if (!form.receiptNo.value) { toast('접수번호를 골라 주세요.', 'error'); form.receiptNo.focus(); return; }
          payload.receiptNo = form.receiptNo.value;
        } else {
          payload.newReceipt = true;
          // 고치지 않았으면 번호를 보내지 않음 → 서버가 저장할 때 작성일 기준으로 매김 (동시에 저장해도 겹치지 않게)
          if (receiptEdited) {
            var rn = receiptTyped;
            if (/[,，|]/.test(rn)) { toast('접수번호에는 쉼표(,)나 | 를 쓸 수 없어요.', 'error'); form.receiptNew.focus(); return; }
            if (S.data.records.some(function (x) { return x.project === payload.project && x.receiptNo === rn; })) {
              toast('이미 있는 접수번호(' + rn + ')예요. ‘기존 접수번호에 추가’를 고르거나 다른 번호를 적어 주세요.', 'error'); form.receiptNew.focus(); return;
            }
            payload.receiptNo = rn;
          }
        }
      }
      var btn = $('#rec-save', m);
      btn.disabled = true;
      call('saveRecord', payload).then(function (res) {
        closeModal();
        applyState(res);
        toast(editing ? '수정했어요.' : '저장했어요 · 접수번호 ' + res.info.receiptNo);
      }, function () { btn.disabled = false; });
    }
  }
  function statusIcon(st) { return '<span aria-hidden="true">' + (STATUS_ICON[st] || '') + '</span>'; }
  function nextStage(project, receiptNo) {
    var s = L.summarize(recordsOf(project, receiptNo), today(), 0)[0];
    var cur = s ? s.record.stage : '1';
    // 안건의 현재 단계 바로 다음 단계를 미리 골라 둠 (2단계 → 3단계). 5단계·비기능은 그대로
    var next = cur === '비기능' ? '비기능' : String(Math.min(5, (+cur || 1) + 1));
    openRecordModal({ next: true, project: project, stage: next, receiptNo: receiptNo, content: s ? s.title : '' });
  }
  function deleteRecord(id) {
    var r = S.data.records.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    confirmBox('<b>' + esc(r.receiptNo) + '</b> · ' + esc(stageText(r.stage)) + ' 기록을 삭제할까요?<br><span class="hint">' + esc(r.content.slice(0, 80)) + '</span><br>삭제하면 되돌릴 수 없어요.', '삭제', true)
      .then(function (ok) {
        if (!ok) return;
        call('deleteRecord', { id: id }).then(function (res) { applyState(res); toast('삭제했어요.'); }, noop);
      });

  /* ---------- 전체 진행현황 > 유지보수 (PM) ---------- */
  function viewDashboard(nav) {
    var t = today(), month = t.slice(0, 7), year = S.g.year;
    var allSums = summaries(0);
    var sums = year ? allSums.filter(function (s) { return s.year === year; }) : allSums; // 고른 접수 연도의 안건만
    var active = sums.filter(function (s) { return !s.finished; });
    var delayed = sums.filter(function (s) { return s.delayed; }).sort(function (a, b) { return b.delayDays - a.delayDays; });
    var finished = sums.filter(function (s) { return s.finished; });
    var doneMonth = finished.filter(function (s) { return s.finishedOn.slice(0, 7) === month; });
    var scope = year ? year + '년 접수' : '전체 연도';

    var tiles = '<div class="tiles">' +
      tile('접수 안건', sums.length, '건', scope) +
      tile('진행 중 안건', active.length, '건', '') +
      tile('지연 안건', delayed.length, '건', '', delayed.length > 0) +
      tile('완료 안건', finished.length, '건', '이번 달 ' + doneMonth.length + '건') + '</div>';

    // 연도별 현황 (항상 전체 연도 비교, 줄을 누르면 그 연도로 보기)
    var byYear = {};
    allSums.forEach(function (s) {
      var y = s.year || '미상';
      var o = byYear[y] || (byYear[y] = { year: y, total: 0, done: 0, active: 0, delayed: 0, records: 0 });
      o.total++; o.records += s.count;
      if (s.finished) o.done++; else o.active++;
      if (s.delayed) o.delayed++;
    });
    var yearList = applySort('years', Object.keys(byYear).sort().reverse().map(function (k) { return byYear[k]; }));
    var yearTable = yearList.length
      ? '<div class="tbl-wrap" style="max-height:none"><table class="tbl"><thead><tr>' +
        sortHead('years', 'year', '접수 연도') + sortHead('years', 'total', '접수 안건', 'num') + sortHead('years', 'done', '완료', 'num') +
        sortHead('years', 'rate', '완료율', 'num') + sortHead('years', 'active', '진행 중', 'num') + sortHead('years', 'delayed', '지연', 'num') +
        sortHead('years', 'records', '진행 기록', 'num') + '<th></th></tr></thead><tbody>' +
        yearList.map(function (o) {
          var on = o.year === year;
          return '<tr class="clickable' + (on ? ' picked' : '') + '" data-act="pick-year" data-year="' + esc(o.year) + '" title="눌러서 ' + esc(o.year) + (o.year === '미상' ? '' : '년') + ' 안건만 보기">' +

      ['dueDate', function (h) { return h === '완료예정일'; }],
      ['doneDate', function (h) { return h === '완료일'; }],
      ['progress', function (h) { return h === '진도율'; }],
      ['requester', function (h) { return h.indexOf('요청자') === 0; }],
      ['requestDeadline', function (h) { return h.indexOf('요청마감일') >= 0; }],
      ['note', function (h) { return h === '비고'; }]
    ];
    function headerOf(row) {
      var hs = row.map(function (c) { return String(c === null || c === undefined ? '' : c).replace(/\s+/g, ''); });
      // 업무보고 표의 머리글 줄: 단계·접수번호·업무 내용 열이 모두 있어야 함 (처리 순번 열은 없어도 됨)
      if (hs.indexOf('접수번호') < 0 || hs.indexOf('업무내용') < 0 || (hs.indexOf('단계') < 0 && hs.indexOf('처리순번') < 0)) return null;
      var map = {};
      hs.forEach(function (h, i) {
        HEADER_KEYS.forEach(function (k) { if (map[k[0]] === undefined && h && k[1](h)) map[k[0]] = i; });
      });
      if (map.stage === undefined) map.stage = 0;
      return map;
    }
    function parseSheet(X, ws, sheetName, hidden, todayStr) {
      var aoa = X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      var map = null, rows = [], warnings = [], skipped = 0, lastYear = +todayStr.slice(0, 4);
      aoa.forEach(function (row, i) {
        var rowNo = i + 1;
        var h = headerOf(row);
        if (h) { map = h; return; }
        if (!map) return;
        var get = function (k) { return map[k] === undefined ? '' : row[map[k]]; };
        if (row.every(function (c) { return c === '' || c === null; })) return;
        var ownersRaw = String(get('owners')).trim(), contentRaw = String(get('content')).trim();
        if (/^팀원/.test(ownersRaw) || contentRaw === '업무 내용 기입') return; // 작성 예시 줄
        var st = mapStage(get('stage'));
        if (!st) { skipped++; warnings.push(rowNo + '행: 단계 "' + String(get('stage')) + '"를 알 수 없어 건너뜀'); return; }
        if (!contentRaw) { skipped++; warnings.push(rowNo + '행: 업무 내용이 비어 있어 건너뜀'); return; }
        var receiptNo = String(get('receiptNo')).trim();
        var ym = /^(\d{2})\d{4}_/.exec(receiptNo);
        var yearHint = ym ? 2000 + +ym[1] : lastYear;
        var date = parseDate(get('date'), yearHint);
        if (date) lastYear = +date.slice(0, 4);
        var pct = parsePct(get('progress'));
        var status = mapStatus(get('status'), pct);
        var origStatus = String(get('status')).trim();
        var rec = {
          project: '', stage: st.code, order: st.order, origSeq: +get('seq') || 0, rowNo: rowNo,
          owners: L.splitNames(ownersRaw.replace(/[\/·]/g, ',')).join(', '),
          date: date, receiptNo: receiptNo, content: contentRaw, status: status, origStatus: origStatus,
          progress: status === '완료' ? '100' : (status === '진행중' ? String(pct === null ? 0 : Math.max(0, Math.min(100, pct))) : ''),
          dueDate: parseDate(get('dueDate'), yearHint), doneDate: parseDate(get('doneDate'), yearHint),
          requester: String(get('requester')).trim(), requestDeadline: parseDate(get('requestDeadline'), yearHint),
          note: String(get('note')).trim()
        };
        if (rec.requester === '-') rec.requester = '';
        if (!date) warnings.push(rowNo + '행: 작성일 "' + String(get('date')) + '"을(를) 읽지 못해 비워 둠');
        rows.push(rec);
      });
      // 접수번호가 없는 줄은 작성일 기준으로 새 번호 부여
      var used = {};
      rows.forEach(function (r) { if (r.receiptNo) used[r.receiptNo] = true; });
      rows.forEach(function (r) {
        if (r.receiptNo) return;
        var base = (r.date || todayStr);
        var prefix = base.slice(2, 4) + base.slice(5, 7) + base.slice(8, 10) + '_';
        var n = 1;
        while (used[prefix + n]) n++;
        r.receiptNo = prefix + n;
        used[r.receiptNo] = true;
        r.note = (r.note ? r.note + ' / ' : '') + '가져오기: 접수번호가 없어 새로 부여';
        warnings.push(r.rowNo + '행: 접수번호가 없어 ' + r.receiptNo + '로 부여');
      });
      // 접수번호별 정리: 기존 1·2단계 → 1단계 한 줄, 5·6단계 → 4단계 한 줄로 합치고 처리 순번 다시 매기기
      var groups = {}, order = [], result = [], mergedAway = 0;
      rows.forEach(function (r) {
        if (!groups[r.receiptNo]) { groups[r.receiptNo] = []; order.push(r.receiptNo); }
        groups[r.receiptNo].push(r);
      });
      order.forEach(function (no) {
        var g = groups[no];
        g.sort(function (a, b) { return (a.order - b.order) || (a.origSeq - b.origSeq) || (a.rowNo - b.rowNo); });
        var openings = g.filter(function (r) { return r.order === 1; });
        var titles = L.splitNames(openings.map(function (r) { return r.content.replace(/,/g, ' '); }).join(','));
        if (openings.length > 1 && titles.length > 1) {
          warnings.push(no + ': 접수 기록이 ' + openings.length + '건이에요. 서로 다른 안건이 같은 번호를 쓰고 있을 수 있어요 (' + titles.map(function (t) { return t.slice(0, 20); }).join(' / ') + ')');
        }
        var out = [], done = {};
        g.forEach(function (r) {
          if (r.stage !== '1' && r.stage !== '4') { out.push(r); return; }
          if (done[r.stage]) return;
          done[r.stage] = true;
          var same = g.filter(function (x) { return x.stage === r.stage; });
          if (same.length > 1) { out.push(mergeRows(same)); mergedAway += same.length - 1; } else out.push(r);
        });
        out.forEach(function (r, i) { r.seq = String(i + 1); result.push(r); });
      });
      return {
        name: sheetName, hidden: hidden, project: suggestName(sheetName), supported: !!map,
        selected: !!map && !hidden && result.length > 0, rows: result, sourceRows: rows.length, mergedAway: mergedAway,
        warnings: warnings, skipped: skipped, receipts: order.length
      };
    }
    function parse(X, buf, todayStr) {
      var wb = X.read(buf, { type: 'array' });
      var meta = (wb.Workbook && wb.Workbook.Sheets) || [];
      return wb.SheetNames.map(function (name, i) {
        var hidden = !!(meta[i] && meta[i].Hidden);
        return parseSheet(X, wb.Sheets[name], name, hidden, todayStr);
      });
    }
    return { parse: parse };
  })();

  // 변환(합치기)한 결과를 새 5단계 형식 엑셀로 저장: 사업별 시트
  function exportConverted() {
    var imp = S.imp;
    if (!imp) return;
    var picked = imp.sheets.filter(function (s) { return s.selected && s.project.trim(); });
    if (!picked.length) { toast('내려받을 시트를 골라 주세요.', 'error'); return; }
    loadXLSX().then(function (X) {
      var wb = X.utils.book_new(), used = {};
      picked.forEach(function (s) {
        var aoa = [['단계', '담당', '작성일', '접수번호', '업무 내용', '상태', '완료예정일', '완료일', '진도율', '요청자', '(있을시)요청마감일', '비고']];
        s.rows.forEach(function (r) {
          aoa.push([L.stageInfo(r.stage).label, r.owners, r.date, r.receiptNo, r.content, r.status, r.dueDate, r.doneDate,
            r.status === '완료' ? '100%' : (r.status === '진행중' ? (+r.progress || 0) + '%' : ''), r.requester, r.requestDeadline, r.note]);
        });
        var ws = X.utils.aoa_to_sheet(aoa);
        ws['!cols'] = [20, 16, 11, 11, 70, 8, 11, 11, 8, 16, 14, 30].map(function (w) { return { wch: w }; });
        ws['!autofilter'] = { ref: ws['!ref'] };
        var name = s.project.trim().replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31), n = 2;
        while (used[name]) name = name.slice(0, 28) + ' ' + (n++);
        used[name] = true;
        X.utils.book_append_sheet(wb, ws, name);
      });
      X.writeFile(wb, imp.fileName.replace(/\.xlsx?$/i, '') + '_5단계변환.xlsx');
      toast('변환 결과를 엑셀로 내려받았어요.');
    }).catch(function (e) { toast(e.message, 'error'); });

  function readImportFile(file) {
    if (!file) return;
    setBusy(true);
    var reader = new FileReader();
    reader.onload = function () { importFromBuffer(reader.result, file.name); };
    reader.onerror = function () { setBusy(false); toast('파일을 읽지 못했어요.', 'error'); };
    reader.readAsArrayBuffer(file);
  }
  function importFromBuffer(buf, fileName) {
    setBusy(true);
    return loadXLSX().then(function (X) {
      var sheets = Importer.parse(X, new Uint8Array(buf), today());
      S.imp = { fileName: fileName, sheets: sheets, result: null };
      setBusy(false);
      renderView();
      return sheets;
    }).catch(function (e) { setBusy(false); toast('엑셀을 읽지 못했어요: ' + e.message, 'error'); });
  }
  function runImport() {
    var imp = S.imp;

    var records = [], projects = [];
    imp.sheets.forEach(function (s) {
      if (!s.selected) return;
      var name = s.project.trim();
      if (!name) return;
      projects.push(name);
      s.rows.forEach(function (r) {
        records.push({
          project: name, stage: r.stage, owners: r.owners, date: r.date, receiptNo: r.receiptNo, seq: r.seq,
          content: r.content, status: r.status, progress: r.progress, dueDate: r.dueDate, doneDate: r.doneDate,
          requester: r.requester, requestDeadline: r.requestDeadline, note: r.note
        });
      });
    });
    if (!records.length) { toast('가져올 기록이 없어요.', 'error'); return; }
    confirmBox(records.length + '건을 ' + esc(projects.join(', ')) + ' 과제로 가져올까요?', '가져오기').then(function (ok) {
      if (!ok) return;

  }

  /* ==========================================================================
   * 사업 화면: 전체 진행현황(연간 계획표) · RFP 관리 · 사업 진행사항
   * 사업 진행사항 = 연구 과제의 작업 + 유지보수 과제의 안건(PEO가 쓴 단계 기록 + PEO 상세 기록)
   * 빌드할 때 app.html 화면 코드 안(BIZ_UI 자리)에 그대로 들어갑니다.
   * ========================================================================== */
  var PLAN_ST_CLS = { '예정': 'wait', '진행중': 'run', '완료': 'done', '보류': 'hold' };
  var MS_CLS = { '보고': 'k-report', '발표': 'k-present', '회의': 'k-meet', '기타': 'k-etc' };
  function planChip(st) { return '<span class="st st-' + (PLAN_ST_CLS[st] || 'wait') + '">' + esc(st || '예정') + '</span>'; }
  function projByName(name) { return S.data.projects.filter(function (p) { return p.name === name; })[0] || null; }
  function canEditBizP(p) { return !!p && L.canEditBiz(S.user, p); }
  function projOrder(a, b) { // 과제 목록의 번호 순 → 연구 먼저 → 이름
    var na = parseFloat(a.no), nb = parseFloat(b.no);
    if (!isNaN(na) || !isNaN(nb)) { if (isNaN(na)) return 1; if (isNaN(nb)) return -1; if (na !== nb) return na - nb; }
    if (a.kind !== b.kind) return a.kind === '연구' ? -1 : 1;
    return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
  }
  // 사업 화면의 과제: 연구·유지보수 모두 (유지보수는 사업 안에 포함)
  function bizProjects() { return S.data.projects.slice().sort(projOrder); }
  // 전체 진행현황(연간 계획표)·RFP 관리에 보이는 과제: 과제 관리에서 ‘현황 숨김’한 과제는 뺌
  function boardProjects() { return bizProjects().filter(function (p) { return !p.hideBoard; }); }
  // ‘기간이 지난 과제 숨기기’: 과제 관리 > 연구사업에서만 켜고 끔. 켜져 있으면 전체 진행현황·RFP 관리에서 종료일이 지난 과제를 아예 뺌 (어느 해를 보든)
  function hideEnded(p) { return pjHideEnded() && projectEnded(p); }
  // 사업 진행사항에 처음 들어왔을 때 보여 줄 과제 (볼 수 없으면 목록의 첫 과제)
  var DEFAULT_BIZ_PROJECT = 'HBM';
  function projLabel(p) { return p.name; } // 과제 선택 상자에는 약어만 (mFCDB처럼 m으로 유지보수 구분)
  function yearsOf(project) {
    return (S.data.years || []).filter(function (y) { return y.project === project; })
      .sort(function (a, b) { return (+a.yearNo) - (+b.yearNo); });
  }
  // 오늘이 속한 연차, 없으면 마지막 연차
  function currentYearOf(project) {
    var ys = yearsOf(project), m = today().slice(0, 7);
    return ys.filter(function (y) { return y.startMonth <= m && m <= y.endMonth; })[0] || ys[ys.length - 1] || null;
  }
  function planOf(project, yearNo) {
    return (S.data.plan || []).filter(function (x) { return x.project === project && x.yearNo === yearNo; })
      .sort(function (a, b) { var ka = L.codeKey(a.code), kb = L.codeKey(b.code); return ka < kb ? -1 : ka > kb ? 1 : 0; });
  }
  function tasksOf(project, yearNo) {
    return (S.data.tasks || []).filter(function (t) { return t.project === project && (!yearNo || t.yearNo === yearNo); });
  }
  function logsOfTask(id) { return (S.data.logs || []).filter(function (l) { return l.taskId === id; }).sort(byDateDesc); }
  function monthsBetween(s, e) {
    var out = [];
    if (!L.isMonth(s) || !L.isMonth(e)) return out;
    for (var i = 0; i <= L.monthIndex(e) - L.monthIndex(s) && i < 36; i++) out.push(L.addMonths(s, i));
    return out;
  }
  function monthOf(date) { return L.isDate(date) ? date.slice(0, 7) : ''; }
  function ymText(m) { return m ? m.slice(0, 4) + '.' + m.slice(5) : ''; }
  function rangeText(s, e) { return s ? (!e || s === e ? ymText(s) : ymText(s) + '~' + ymText(e)) : ''; }
  // 가장 이른 해부터 가장 늦은 해까지 모든 연도 (과제 기간 중간 연도가 빠지지 않게)
  function yearSpan(years) {
    var ns = years.map(Number).filter(function (n) { return n > 1990 && n < 2100; });
    var lo = Math.min.apply(null, ns), hi = Math.max.apply(null, ns), out = [];
    for (var y = lo; y <= hi; y++) out.push([String(y), y + '년']);
    return out;
  }
  function yearLabel(y) { return y ? y.yearNo + '차년도 (' + ymText(y.startMonth) + '~' + ymText(y.endMonth) + ')' : ''; }
  function byDateDesc(a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (a.updatedAt || '') < (b.updatedAt || '') ? 1 : -1;
  }
  function taskLate(t) { return t.status !== '완료' && L.isDate(t.targetDate) && t.targetDate < today() ? L.daysBetween(t.targetDate, today()) : 0; }
  function emptyProjects() {
    return '<div class="card empty"><strong>' + (isPM() ? '등록된 과제가 없어요' : '참여 중인 과제가 없어요') + '</strong></div>';
  }
  // 과제 기본 정보 (과제 목록 및 담당자 표의 내용)
  function projectInfo(p) {
    var bits = [];
    if (p.fullName) bits.push('<span class="pi-full">' + esc(p.fullName) + '</span>');
    if (p.ministry || p.field) bits.push(esc([p.ministry, p.field].filter(Boolean).join(' · ')));
    if (p.leader) bits.push('연구책임자 ' + esc(p.leader));
    if (p.teamLead) bits.push('이행팀장 ' + esc(p.teamLead));

    bits.push('참여 ' + esc(p.members.join(', ') || '-'));
    return '<div class="info-line">' + projKindChips(p) + ' <b>' + esc(p.name) + '</b><span class="pi-bits">' + bits.join('<i>·</i>') + '</span></div>';
  }
  function chev() {
    return '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 7 5 3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  /* ---------- PEO 기록 판별·건수 ---------- */
  function orgOfName(name) {
    var u = (S.data.users || []).filter(function (x) { return x.name === name; })[0];
    return u ? u.org : '';
  }
  // PEO가 쓴 유지보수 단계 기록인지: 작성자 소속으로 판단. 엑셀에서 가져온 기록은 담당자 소속, 그것도 모르면 1·3·5단계(연구자 단계)
  function isPeoRecord(r) {
    if (r.author && r.author !== L.IMPORT_AUTHOR) { var o = orgOfName(r.author); if (o) return o === 'PEO'; }
    var orgs = L.splitNames(r.owners).map(orgOfName).filter(Boolean);
    if (orgs.length) return orgs.indexOf('PEO') >= 0;
    return ['1', '3', '5'].indexOf(r.stage) >= 0;
  }
  function notesOf(project, receiptNo) {
    return (S.data.caseNotes || []).filter(function (n) { return n.project === project && n.receiptNo === receiptNo; }).sort(byDateDesc);
  }
  // PEO 상세 기록 건수 (PEO·PI만. PMO는 PM이어도 건수조차 보이지 않음)
  function noteCount(project, receiptNo) {
    return seesBiz() ? notesOf(project, receiptNo).length : 0;
  }
  // 유지보수 안건별 요약의 비고 칸 표시 (PEO·PI만)
  function peoNoteTag(s) {
    if (!seesBiz()) return '';
    var n = noteCount(s.project, s.receiptNo);
    return n ? ' <span class="tag peo-tag" title="PEO 상세 기록 ' + n + '건">PEO 기록 ' + n + '</span>' : '';
  }
  // 유지보수 이력 창 아래: 상세 기록은 사업 진행사항에서 (PEO·PI만 바로가기)
  function peoNotesLink(project, receiptNo) {
    if (!seesBiz()) return '';
    var n = noteCount(project, receiptNo);
    return '<div class="peo-link"><b>PEO 상세 기록 ' + n + '건</b><button class="btn sm" data-act="go-case" data-project="' + esc(project) + '" data-receipt="' + esc(receiptNo) + '">사업 진행사항에서 ' + (n ? '보기' : '쓰기') + '</button></div>';
  }

  /* ---------- 전체 진행현황 > 사업: 연간 계획표 ---------- */
  function msKind(m) { return L.milestoneKind(m); }
  function msChip(m) { return '<span class="ms ' + MS_CLS[msKind(m)] + '">' + esc(m.content) + '</span>'; }
  function msLegend() {
    return '<div class="legend ms-legend">' + L.MS_KINDS.map(function (k) { return '<span class="ms ' + MS_CLS[k] + '">' + k + '</span>'; }).join('') + '</div>';
  }
  // 이번 달 표시: 그 달 열 오른쪽 끝 빨간 선 + 머리글 빨간 배지 (범례는 RFP 현황에만)
  function todayKey() { return '<span class="today-key" title="빨간 선 왼쪽 열이 이번 달이에요"><i></i>이번 달 (' + (+today().slice(5, 7)) + '월)</span>'; }
  function monthHead(m, cur, text) { return m === cur ? '<span class="now-pill" title="이번 달">' + text + '</span>' : text; }
  // 보이는 기간(start~end 월)과 과제 기간이 겹치는지. 기간이 비어 있으면 보여줌
  function overlaps(p, start, end) {
    var ps = monthOf(p.startDate), pe = monthOf(p.endDate);
    return (!pe || pe >= start) && (!ps || ps <= end);
  }
  // 전체 진행현황 과제 칸 아래: PEO 담당자만, 주/부 나눠서 (PMO 개발자는 넣지 않음)
  function scMembers(p) {
    var g = memberGroups(p);
    function part(label, cls, list) {
      return list.length ? '<span class="sc-mg"><span class="mem-lbl ' + cls + '">' + label + '</span>' + esc(list.join(', ')) + '</span>' : '';
    }
    var html = part('주', 'm-main', g.main) + part('부', 'm-sub', g.sub);
    return html ? '<div class="sc-mem">' + html + '</div>' : '';
  }
  function viewBizOverview(nav) {
    var t = today(), curMonth = t.slice(0, 7);
    var year = +(S.pv.year || t.slice(0, 4));
    var months = [];
    for (var i = 0; i < 15; i++) months.push(L.addMonths(year + '-01', i)); // 1~12월 + 다음 해 1~3월
    // 고른 해(1~12월)와 기간이 겹치는 과제만. 다음 해 1~3월에만 걸치는 과제는 넣지 않음
    var projs = boardProjects().filter(function (p) { return overlaps(p, year + '-01', year + '-12') && !hideEnded(p); });
    var msMap = {};
    (S.data.milestones || []).forEach(function (m) { (msMap[m.project + '|' + m.month] = msMap[m.project + '|' + m.month] || []).push(m); });
    var ys = {};

    S.data.projects.forEach(function (p) { [p.startDate, p.endDate].forEach(function (d) { if (d) ys[d.slice(0, 4)] = true; }); });
    var yearOpts = yearSpan(Object.keys(ys));

    var head1 = '<tr><th class="sc" rowspan="2">구분</th><th class="sc2" rowspan="2">과제</th><th colspan="12">' + year + '년</th><th colspan="3" class="nexty">' + (year + 1) + '년</th></tr>';
    var head2 = '<tr>' + months.map(function (m) {
      return '<th class="mh' + (m === curMonth ? ' now' : '') + (+m.slice(0, 4) !== year ? ' nexty' : '') + '">' + monthHead(m, curMonth, (+m.slice(5)) + '월') + '</th>';
    }).join('') + '</tr>';
    var body = projs.map(function (p) {
      var editable = canEditBizP(p);
      var ps = monthOf(p.startDate), pe = monthOf(p.endDate);
      return '<tr><td class="sc">' + projKindChips(p, true) + '</td><td class="sc2" title="' + esc(p.fullName || '') + '"><b>' + esc(p.name) + '</b><div class="sc-period">' + esc(periodText(p.startDate, p.endDate)) + '</div>' + scMembers(p) + '</td>' +
        months.map(function (m) {
          var inP = !!(ps || pe) && (!ps || m >= ps) && (!pe || m <= pe);
          var items = msMap[p.name + '|' + m] || [];
          return '<td class="mc' + (inP ? ' in' : '') + (m === curMonth ? ' now' : '') + (+m.slice(0, 4) !== year ? ' nexty' : '') + (editable ? ' edit' : '') + '"' +
            (editable ? ' data-act="ms-cell" data-project="' + esc(p.name) + '" data-month="' + m + '" title="' + esc(p.name + ' · ' + ymText(m)) + '"' : '') + '>' +
            items.map(msChip).join('') + '</td>';
        }).join('') + '</tr>';
    }).join('');
    var planTable = projs.length

  }

  /* 연간 계획표의 월별 일정 편집 창 */
  var msOpen = null;
  // 일정 종류: 보고·발표·회의·기타 중에서만 고름 (목록에 ‘종류’ 같은 안내 항목 없음)
  // 새 일정은 기타로 시작하고, 내용을 쓰는 동안 글자에 맞춰 바뀜(발표·회의·보고). 종류를 직접 고르면 그대로 둠
  function msKindSelect(attr, value) {
    return '<select class="inp ms-kind" ' + attr + ' aria-label="종류">' + options(L.MS_KINDS, value || '기타') + '</select>';
  }
  document.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'ms-new') return;
    var k = $('#ms-new-kind');
    if (k && k.getAttribute('data-auto') === '1') k.value = L.milestoneKind({ content: e.target.value });
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'ms-new-kind') e.target.removeAttribute('data-auto'); // 직접 고르면 더는 바꾸지 않음
  });
  function msBody() {
    var items = (S.data.milestones || []).filter(function (m) { return m.project === msOpen.project && m.month === msOpen.month; });
    return (items.length ? '<div class="ms-list">' + items.map(function (m) {
      return '<div class="ms-row"><span class="ms-dot ' + MS_CLS[msKind(m)] + '" aria-hidden="true"></span><input class="inp" data-ms-input="' + esc(m.id) + '" value="' + esc(m.content) + '" maxlength="200" aria-label="일정 내용">' +
        msKindSelect('data-ms-kind="' + esc(m.id) + '"', msKind(m)) + // 종류가 저장 안 된 예전 일정은 지금 보이는 색의 종류를 미리 골라 둠
        '<button class="btn sm" data-act="ms-save" data-id="' + esc(m.id) + '">저장</button><button class="btn sm danger-line" data-act="ms-del" data-id="' + esc(m.id) + '">삭제</button></div>';
    }).join('') + '</div>' : '') +
      '<div class="ms-row ms-head" aria-hidden="true"><span class="lbl">새 일정 내용 <em>*</em></span><span class="lbl">종류 <em>*</em></span><button type="button" class="btn primary ghost-btn" tabindex="-1" disabled>추가</button></div>' +
      '<div class="ms-row ms-new"><input class="inp" id="ms-new" maxlength="200" placeholder="예: 착수보고, 진도점검(발표)" aria-label="새 일정 내용 (필수)">' + msKindSelect('id="ms-new-kind" data-auto="1"', '기타') +
      '<button class="btn primary" data-act="ms-add">추가</button></div>';
  }
  function openMsModal(project, month) {
    msOpen = { project: project, month: month };
    openModal({ title: project + ' · ' + month.slice(0, 4) + '년 ' + (+month.slice(5)) + '월 일정', size: 'wide', body: '<div id="ms-body">' + msBody() + '</div>', footer: '<button class="btn" data-act="modal-close">닫기</button>' });
    var inp = $('#ms-new'); if (inp) inp.focus();
  }
  function refreshMsModal() {
    var b = $('#ms-body');
    if (!msOpen || !b) return;
    b.innerHTML = msBody();
    var inp = $('#ms-new'); if (inp) inp.focus();
  }
  function msAdd() {
    var inp = $('#ms-new');
    if (!inp || !inp.value.trim()) { toast('일정 내용을 입력해 주세요.', 'error'); return; }
    var kind = $('#ms-new-kind').value || '기타';
    call('saveMilestone', { project: msOpen.project, month: msOpen.month, content: inp.value.trim(), kind: kind })
      .then(function (res) { applyState(res); refreshMsModal(); }, noop);
  }

  /* ---------- 사업 진행사항 ---------- */
  // 펼침 상태 키: 작업은 't:id', 유지보수 안건은 'c:과제|접수번호'
  function caseKey(project, receiptNo) { return 'c:' + project + '|' + receiptNo; }
  function viewBiz() {
    var projs = bizProjects();
    var head = '<div class="view-head"><h1>연구사업 진행사항</h1></div>';
    if (!projs.length) return head + emptyProjects();
    var p = projByName(S.bz.project);
    if (!p) { p = projByName(DEFAULT_BIZ_PROJECT) || projs[0]; S.bz.project = p.name; }
    var isMaint = p.kind !== '연구';
    var years = isMaint ? [] : yearsOf(p.name); // 유지보수 과제는 안건만 보여 주므로 연차·업무번호 선택이 필요 없음
    if (!years.some(function (y) { return y.yearNo === S.bz.yearNo; })) { var cy = currentYearOf(p.name); S.bz.yearNo = cy ? cy.yearNo : ''; }
    var y = years.filter(function (x) { return x.yearNo === S.bz.yearNo; })[0] || null;
    var items = y ? planOf(p.name, y.yearNo) : [];
    var editable = canEditBizP(p);
    var f = S.bz;
    // 유지보수 과제: 진행 단계(유지보수 진행사항 기록) / 이력(유지보수 > 이력 장부) 보기. 사람마다 마지막에 고른 보기를 기억
    var mview = isMaint && f.mview === 'history' ? 'history' : 'stage';

    // 검색 조건
    var codeOpts = [['', '전체 업무번호']].concat(items.map(function (x) {
      var cut = x.title.length > 26; // 잘린 번호는 마우스를 올리면 전체 제목이 보임
      return [x.code, x.code + ' ' + (cut ? x.title.slice(0, 26) + '…' : x.title), { title: cut ? x.code + ' ' + x.title : '' }];
    }));
    var filters = '<div class="filters">' +
      '<select class="inp" data-filter="bz.project" aria-label="과제">' + options(projs.map(function (x) { return [x.name, projLabel(x)]; }), p.name) + '</select>' +
      (isMaint ? '<div class="seg-group biz-mview" role="tablist" aria-label="보기">' + [['stage', '진행 단계'], ['history', '이력']].map(function (b) {
        return '<button type="button" role="tab" class="seg-btn' + (mview === b[0] ? ' on' : '') + '" aria-selected="' + (mview === b[0]) + '" data-act="bz-mview" data-view="' + b[0] + '">' + b[1] + '</button>';
      }).join('') + '</div>' : '') +
      (years.length ? '<select class="inp" data-filter="bz.yearNo" aria-label="연차">' + options(years.map(function (x) { return [x.yearNo, yearLabel(x)]; }), S.bz.yearNo) + '</select>' : '') +
      (items.length ? '<select class="inp" data-filter="bz.code" aria-label="업무번호">' + options(codeOpts, f.code) + '</select>' : '') +
      (isMaint ? yearSelect() : '') +
      '<select class="inp" data-filter="bz.status" aria-label="진행상태">' + options(L.PLAN_STATUSES.concat(['지연']), f.status || '', '전체 상태') + '</select>' +
      '<input type="search" class="inp search" data-filter="bz.q" placeholder="검색" value="' + esc(f.q || '') + '" aria-label="검색">' +
      // 이력 보기는 완료한 이력이 대부분이라 ‘종결된 업무 숨기기’를 쓰지 않음
      (mview === 'history' ? '' : '<label class="check"><input type="checkbox" data-filter="bz.hideDone"' + (f.hideDone ? ' checked' : '') + '> 종결된 업무 숨기기</label>') +
      '</div>';
    // 유지보수 과제: 진행 단계(유지보수 안건) 또는 이력 / 연구 과제: 작업
    return head + filters + (isMaint ? (mview === 'history' ? mhBizSection(p) : caseSection(p, editable)) : taskSection(p, y, items, editable));
  }
  // 상태 필터·검색·종결 숨기기를 작업에 적용
  function taskVisible(t, q) {
    var f = S.bz;
    if (f.code && t.code !== f.code && t.code.indexOf(f.code + '-') !== 0) return false;
    if (f.status === '지연' ? !taskLate(t) : (f.status && t.status !== f.status)) return false;
    if (f.hideDone && t.status === '완료' && !(f.status === '완료')) return false;
    if (q) {
      var hay = [t.code, t.category, t.scope, t.title, t.content, t.result, t.teamResearch, t.teamData, t.teamDev]
        .concat(logsOfTask(t.id).map(function (l) { return l.content; })).join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }
  function taskSection(p, y, items, editable) {
    var title = '<h2>작업</h2>';

    var body = rows.map(function (t) {

      title: (t ? '작업 상세' : '작업 추가') + ' · ' + project + (yearNo ? ' ' + yearNo + '차년도' : ''), size: 'wide',

        '<div class="fld"><span class="lbl">진행상태' + REQ + '</span><div class="seg-group" role="radiogroup" aria-label="진행상태">' + L.PLAN_STATUSES.map(function (s) {
          return '<label class="seg-opt"><input type="radio" name="status" value="' + s + '"' + (s === (t ? t.status : '진행중') ? ' checked' : '') + '><span>' + s + '</span></label>';
        }).join('') + '</div></div></div>' +
        '<div class="form-grid"><label class="fld"><span class="lbl">구분</span><input class="inp" name="category" maxlength="30" autocomplete="off" value="' + v('category') + '"></label>' +
        '<label class="fld"><span class="lbl">범위</span><input class="inp" name="scope" maxlength="60" autocomplete="off" value="' + v('scope') + '"></label></div>' +
        '<label class="fld"><span class="lbl">세부 내용' + REQ + '</span><input class="inp" name="title" maxlength="300" value="' + v('title') + '"></label>' +
        '<label class="fld"><span class="lbl">작업 내용</span><textarea class="inp" name="content" rows="3">' + v('content') + '</textarea></label>' +
        '<label class="fld"><span class="lbl">현재 작업결과</span><input class="inp" name="result" maxlength="1000" value="' + v('result') + '"></label>' +
        '<div class="form-grid three"><label class="fld"><span class="lbl">시작일</span><input type="date" class="inp" name="startDate" value="' + v('startDate') + '"></label>' +
        '<label class="fld"><span class="lbl">목표일</span><input type="date" class="inp" name="targetDate" value="' + v('targetDate') + '"></label>' +
        '<label class="fld"><span class="lbl">종료일</span><input type="date" class="inp" name="endDate" value="' + v('endDate') + '"></label></div>' +
        '<div class="fld"><span class="lbl">반영 완료 담당자</span><div class="form-grid three">' +
        '<input class="inp" name="teamResearch" placeholder="연구팀" aria-label="연구팀" value="' + v('teamResearch') + '">' +
        '<input class="inp" name="teamData" placeholder="데이터분석팀" aria-label="데이터분석팀" value="' + v('teamData') + '">' +
        '<input class="inp" name="teamDev" placeholder="개발팀" aria-label="개발팀" value="' + v('teamDev') + '"></div></div></form>',
      // 삭제는 상세 창 아래 왼쪽 (표의 관리 칸을 없앴으므로)
      footer: (t ? '<span class="left"><button class="btn danger-line" data-act="task-del" data-id="' + esc(t.id) + '">삭제</button></span>' : '') +
        '<button class="btn ghost" data-act="modal-close">취소</button><button class="btn primary" id="task-save">저장</button>'
    });
    var form = $('#task-form', m);
    // 고른 업무번호의 제목이 잘렸으면 닫힌 상자에 마우스를 올려도 전체 제목이 보이게
    if (form.code.tagName === 'SELECT') {
      var syncCodeTitle = function () { var o = form.code.selectedOptions[0]; form.code.title = (o && o.title) || ''; };
      syncCodeTitle();

    $('#task-save', m).addEventListener('click', function () {

      ['code', 'category', 'scope', 'title', 'content', 'result', 'startDate', 'targetDate', 'endDate', 'teamResearch', 'teamData', 'teamDev'].forEach(function (k) { payload[k] = form[k].value; });

  /* ---------- RFP 관리 > 전체 RFP 현황 (PI·PM): 모든 과제의 RFP를 한눈에 ---------- */
  function rfpView() { return isPM() ? (S.rfView || 'all') : 'project'; }
  function rfpNav() {
    if (!isPM()) return '';
    var v = rfpView();
    return '<div class="subtabs" role="tablist">' + [['all', '전체 RFP 현황'], ['project', '과제별 RFP']].map(function (t) {
      return '<button role="tab" class="subtab' + (v === t[0] ? ' on' : '') + '" data-act="rf-view" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
  }
  // 하위 항목이 없는 RFP 항목 (보통 연구 방법 1-1-1, MEFs처럼 두 단계면 1-1)
  function leafItems(items) {
    var parent = {};
    items.forEach(function (x) { parent[L.parentCode(x.code)] = true; });
    return items.filter(function (x) { return !parent[x.code]; });
  }
  // 고른 연도와 가장 많이 겹치는 연차
  function yearInYear(project, Y) {
    var s = Y + '-01', e = Y + '-12', best = null, bestN = 0;
    yearsOf(project).forEach(function (y) {
      var a = y.startMonth > s ? y.startMonth : s, b = y.endMonth < e ? y.endMonth : e;
      var n = a <= b ? L.monthIndex(b) - L.monthIndex(a) + 1 : 0;
      if (n > bestN) { best = y; bestN = n; }
    });
    return best;
  }
  function viewRfpAll(nav) {
    var t = today(), cur = t.slice(0, 7);
    var Y = +(S.rv.year || t.slice(0, 4));
    var ys = {}; ys[t.slice(0, 4)] = true; ys[String(Y)] = true;
    (S.data.years || []).forEach(function (y) { ys[y.startMonth.slice(0, 4)] = true; ys[y.endMonth.slice(0, 4)] = true; });
    var yearOpts = yearSpan(Object.keys(ys));
    var head = '<div class="view-head"><h1>RFP 관리</h1><div class="head-tools"><select class="inp" data-filter="rv.year" aria-label="연도">' + options(yearOpts, String(Y)) + '</select></div></div>' + nav;

    // 과제마다 그 해 연차의 RFP(1단계)와 연구 방법
    var rows = boardProjects().filter(function (p) { return !hideEnded(p); }).map(function (p) {
      var y = yearInYear(p.name, Y);
      if (!y) return null;
      var items = planOf(p.name, y.yearNo);
      return { p: p, y: y, leaves: leafItems(items), l1: items.filter(function (x) { return L.codeLevel(x.code) === 1; }) };
    }).filter(Boolean);
    if (!rows.length) return head + '<div class="card empty"><strong>' + Y + '년에 진행하는 RFP가 없어요</strong></div>';

    // RFP 일정 한눈에 보기: 과제 → RFP(1단계)별로, 달마다 진행 중인 연구 방법 수만큼 진하게
    var months = []; // 고른 해의 1~12월
    for (var i = 0; i < 12; i++) months.push(L.addMonths(Y + '-01', i));
    function heat(n) { return n <= 0 ? '' : ' i' + Math.min(4, n); }
    // 과제 줄: 약어 + PEO 연구원 (주실무자 = 진한 파랑, 부실무자 = 연한 파랑 이름표)
    function peoNames(p) {
      var g = memberGroups(p);
      var chips = g.main.map(function (n) { return '<span class="rv-mem rv-main" title="주실무자">' + esc(n) + '</span>'; })
        .concat(g.sub.map(function (n) { return '<span class="rv-mem rv-sub" title="부실무자">' + esc(n) + '</span>'; }));
      return chips.length ? '<span class="rv-members">' + chips.join('') + '</span>' : '';
    }
    var body = rows.map(function (r) {
      var open = ' data-act="rv-open" data-project="' + esc(r.p.name) + '" data-year="' + esc(r.y.yearNo) + '"';
      var inY = function (m) { return m >= r.y.startMonth && m <= r.y.endMonth; };
      var headRow = '<tr class="rv-proj clickable"' + open + '><td class="rv-name" colspan="2"><b>' + esc(r.p.name) + '</b>' + (r.p.kind === '연구' ? '' : ' ' + kindChip(r.p.kind)) +
        peoNames(r.p) + '</td>' +
        months.map(function (m) { return '<td class="rv-m' + (inY(m) ? ' in' : '') + (m === cur ? ' now' : '') + '"></td>'; }).join('') + '</tr>';
      var l1Rows = r.l1.map(function (x) {
        var kids = r.leaves.filter(function (lf) { return lf.code === x.code || lf.code.indexOf(x.code + '-') === 0; });
        return '<tr class="clickable"' + open + '><td class="rv-code mono">' + esc(x.code) + '</td><td class="rv-title" title="' + esc(x.title) + '">' + esc(x.title) + '</td>' +
          months.map(function (m) {
            var n = kids.filter(function (lf) { return lf.startMonth && lf.startMonth <= m && m <= (lf.endMonth || lf.startMonth); }).length;
            return '<td class="rv-m' + heat(n) + (m === cur ? ' now' : '') + '"' + (n ? ' data-tip="' + esc(r.p.name + ' ' + x.code + ' · ' + ymText(m) + ' 연구 방법 ' + n + '개') + '"' : '') + '></td>';
          }).join('') + '</tr>';
      }).join('');
      return headRow + l1Rows;
    }).join('');
    return head + '<section class="panel"><div class="panel-head"><h2>RFP 일정 한눈에 보기</h2><span class="h-sub">' + Y + '.01 ~ ' + Y + '.12</span><span class="spacer"></span>' +
      '<span class="legend rv-legend"><span><span class="rv-mem rv-main">주실무자</span><span class="rv-mem rv-sub">부실무자</span></span>' + todayKey() +
      '<span><i class="rv-m in"></i>연차 기간</span><span><i class="rv-m i1"></i>연구 방법 1개</span><span><i class="rv-m i2"></i>2개</span><span><i class="rv-m i3"></i>3개</span><span><i class="rv-m i4"></i>4개 이상</span></span></div>' +
      // 열 너비: 번호(좁게) · RFP 이름(남는 폭 전부) · 월(좁게 고정)
      '<div class="plan-wrap rv-wrap"><table class="rv-gantt"><colgroup><col class="c-code"><col class="c-title">' + months.map(function () { return '<col class="c-m">'; }).join('') + '</colgroup>' +
      '<thead><tr><th colspan="2" class="rv-name">과제 · RFP</th>' +
      months.map(function (m) { return '<th class="' + (m === cur ? 'now' : '') + '">' + monthHead(m, cur, +m.slice(5)) + '</th>'; }).join('') + // 월 숫자만 (연도는 위 선택에)
      '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
  }

  /* ---------- RFP 관리: n차년도 수행 계획 + 월별 막대 ---------- */
  function viewRfp() {
    if (rfpView() === 'all') return viewRfpAll(rfpNav());
    var projs = boardProjects().filter(function (x) { return !hideEnded(x); }).sort(function (a, b) { return a.kind !== b.kind ? (a.kind === '연구' ? -1 : 1) : projOrder(a, b); });
    var head = '<div class="view-head"><h1>RFP 관리</h1></div>' + rfpNav();
    if (!projs.length) {
      return head + (S.data.projects.length ? '<div class="card empty"><strong>RFP 관리에 보이는 과제가 없어요</strong>과제 관리 → 연구사업의 ‘전체 진행현황·RFP에서 숨기기’나 ‘기간이 지난 과제 숨기기’를 풀면 다시 보여요.</div>' : emptyProjects());
    }
    var p = projByName(S.rf.project);
    if (!p || !projs.some(function (x) { return x.name === p.name; })) { p = projs[0]; S.rf.project = p.name; S.rf.yearNo = ''; }
    var years = yearsOf(p.name);
    if (!years.some(function (y) { return y.yearNo === S.rf.yearNo; })) { var cy = currentYearOf(p.name); S.rf.yearNo = cy ? cy.yearNo : ''; }
    var y = years.filter(function (x) { return x.yearNo === S.rf.yearNo; })[0] || null;
    var editable = canEditBizP(p);

    // 연차 관리 버튼은 RFP 항목보다 상위 → 연차 선택 옆(조건 줄)에 두고, 표 머리에는 RFP 항목 추가만
    var yearBtns = editable ? '<span class="year-acts"><button class="btn" data-act="year-add">+ 연차 추가</button>' +
      (y ? '<button class="btn" data-act="year-edit">연차 기간 수정</button><button class="btn danger-line" data-act="year-del">연차 삭제</button>' : '') + '</span>' : '';
    var filters = '<div class="filters"><select class="inp" data-filter="rf.project" aria-label="과제">' + options(projs.map(function (x) { return [x.name, projLabel(x)]; }), p.name) + '</select>' +
      (years.length ? '<select class="inp" data-filter="rf.yearNo" aria-label="연차">' + options(years.map(function (x) { return [x.yearNo, yearLabel(x)]; }), S.rf.yearNo) + '</select>' : '') + yearBtns + '</div>';
    var addBtn = editable && y ? '<button class="btn primary" data-act="plan-add">+ RFP 항목</button>' : '';
    if (!y) {
      return head + filters + '<section class="panel"><div class="panel-head"><h2>수행 계획</h2><span class="spacer"></span></div>' +
        '<div class="empty"><strong>아직 연차가 없어요</strong>' + (editable ? '위의 ‘+ 연차 추가’에서 기간을 넣거나 RFP 엑셀을 불러오세요.' : '') + '</div></section>';
    }
    return head + filters + rfpPlanPanel(p, y, editable, addBtn);
  }
  // 과제별 RFP 표: ‘전체 RFP 현황’과 같은 모양 (한 줄 행, 좁은 월 칸).
  // 색은 RFP 묶음(1, 2, 3…)마다 다르게: 연구 방법은 진한 색, 그 위 RFP·연구 내용은 아래 항목 기간을 연한 색으로.
  // 줄을 누르면 수정 창 (하위 항목 추가·삭제도 그 창에서)
  function rfpPlanPanel(p, y, editable, addBtn) {
    var items = planOf(p.name, y.yearNo), leaves = leafItems(items);
    var months = monthsBetween(y.startMonth, y.endMonth);
    var curMonth = today().slice(0, 7);
    var taskCount = {};
    tasksOf(p.name, y.yearNo).forEach(function (t) { if (t.code) taskCount[t.code] = (taskCount[t.code] || 0) + 1; });
    var groupNo = {}, groups = 0; // RFP 번호 → 색 번호 (1~6 반복)
    items.forEach(function (x) { var top = x.code.split('-')[0]; if (!groupNo[top]) groupNo[top] = (groups++ % 6) + 1; });
    function activeIn(x, m) { return x.startMonth && x.startMonth <= m && m <= (x.endMonth || x.startMonth); }
    function isLeaf(x) { return leaves.indexOf(x) >= 0; }
    function onIn(x, m) { // 상위 항목: 자기 기간 또는 아래 연구 방법 중 하나라도 진행 중이면
      return activeIn(x, m) || leaves.some(function (lf) { return lf.code.indexOf(x.code + '-') === 0 && activeIn(lf, m); });
    }
    var colCount = 4 + months.length;
    var colgroup = '<colgroup><col class="c-code"><col class="c-title"><col class="c-out"><col class="c-cnt">' +
      months.map(function () { return '<col class="c-m">'; }).join('') + '</colgroup>';
    var thead = '<tr><th colspan="2" class="rv-name">RFP · 연구 내용 · 연구 방법</th><th>주요 성과물</th><th>작업</th>' +
      months.map(function (m, i) {
        return '<th class="' + (m === curMonth ? 'now' : '') + '" title="' + esc(ymText(m)) + '">' + monthHead(m, curMonth, +m.slice(5)) + '</th>'; // 월 숫자만 (연도는 위 연차 제목에)
      }).join('') + '</tr>';
    var rows = items.length ? items.map(function (x) {
      var lv = L.codeLevel(x.code), leaf = isLeaf(x);
      var tip = x.title + (x.detail ? '\n\n' + x.detail : ''); // 줄이 잘려도 마우스를 올리면 전체 내용
      return '<tr class="rp-lv' + lv + ' rg' + groupNo[x.code.split('-')[0]] + (editable ? ' clickable' : '') + '"' +
        (editable ? ' data-act="plan-edit" data-id="' + esc(x.id) + '"' : '') + '>' +
        '<td class="rv-code mono">' + esc(x.code) + '</td>' +
        '<td class="rv-title" title="' + esc(tip) + '">' + esc(x.title) + '</td>' +
        '<td class="rp-out" title="' + esc(x.output) + '">' + esc(x.output) + '</td>' +
        '<td class="rp-cnt">' + (taskCount[x.code] ? '<button class="link" data-act="go-task-code" data-code="' + esc(x.code) + '">' + taskCount[x.code] + '</button>' : '') + '</td>' +
        months.map(function (m) {
          var on = leaf ? activeIn(x, m) : onIn(x, m);
          return '<td class="rv-m' + (on ? (leaf ? ' on' : ' on-p') : '') + (m === curMonth ? ' now' : '') + '"></td>';
        }).join('') + '</tr>';
    }).join('') : '<tr><td colspan="' + colCount + '"><div class="empty"><strong>RFP 항목이 없어요</strong></div></td></tr>';
    return '<section class="panel"><div class="panel-head"><h2>' + esc(yearLabel(y)) + '</h2><span class="spacer"></span>' +
      addBtn + '</div>' +
      '<div class="plan-wrap rv-wrap"><table class="rv-gantt rp">' + colgroup +
      '<thead>' + thead + '</thead><tbody>' + rows + '</tbody></table></div></section>';
  }
  function suggestCode(items, parent) {
    var lv = parent ? L.codeLevel(parent) + 1 : 1;
    var max = items.filter(function (i) { return L.codeLevel(i.code) === lv && L.parentCode(i.code) === parent; })
      .reduce(function (m, i) { return Math.max(m, +i.code.split('-').pop() || 0); }, 0);
    return (parent ? parent + '-' : '') + (max + 1);
  }
  function openPlanModal(o) {
    var x = o.id ? (S.data.plan || []).filter(function (i) { return i.id === o.id; })[0] : null;
    var project = x ? x.project : S.rf.project, yearNo = x ? x.yearNo : S.rf.yearNo;
    var y = yearsOf(project).filter(function (v) { return v.yearNo === yearNo; })[0];
    var items = planOf(project, yearNo);
    var code = x ? x.code : suggestCode(items, o.parent || '');
    var parent = L.parentCode(code), parentItem = parent ? items.filter(function (i) { return i.code === parent; })[0] : null;
    var kindName = ['RFP', '연구 내용', '연구 방법'][L.codeLevel(code) - 1] || '항목';
    var REQ = ' <em>*</em>';
    var m = openModal({
      title: (x ? 'RFP 항목 수정' : kindName + ' 추가') + ' · ' + project + ' ' + yearNo + '차년도', size: 'wide',
      body: '<form class="form" id="plan-form" novalidate>' +
        (parentItem ? '<div class="callout">상위 항목: <b class="mono">' + esc(parentItem.code) + '</b> ' + esc(parentItem.title) + '</div>' : '') +
        '<label class="fld"><span class="lbl">번호' + REQ + '</span><input class="inp mono" name="code" value="' + esc(code) + '" style="max-width:160px"></label>' +
        '<label class="fld"><span class="lbl">제목' + REQ + '</span><input class="inp" name="title" maxlength="300" value="' + esc(x ? x.title : '') + '"></label>' +
        '<label class="fld"><span class="lbl">상세 내용</span><textarea class="inp" name="detail" rows="5">' + esc(x ? x.detail : '') + '</textarea></label>' +
        '<label class="fld"><span class="lbl">주요 성과물</span><input class="inp" name="output" maxlength="300" value="' + esc(x ? x.output : '') + '"></label>' +
        '<div class="form-grid"><label class="fld"><span class="lbl">시작월</span><input type="month" class="inp" name="startMonth" value="' + esc(x ? x.startMonth : '') + '"' + (y ? ' min="' + y.startMonth + '" max="' + y.endMonth + '"' : '') + '></label>' +
        '<label class="fld"><span class="lbl">종료월</span><input type="month" class="inp" name="endMonth" value="' + esc(x ? x.endMonth : '') + '"' + (y ? ' min="' + y.startMonth + '" max="' + y.endMonth + '"' : '') + '></label></div></form>',
      // 수정할 때: 표에서 뺀 ‘+ 하위’·‘삭제’를 이 창 아래에
      footer: (x ? '<span class="left"><button class="btn danger-line" data-act="plan-del" data-id="' + esc(x.id) + '">삭제</button>' +
          (L.codeLevel(x.code) < 3 ? '<button class="btn" data-act="plan-child" data-code="' + esc(x.code) + '">+ 하위 항목</button>' : '') + '</span>' : '') +

  var BizImporter = (function () {
    function pad(n) { return ('0' + n).slice(-2); }
    function ymd(y, m, d) {
      y = +y; m = +m; d = +d;

    function serialDate(v) { return new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000).toISOString().slice(0, 10); }
    function txt(c) { return !c || c.v === undefined || c.v === null ? '' : String(c.v).replace(/\r\n?/g, '\n').trim(); }
    function norm(s) { return String(s || '').replace(/\s+/g, ''); }

    // 시트를 2차원 배열로. 병합된 칸은 왼쪽 위 칸의 값을 모든 칸에 채움 (색은 각 칸 그대로)
    function readGrid(X, ws) {

      '<button class="btn primary" data-act="bimp-run"' + (any ? '' : ' disabled') + '>가져오기 (RFP ' + total.items + ' · 작업 ' + total.tasks + ' · 기록 ' + total.logs + ')</button></div></div>';
  }
  function runBizImport() {
    var b = S.bimp;
    if (!b) return;
    var picked = b.sheets.filter(function (s) { return s.selected; });
    var need = {};
    picked.forEach(function (s) { need[s.project] = true; });
    if (b.useMs) b.milestones.forEach(function (m) { need[m.project] = true; });
    var projects = b.projects.filter(function (x) { return b.useProjects || (need[x.name] && x.state === 'new'); }).map(function (x) {
      return { name: x.name, kind: x.kind, no: x.no, fullName: x.fullName, ministry: x.ministry, field: x.field, leader: x.leader, teamLead: x.teamLead,
        startDate: x.startDate, endDate: x.endDate, members: x.members || [] };
    });
    var payload = {
      projects: projects, milestones: b.useMs ? b.milestones : [],
      sheets: picked.map(function (s) {
        return { project: s.project, yearNo: s.yearNo, startMonth: s.startMonth, endMonth: s.endMonth, items: s.items, tasks: s.tasks };
      })
    };
    var parts = [];
    if (projects.length) parts.push('과제 ' + projects.length + '개');
    if (payload.milestones.length) parts.push('일정 ' + payload.milestones.length + '건');

    confirmBox(esc(parts.join(', ')) + '을(를) 가져올까요?', '가져오기').then(function (ok) {
      if (!ok) return;
      call('importBiz', payload).then(function (res) {
        S.data = res.state;
        b.result = res.info;
        bimpCompare(b);
        renderView();
        toast('가져오기를 마쳤어요.');
      }, noop);
    });
  }
  function clearBizImported() {
    var c = bimpImportedCounts();
    confirmBox('엑셀에서 가져온 사업 데이터를 지울까요?<br><span class="hint">작업 ' + c.tasks + '건(그 진행 기록 포함) · RFP 항목 ' + c.items + '건 · 일정 ' + c.ms + '건. ' +
      '화면에서 직접 쓴 진행 기록이 달린 작업과 직접 고친 RFP 항목, 과제 정보는 남아요. 되돌릴 수 없어요.</span>', '지우기', true).then(function (ok) {
      if (!ok) return;

        if (S.bimp) { S.bimp.result = null; bimpCompare(S.bimp); }
