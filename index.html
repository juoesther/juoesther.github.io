  // 유지보수 기록 수정·삭제: 본인이 작성한 기록만.
  // 엑셀에서 가져온 기록(또는 작성자 정보가 없는 예전 기록)은 쓴 사람이 없으니 담당자가 고칠 수 있음
  function canEdit(user, rec) {
    if (isAdminRole(user.role)) return false;
    if (rec.author && rec.author !== IMPORT_AUTHOR) return rec.author === user.name;
    return hasName(rec.owners, user.name);
  }

  /* ---------- 안건별 요약: 접수번호마다 가장 마지막에 작성한 기록 한 줄 ---------- */
  function summarize(records, today, hideDays, closures) {
    var closedMap = {};
    (closures || []).forEach(function (c) { closedMap[c.project + '\u0001' + c.receiptNo] = c; });
    var groups = {}, order = [];
    records.forEach(function (r) {
      var k = r.project + '\u0001' + r.receiptNo;
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(r);
    });
    return order.map(function (k) {
      var list = groups[k].slice().sort(bySeq);
      // 대표(현재) 기록 = 가장 마지막에 작성한 기록: 작성일이 늦은 것 → 같은 날이면 나중에 입력한 것(처리순번) → 저장 시각
      // (1단계 다음에 쓴 비기능, 3단계 다음에 다시 쓴 2단계도 그대로 현재 단계가 됨)
      var last = null;
      list.forEach(function (r) {
        if (!last) { last = r; return; }
        var da = r.date || '', db = last.date || '';
        if (da !== db) { if (da > db) last = r; return; }
        var sa = +r.seq || 0, sb = +last.seq || 0;
        if (sa !== sb) { if (sa > sb) last = r; return; }
        if ((r.updatedAt || '') >= (last.updatedAt || '')) last = r;
      });
      var origin = null, opening = null;
      list.forEach(function (r) {
        if (!origin && (r.requester || r.requestDeadline)) origin = r;
        if (!opening && NEW_RECEIPT_STAGES.indexOf(r.stage) >= 0) opening = r;
      });
      var closed = closedMap[k] || null; // PM 최종완료
      var finished = !!closed || (last.status === '완료' && (last.stage === '5' || last.stage === '비기능'));
      var finishedOn = closed ? (closed.closedAt || last.doneDate || last.date) : (finished ? (last.doneDate || last.date) : '');
      var hidden = finished && hideDays > 0 && isDate(finishedOn) && daysBetween(finishedOn, today) >= hideDays;
      var delayed = !closed && last.status !== '완료' && isDate(last.dueDate) && last.dueDate < today;
      return {
        key: k,
        project: last.project,
        receiptNo: last.receiptNo,
        record: last,
        title: firstLine((opening || list[0]).content),
        receivedOn: (opening || list[0]).date,
        year: receiptYear(last.receiptNo, (opening || list[0]).date),
        requester: origin ? origin.requester : '',
        requestDeadline: origin ? origin.requestDeadline : '',
        count: list.length,
        closed: closed,
        finished: finished,
        finishedOn: finishedOn,
        hidden: hidden,
        delayed: delayed,
        delayDays: delayed ? daysBetween(last.dueDate, today) : 0
      };
    });
  }

  /* ---------- 서버 API ---------- */
  function create(store, env) {

    function allUsers() { return store.list('users'); }
    function hashPassword(pw, salt) {
      var h = String(pw);
      for (var i = 0; i < HASH_ROUNDS; i++) h = env.sha256(salt + '|' + h);
      return h;
    }
    function sessionVer(u) { return String(+u.sessionVer || 0); }
    // 토큰 = 이름|만료시각|세션번호|서명. 세션번호가 바뀌면(로그아웃 등) 예전 토큰은 모두 무효
    function makeToken(u) {
      var payload = encodeURIComponent(u.name) + '|' + (env.nowMs() + TOKEN_MINUTES * 60000) + '|' + sessionVer(u);
      return payload + '|' + env.hmac(payload);
    }
    function authenticate(token) {
      var parts = str(token).split('|');
      if (parts.length !== 4) fail('AUTH:로그인이 필요해요.');
      var payload = parts[0] + '|' + parts[1] + '|' + parts[2];
      if (env.hmac(payload) !== parts[3]) fail('AUTH:로그인 정보가 올바르지 않아요. 다시 로그인해 주세요.');
      if (+parts[1] < env.nowMs()) fail('AUTH:오래 사용하지 않아 로그아웃됐어요. 다시 로그인해 주세요.');
      var name = decodeURIComponent(parts[0]);
      var u = allUsers().filter(function (x) { return x.name === name; })[0];
      if (!u || u.active === 'N') fail('AUTH:사용할 수 없는 계정이에요. PM에게 문의해 주세요.');
      if (parts[2] !== sessionVer(u)) fail('AUTH:로그아웃되었거나 비밀번호가 바뀌어 접속이 끊겼어요. 다시 로그인해 주세요.');
      return u;
    }
    function bumpSession(u) { return String((+u.sessionVer || 0) + 1); }
    function requirePM(u) { if (!isAdminRole(u.role)) fail('PM만 할 수 있는 작업이에요.'); }
    function requireWriter(u) { if (isAdminRole(u.role)) fail('PM·PI 계정은 진행 기록을 작성하지 않아요.'); }
    function findProject(projects, name) {
      return projects.filter(function (p) { return p.name === name; })[0] || null;
    }
    // 유지보수 과제 접근 확인
    function requireMaint(u, projectName, projects) {
      var p = findProject(projects || store.list('projects'), projectName);
      if (!p) fail('과제를 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.');
      if (kindOf(p) !== '유지보수') fail('유지보수 과제가 아니에요.');
      if (!canSeeProject(u, p)) fail('참여 중인 과제가 아니에요.');
      return p;
    }
    // 사업 정보(RFP·작업·일정) 접근 확인. 유지보수 과제도 RFP·작업을 둘 수 있음 (예: mKIND)
    function requireBiz(u, projectName, edit) {
      if (!seesBiz(u)) fail('사업 정보를 볼 수 없는 계정이에요.');
      var p = findProject(store.list('projects'), projectName);
      if (!p) fail('과제를 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.');
      if (!canSeeProject(u, p)) fail('참여 중인 과제가 아니에요.');
      if (edit && !canEditBiz(u, p)) fail('이 과제를 수정할 권한이 없어요.');
      return p;
    }
    function clean(t, r) {
      var o = {};
      keysOf(t).forEach(function (k) { o[k] = str(r[k]); });
      return o;
    }
    function userInfo(u) { return { name: u.name, role: u.role, org: orgOf(u), label: roleLabel(u), seesBiz: seesBiz(u) }; }
    // 데이터 변경 번호: 누가 저장할 때마다 바뀜. 화면은 이 번호만 확인해서 바뀌었을 때만 새로 불러옴
    function revOf() { return store.rev ? str(store.rev()) : ''; }
    function session(u) { return { token: makeToken(u), user: userInfo(u) }; }

    function loadFor(u) {
      var projects = store.list('projects');
      var users = allUsers();
      var isPM = isAdminRole(u.role);
      var mine = projects.filter(function (p) { return canSeeProject(u, p); });
      var mineSet = {}, maintSet = {};
      mine.forEach(function (p) { mineSet[p.name] = true; if (kindOf(p) === '유지보수') maintSet[p.name] = true; });
      var recs = store.list('records').filter(function (r) { return maintSet[r.project]; }).map(function (r) { return clean('records', r); });
      var closures = store.list('closures').filter(function (c) { return maintSet[c.project]; }).map(function (c) { return clean('closures', c); });
      var counts = {};
      recs.forEach(function (r) { counts[r.project] = (counts[r.project] || 0) + 1; });
      var biz = seesBiz(u);
      function pick(t, set) {
        return biz ? store.list(t).filter(function (x) { return set[x.project]; }).map(function (x) { return clean(t, x); }) : [];
      }
      var visibleUsers = isPM ? users : users.filter(function (x) {
        return x.name === u.name || mine.some(function (p) { return hasName(p.members, x.name); });
      });
      // PEO 상세 기록(caseNotes)은 PEO·PI만 받음. PMO에는 건수도 보내지 않음
      return {
        user: userInfo(u),
        today: env.today(),
        rev: revOf(),
        projects: mine.map(function (p) {
          return {
            name: p.name, kind: kindOf(p), startDate: cleanDate(p.startDate), endDate: cleanDate(p.endDate),
            members: splitNames(p.members), createdAt: str(p.createdAt), recordCount: counts[p.name] || 0,
            no: str(p.no), fullName: str(p.fullName), ministry: str(p.ministry), field: str(p.field), leader: str(p.leader),
            teamLead: str(p.teamLead),
            category: kindOf(p) === '유지보수' ? '일반용역' : str(p.category), mainMembers: splitNames(p.mainMembers), contract: str(p.contract),
            hideBoard: str(p.hideBoard) === 'Y'
          };
        }).sort(byName),
        users: visibleUsers.map(function (x) {
          return {
            name: x.name, role: x.role, org: orgOf(x), label: roleLabel(x), active: x.active !== 'N', rank: str(x.rank), alias: str(x.alias),
            projects: mine.filter(function (p) { return hasName(p.members, x.name); }).map(function (p) { return p.name; })
          };
        }).sort(byName),
        records: recs,
        closures: closures,
        years: pick('years', mineSet),
        plan: pick('plan', mineSet),
        tasks: pick('tasks', mineSet),
        logs: pick('logs', mineSet),
        milestones: pick('milestones', mineSet),
        caseNotes: pick('caseNotes', maintSet), // PEO만 받음
        maintHistory: pick('maintHistory', maintSet), // 유지보수 이력: PEO만 받음 (볼 수 있는 유지보수 과제만)
        // 업무보고: PEO만. PI·PEO·PM은 전원 것(전체 현황), 연구자는 본인 것만
        // 팀 업무(team = 'Y', PI·PEO·PM이 씀)는 PEO 모두에게. 내 업무(일간·주간)는 본인·PI·PEO·PM만
        reports: biz ? store.list('reports').filter(function (r) { return isPM || r.author === u.name || sharedReport(r); }).map(function (r) { return clean('reports', r); }) : [],
        // 팀 업무 진행 기록 (PEO 모두, 팀 업무 것만)
        reportLogs: biz ? (function () {
          var team = {};
          store.list('reports').forEach(function (r) { if (sharedReport(r)) team[r.id] = true; });
          return store.list('reportLogs').filter(function (x) { return team[x.reportId]; }).map(function (x) { return clean('reportLogs', x); });
        })() : [],
        // 업무보고의 사업 고르기: 담당이 아니어도 고를 수 있게 전체 과제 이름 (이름·구분·순서만)
        reportProjects: biz ? projects.map(function (p) { return { name: p.name, kind: kindOf(p), no: str(p.no) }; }) : [],
        outcomes: pick('outcomes', mineSet), // 성과관리: 볼 수 있는 과제만
        mails: canSeeMail(u) ? store.list('mails').map(function (x) { return clean('mails', x); }) : [], // 메일 송부 현황
        mailLogs: canSeeMail(u) ? store.list('mailLogs').map(function (x) { return clean('mailLogs', x); }) : [],
        // 메일의 사업명 고르기: 연구사업(전체 과제) 중 기간이 지나지 않은 것 (종료일이 없으면 포함)
        mailProjects: canSeeMail(u) ? activeProjects(projects).map(function (p) { return { name: p.name, kind: kindOf(p), no: str(p.no) }; }) : [],
        settings: settingsOf(), // 모든 사람 공통 설정
        serverBuild: SERVER_BUILD // 서버 코드 지문 (화면 파일과 같은 빌드인지 확인)
      };
    }

    function applyFields(base, p, today) {
      var r = {};
      Object.keys(base).forEach(function (k) { r[k] = base[k]; });
      // 요청에 없는 항목은 기존 값을 유지
      function given(k) { return Object.prototype.hasOwnProperty.call(p, k) && p[k] !== undefined && p[k] !== null; }
      function pick(k) { return given(k) ? p[k] : base[k]; }
      // 작성일: 보낸 경우에만 바꿈 (오늘 이후는 안 됨)
      if (given('date')) {
        var d = cleanDate(p.date);
        if (!d) fail('작성일을 입력해 주세요.');
        if (d > today) fail('작성일은 오늘 이후로 정할 수 없어요.');
        r.date = d;
      }
      var content = str(pick('content'));
      if (!content) fail('업무 내용을 입력해 주세요.');
      if (content.length > 3000) fail('업무 내용은 3000자 이내로 입력해 주세요.');
      r.content = content;
      // 담당: 고르지 않음. 새 기록은 작성자, 수정할 때는 기존 담당 그대로 (보낸 owners는 무시)
      if (!splitNames(r.owners).length) r.owners = str(r.author);
      var status = STATUSES.indexOf(str(pick('status'))) >= 0 ? str(pick('status')) : '대기';
      r.status = status;
      if (status === '완료') {
        r.progress = '100';
      } else if (status === '진행중') {
        var n = Math.round(Number(str(pick('progress')) || 0));
        if (!isFinite(n)) n = 0;
        r.progress = String(Math.max(0, Math.min(100, n)));
      } else {
        r.progress = '';
      }
      r.dueDate = cleanDate(pick('dueDate'));
      r.doneDate = cleanDate(pick('doneDate'));
      if (status === '완료' && !r.doneDate) r.doneDate = today;
      // 요청자: 1단계는 필수, 2~5단계·비기능은 선택
      r.requester = str(pick('requester'));
      r.requestDeadline = cleanDate(pick('requestDeadline'));
      if (r.stage === '1' && !r.requester) fail('1단계(접수 및 분석 배정)는 요청자를 입력해 주세요.');
      r.note = str(pick('note'));
      return r;
    }

    /* --- 로그인 전 --- */
    function bootstrap() {
      // 로그인 전에는 사용자 명단을 보내지 않음 (이름은 직접 입력)
      return { needsSetup: allUsers().length === 0, today: env.today() };
    }
    function setup(p) {
      return store.withLock(function () {
        if (allUsers().length) fail('이미 설정이 끝났어요. 로그인해 주세요.');
        var name = str(p.name);
        validateName(name, '이름');
        validatePassword(p.password);
        var salt = env.uuid();
        // 처음 만드는 계정은 최고 관리자(PI)
        var u = { name: name, role: 'PI', org: '', active: 'Y', salt: salt, hash: hashPassword(p.password, salt), createdAt: env.now() };
        store.append('users', [u]);
        return session(u);
      });
    }
    function login(p) {
      var name = str(p.name);
      var u = allUsers().filter(function (x) { return x.name === name; })[0];
      if (!u || u.active === 'N' || hashPassword(String(p.password || ''), u.salt) !== u.hash) {
        fail('이름 또는 비밀번호가 맞지 않아요.');
      }
      return session(u);
    }

    /* --- 유지보수 진행 기록 --- */
    function saveRecord(u, p) {
      requireWriter(u);
      return store.withLock(function () {
        var projects = store.list('projects');
        var records = store.list('records');
        var today = env.today();
        var saved;
        if (str(p.id)) {
          var cur = records.filter(function (r) { return r.id === str(p.id); })[0];
          if (!cur) fail('기록을 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.');
          requireMaint(u, cur.project, projects);
          if (!canEdit(u, cur)) fail('본인이 작성한 기록만 수정할 수 있어요.');
          saved = applyFields(clean('records', cur), p, today);
          saved.updatedAt = env.now();
          store.update('records', cur.id, saved);
        } else {
          var proj = requireMaint(u, str(p.project), projects);
          var stage = str(p.stage);
          if (!STAGE_RANK.hasOwnProperty(stage)) fail('단계를 선택해 주세요.');
          var date = cleanDate(p.date) || today; // 작성일 (새 접수번호의 날짜 부분도 이 날짜로)
          var receiptNo = str(p.receiptNo);
          var exists = function (no) { return records.some(function (r) { return r.project === proj.name && r.receiptNo === no; }); };
          if (p.newReceipt || !receiptNo) {
            // 새 접수번호: 비워 두면 작성일 기준으로 자동(YYMMDD_순번), 직접 적은 번호는 겹치지 않을 때만
            if (NEW_RECEIPT_STAGES.indexOf(stage) < 0) fail('2~5단계는 기존 접수번호를 골라야 해요.');
            if (!receiptNo) receiptNo = nextReceiptNo(records, proj.name, date);
            else {
              if (receiptNo.length > 30) fail('접수번호는 30자 이내로 입력해 주세요.');
              if (/[,，|]/.test(receiptNo)) fail('접수번호에는 쉼표(,)나 | 를 쓸 수 없어요.');
              if (exists(receiptNo)) fail('이미 있는 접수번호(' + receiptNo + ')예요. ‘기존 접수번호에 추가’를 고르거나 다른 번호를 적어 주세요.');
            }
          } else if (!exists(receiptNo)) {
            fail('고른 접수번호(' + receiptNo + ')를 찾을 수 없어요.');
          }
          saved = applyFields({
            id: env.uuid(), project: proj.name, stage: stage, owners: u.name, date: date,
            receiptNo: receiptNo, seq: String(nextSeq(records, proj.name, receiptNo)),
            author: u.name
          }, p, today);
          saved.updatedAt = env.now();
          store.append('records', [saved]);
        }
        return { state: loadFor(u), info: { id: saved.id, receiptNo: saved.receiptNo, seq: saved.seq } };
      });
    }
    function deleteRecord(u, p) {
      requireWriter(u);
      return store.withLock(function () {
        var cur = store.list('records').filter(function (r) { return r.id === str(p.id); })[0];
        if (!cur) fail('이미 삭제된 기록이에요.');
        requireMaint(u, cur.project);
        if (!canEdit(u, cur)) fail('본인이 작성한 기록만 삭제할 수 있어요.');
        store.remove('records', cur.id);
        return { state: loadFor(u) };
      });
    }

    /* --- 과제 (PM) --- */
    function checkMembers(names, kind) {
      var users = allUsers();
      return uniq(names).filter(function (n) {
        var x = users.filter(function (y) { return y.name === n; })[0];
        if (!x) fail('"' + n + '" 사용자를 찾을 수 없어요.');
        if (isAdminRole(x.role)) return false;
        if (kind === '연구' && x.role !== '연구자') fail('연구 과제에는 연구자만 배정할 수 있어요. (' + n + ')');
        return true;
      });
    }
    var LINKED = ['records', 'years', 'plan', 'tasks', 'logs', 'milestones', 'caseNotes', 'maintHistory'];
    function linkedCount(name, tables) {
      var n = 0;
      (tables || LINKED).forEach(function (t) { n += store.list(t).filter(function (x) { return x.project === name; }).length; });
      return n;
    }
    function saveProject(u, p) {
      requirePM(u);
      return store.withLock(function () {
        var name = str(p.name);
        validateName(name, '과제명');
        var kind = KINDS.indexOf(str(p.kind)) >= 0 ? str(p.kind) : '유지보수';
        if (!canManageProject(u, kind)) fail('PMO·PM은 유지보수 과제만 관리할 수 있어요.');
        var startDate = cleanDate(p.startDate), endDate = cleanDate(p.endDate);
        if (startDate && endDate && startDate > endDate) fail('종료일이 시작일보다 빨라요.');
        var members = checkMembers(p.members || [], kind);
        var projects = store.list('projects');
        var orig = str(p.originalName);
        var prev = orig ? findProject(projects, orig) : null;
        // 보내지 않은 칸은 기존 값 유지 (예전 화면에서 저장해도 지워지지 않도록)
        function keep(k) { return p[k] === undefined || p[k] === null ? (prev ? prev[k] : '') : p[k]; }
        // 구분(연구사업 종류): 연구용역·일반용역·출연과제·정책연구. 유지보수 과제는 일반용역 중 '유지보수'에 체크한 과제
        var category = kind === '유지보수' ? '일반용역' : str(keep('category'));
        if (category && RESEARCH_TYPES.indexOf(category) < 0) fail('구분(연구사업 종류)을 다시 골라 주세요.');
        // 주실무자: 참여자 중 PEO(연구자)만. 안 보내면 기존 값에서 지금 참여자만 남김
        var peo = {};
        allUsers().forEach(function (x) { if (x.role === '연구자') peo[x.name] = true; });
        var mainList = Array.isArray(p.mainMembers) ? p.mainMembers : splitNames(prev ? prev.mainMembers : '');
        var mains = uniq(mainList).filter(function (n) { return members.indexOf(n) >= 0 && peo[n]; });
        var contract = str(keep('contract'));
        if (contract && CONTRACT_TYPES.indexOf(contract) < 0) fail('계약형태를 다시 골라 주세요.');
        // 전체 진행현황·RFP에서 숨기기: 안 보내면 기존 값 유지
        var hideBoard = p.hideBoard === undefined || p.hideBoard === null ? (prev && str(prev.hideBoard) === 'Y' ? 'Y' : '') : (p.hideBoard === true || p.hideBoard === 'Y' ? 'Y' : '');
        var fields = {
          name: name, members: joinNames(members), kind: kind, startDate: startDate, endDate: endDate,
          category: category, mainMembers: joinNames(mains), contract: contract, hideBoard: hideBoard,
          no: validateText(keep('no'), '번호', 10, false), fullName: validateText(keep('fullName'), '과제명', 200, false),
          ministry: validateText(keep('ministry'), '부처', 50, false), field: validateText(keep('field'), '분야', 50, false),
          leader: validateText(keep('leader'), '연구책임자', 50, false), teamLead: validateText(keep('teamLead'), '이행팀장', 50, false)
        };
        if (orig) {
          var cur = findProject(projects, orig);
          if (!cur) fail('과제를 찾을 수 없어요.');
          if (!canManageProject(u, kindOf(cur))) fail('PMO·PM은 유지보수 과제만 관리할 수 있어요.');
          if (name !== orig && findProject(projects, name)) fail('같은 이름의 과제가 이미 있어요.');
          // 구분(연구사업 ↔ 유지보수)은 기록이 있어도 바꿀 수 있음. 기록은 지우지 않음
          store.update('projects', orig, fields);
          if (name !== orig) {
            ['records', 'years', 'plan', 'tasks', 'logs', 'milestones', 'caseNotes', 'maintHistory', 'reports', 'outcomes'].forEach(function (t) {
              var moved = store.list(t).filter(function (x) { return x.project === orig; })
                .map(function (x) { return { id: x.id, project: name }; });
              if (moved.length) store.updateMany(t, moved);
            });
            store.list('closures').filter(function (c) { return c.project === orig; }).forEach(function (c) {
              store.update('closures', c.id, { id: closureId(name, c.receiptNo), project: name });
            });
          }
        } else {
          if (findProject(projects, name)) fail('같은 이름의 과제가 이미 있어요.');
          fields.createdAt = env.now();
          store.append('projects', [fields]);
        }
        return { state: loadFor(u) };
      });
    }
    function deleteProject(u, p) {
      requirePM(u);
      return store.withLock(function () {
        var name = str(p.name);
        var cur = findProject(store.list('projects'), name);
        if (!cur) fail('이미 삭제된 과제예요.');
        if (!canManageProject(u, kindOf(cur))) fail('PMO·PM은 유지보수 과제만 관리할 수 있어요.');
        if (linkedCount(name, ['records', 'plan', 'tasks', 'logs', 'caseNotes', 'outcomes', 'maintHistory'])) fail('기록·작업·RFP 항목·성과·유지보수 이력이 있는 과제는 삭제할 수 없어요.');
        store.remove('projects', name);
        ['closures', 'years', 'milestones'].forEach(function (t) {
          var ids = store.list(t).filter(function (x) { return x.project === name; }).map(function (x) { return x.id; });
          if (ids.length) store.removeMany(t, ids);
        });
        return { state: loadFor(u) };
      });
    }
    // 과제 순서 (화면의 projOrder와 같은 기준): 번호 순 → 연구 먼저 → 이름
    function projectOrder(a, b) {
      var na = parseFloat(a.no), nb = parseFloat(b.no);
      if (!isNaN(na) || !isNaN(nb)) { if (isNaN(na)) return 1; if (isNaN(nb)) return -1; if (na !== nb) return na - nb; }
      var ka = kindOf(a), kb = kindOf(b);
      if (ka !== kb) return ka === '연구' ? -1 : 1;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    }
    // 과제 관리 > 연구사업에서 끌어서 바꾼 순서 저장
    // names: 화면에 보이던 과제들의 새 순서. 그 과제들이 있던 자리 안에서만 순서를 바꾸고, 전체 번호를 1부터 다시 매김
    function reorderProjects(u, p) {
      requirePM(u);
      return store.withLock(function () {
        var projects = store.list('projects');
        var names = uniq((p.names || []).map(str));
        if (!names.length) fail('바꿀 과제가 없어요.');
        var moved = names.map(function (n) {
          var x = findProject(projects, n);
          if (!x) fail('과제를 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.');
          if (!canManageProject(u, kindOf(x))) fail('PMO·PM은 유지보수 과제만 관리할 수 있어요.');
          return x;
        });
        var seq = projects.slice().sort(projectOrder), slots = [];
        seq.forEach(function (x, i) { if (names.indexOf(x.name) >= 0) slots.push(i); });
        slots.forEach(function (pos, j) { seq[pos] = moved[j]; });
        var updates = [];
        seq.forEach(function (x, i) { var no = String(i + 1); if (str(x.no) !== no) updates.push({ name: x.name, no: no }); });
        if (updates.length) store.updateMany('projects', updates);
        return { state: loadFor(u) };
      });
    }

    /* --- 사용자 (PI·PM) --- */
    // PI는 PI 외 전부, PEO·PM은 연구자, PMO·PM은 개발자 계정만 관리
    function canManageAccount(u, role) {
      if (u.role === 'PI') return role !== 'PI';
      if (u.role !== 'PM') return false;
      return orgOf(u) === 'PEO' ? role === '연구자' : role === '개발자';
    }
    function manageError(u) {
      return u.role === 'PI' ? 'PI 계정은 관리할 수 없어요.'
        : (orgOf(u) === 'PEO' ? 'PEO·PM은 연구자 계정만 관리할 수 있어요.' : 'PMO·PM은 개발자 계정만 관리할 수 있어요.');
    }
    function normalizeOrg(role, org) {
      if (role === '연구자') return 'PEO';
      if (role === '개발자') return 'PMO';
      if (role === 'PM') return org === 'PEO' ? 'PEO' : 'PMO';
      return '';
    }
    function saveUser(u, p) {
      requirePM(u);
      return store.withLock(function () {
        var name = str(p.name), role = str(p.role), orig = str(p.originalName);
        var users = allUsers();
        if (ROLES.indexOf(role) < 0) fail('역할을 골라 주세요.');
        var org = normalizeOrg(role, str(p.org));
        if (role === 'PI' && orig !== u.name) fail('PI 역할은 화면에서 지정할 수 없어요.');
        var active = p.active === false ? 'N' : 'Y';
        // 직위: 목록 중 하나 또는 비움. 안 보내면 기존 값 유지
        var rankGiven = p.rank !== undefined && p.rank !== null, rank = str(p.rank);
        if (rank && RANKS.indexOf(rank) < 0) fail('직위를 다시 골라 주세요.');
        // 약칭: 업무보고 복사에 쓰는 짧은 이름 (10자까지, 대괄호·쉼표는 안 됨). 안 보내면 기존 값 유지
        var aliasGiven = p.alias !== undefined && p.alias !== null, alias = validateText(p.alias, '약칭', 10, false);
        if (/[\[\],]/.test(alias)) fail('약칭에는 대괄호([ ])나 쉼표를 쓸 수 없어요.');
        if (orig) {
          var cur = users.filter(function (x) { return x.name === orig; })[0];
          if (!cur) fail('사용자를 찾을 수 없어요.');
          name = orig; // 이름은 바꾸지 않습니다 (기록의 담당자와 연결되어 있음)
          if (orig === u.name) {
            if (role !== u.role || org !== normalizeOrg(u.role, u.org) || active === 'N') fail('본인 계정의 역할·소속이나 사용 여부는 바꿀 수 없어요.');
          } else {
            if (cur.role === 'PI') fail('PI 계정은 본인만 수정할 수 있어요.');
            if (!canManageAccount(u, cur.role) || !canManageAccount(u, role)) fail(manageError(u));
          }
          var patch = { role: role, org: org, active: active };
          if (rankGiven) patch.rank = rank;
          if (aliasGiven) patch.alias = alias;
          if (p.password) {
            validatePassword(p.password);
            patch.salt = env.uuid();
            patch.hash = hashPassword(p.password, patch.salt);
            patch.sessionVer = bumpSession(cur); // 기존 접속 끊기
          } else if (orig !== u.name && (cur.role !== role || normalizeOrg(cur.role, cur.org) !== org)) {
            patch.sessionVer = bumpSession(cur); // 권한이 바뀌면 다시 로그인하게 함
          }
          store.update('users', orig, patch);
        } else {
          if (!canManageAccount(u, role)) fail(manageError(u));
          validateName(name, '이름');
          if (users.some(function (x) { return x.name === name; })) fail('같은 이름의 사용자가 이미 있어요. 구분할 수 있게 이름 뒤에 표시를 붙여 주세요.');
          validatePassword(p.password);
          var salt = env.uuid();
          store.append('users', [{ name: name, role: role, org: org, active: active, rank: rank, alias: alias, salt: salt, hash: hashPassword(p.password, salt), createdAt: env.now() }]);
        }
        // 참여 과제 반영 (관리자는 배정하지 않음). 개발자는 유지보수 과제만. 편집자가 관리할 수 있는 과제만 바꿈
        if (Array.isArray(p.projects)) {
          var want = {};
          if (!isAdminRole(role)) uniq(p.projects).forEach(function (n) { want[n] = true; });
          var changes = [];
          store.list('projects').forEach(function (proj) {
            if (!canManageProject(u, kindOf(proj))) return;
            var members = splitNames(proj.members);
            var has = members.indexOf(name) >= 0;
            var ok = want[proj.name] && (role === '연구자' || kindOf(proj) === '유지보수');
            if (ok && !has) { members.push(name); changes.push({ name: proj.name, members: joinNames(members) }); }
            if (!ok && has) changes.push({ name: proj.name, members: joinNames(members.filter(function (m) { return m !== name; })) });
          });
          if (changes.length) store.updateMany('projects', changes);
        }
        return { state: loadFor(u) };
      });
    }
    // 사용자 삭제: 관리 권한이 있는 계정만. 본인·PI는 삭제 불가. 작성한 기록은 그대로 남음
    function deleteUser(u, p) {
      requirePM(u);
      return store.withLock(function () {
        var name = str(p.name);
        var target = allUsers().filter(function (x) { return x.name === name; })[0];
        if (!target) fail('이미 삭제된 사용자예요.');
        if (target.name === u.name) fail('본인 계정은 삭제할 수 없어요.');
        if (target.role === 'PI') fail('PI 계정은 삭제할 수 없어요.');
        if (!canManageAccount(u, target.role)) fail(manageError(u));
        store.remove('users', name);
        var changes = [];
        store.list('projects').forEach(function (proj) {
          var members = splitNames(proj.members);
          if (members.indexOf(name) >= 0) {
            changes.push({ name: proj.name, members: joinNames(members.filter(function (m) { return m !== name; })) });
          }
        });
        if (changes.length) store.updateMany('projects', changes);
        return { state: loadFor(u) };
      });
    }
    function changePassword(u, p) {
      if (hashPassword(String(p.current || ''), u.salt) !== u.hash) fail('현재 비밀번호가 맞지 않아요.');
      validatePassword(p.next);
      return store.withLock(function () {
        var salt = env.uuid();
        // 다른 곳의 기존 접속은 끊고, 지금 화면은 새 토큰으로 계속 사용
        store.update('users', u.name, { salt: salt, hash: hashPassword(p.next, salt), sessionVer: bumpSession(u) });
        return { ok: true };
      });
    }
    // 로그아웃: 세션번호를 올려 이 계정으로 열린 모든 화면(다른 PC 포함)의 로그인을 무효로 만듦
    function logoutAll(u) {
      return store.withLock(function () {
        store.update('users', u.name, { sessionVer: bumpSession(u) });
        return { ok: true };
      });
    }

    /* --- 기존 엑셀 가져오기 (PM) --- */
    function importRecords(u, p) {
      requirePI(u); // 엑셀 가져오기는 PI만
      return store.withLock(function () {
        var now = env.now();
        var projects = store.list('projects');
        var names = uniq(p.projects || []);
        names.forEach(function (n) {
          var ex = findProject(projects, n);
          if (ex && kindOf(ex) !== '유지보수') fail('"' + n + '"은(는) 연구 과제라 유지보수 기록을 가져올 수 없어요.');
        });
        var newProjects = names.filter(function (n) { return !findProject(projects, n); });
        newProjects.forEach(function (n) { validateName(n, '과제명'); });
        if (newProjects.length) {
          store.append('projects', newProjects.map(function (n) { return { name: n, members: '', kind: '유지보수', createdAt: now }; }));
        }
        // 이미 저장된 같은 기록의 개수만큼만 건너뜀 (원본에 똑같은 줄이 2개 있으면 2개 모두 들어감)
        var known = {};
        function dupKey(r) { return [r.project, r.receiptNo, r.stage, r.date, r.content].join('\u0001'); }
        store.list('records').forEach(function (r) { var k = dupKey(r); known[k] = (known[k] || 0) + 1; });
        var add = [], duplicates = 0, invalid = 0;
        (p.records || []).forEach(function (s) {
          var status = STATUSES.indexOf(str(s.status)) >= 0 ? str(s.status) : '대기';
          var r = {
            id: env.uuid(), project: str(s.project), stage: str(s.stage), owners: joinNames(splitNames(s.owners)),
            date: cleanDate(s.date), receiptNo: str(s.receiptNo), seq: str(s.seq), content: str(s.content),
            status: status, progress: status === '완료' ? '100' : (status === '진행중' ? str(s.progress) || '0' : ''),
            dueDate: cleanDate(s.dueDate), doneDate: cleanDate(s.doneDate), requester: str(s.requester),
            requestDeadline: cleanDate(s.requestDeadline), note: str(s.note), author: IMPORT_AUTHOR, updatedAt: now
          };
          if (!r.project || !STAGE_RANK.hasOwnProperty(r.stage) || !r.receiptNo || !r.content) { invalid++; return; }
          var k = dupKey(r);
          if (known[k] > 0) { known[k]--; duplicates++; return; }
          add.push(r);
        });
        if (add.length) store.append('records', add);
        return { state: loadFor(u), info: { added: add.length, duplicates: duplicates, invalid: invalid, newProjects: newProjects } };
      });
    }

    /* --- 최종완료 (PM): 5단계 전에 끝난 안건 종결 / 취소 --- */
    function closeCase(u, p) {
      requirePM(u);
      return store.withLock(function () {
        var project = str(p.project), receiptNo = str(p.receiptNo);
        requireMaint(u, project);
        if (!store.list('records').some(function (r) { return r.project === project && r.receiptNo === receiptNo; })) {
          fail('안건을 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.');
        }
        var note = validateText(p.note, '사유', 500, false);
        var id = closureId(project, receiptNo);
        var obj = { id: id, project: project, receiptNo: receiptNo, closedAt: cleanDate(p.closedAt) || env.today(),
          closedBy: u.name, note: note, createdAt: env.now() };
        if (store.list('closures').some(function (c) { return c.id === id; })) store.update('closures', id, obj);
        else store.append('closures', [obj]);
        return { state: loadFor(u) };
      });
    }
    function reopenCase(u, p) {
      requirePM(u);
      return store.withLock(function () {
        requireMaint(u, str(p.project));
        store.remove('closures', closureId(str(p.project), str(p.receiptNo)));
        return { state: loadFor(u) };
      });
    }

    // 엑셀에서 가져온 기록만 모두 지우기 (다시 가져오기 전 정리용, PM)
    function clearImported(u) {
      requirePI(u);
      return store.withLock(function () {
        var ids = store.list('records').filter(function (r) { return r.author === IMPORT_AUTHOR; })
          .map(function (r) { return r.id; });
        if (ids.length) store.removeMany('records', ids);
        return { state: loadFor(u), info: { removed: ids.length } };
      });
    }

    /* --- 사업: 연차 --- */
    function saveYear(u, p) {
      return store.withLock(function () {
        var proj = requireBiz(u, str(p.project), true, true);
        var startMonth = cleanMonth(p.startMonth), endMonth = cleanMonth(p.endMonth);
        if (!startMonth || !endMonth) fail('시작월과 종료월을 입력해 주세요.');
        if (startMonth > endMonth) fail('종료월이 시작월보다 빨라요.');
        if (monthIndex(endMonth) - monthIndex(startMonth) > 23) fail('한 연차는 24개월을 넘을 수 없어요.');
        var years = store.list('years').filter(function (y) { return y.project === proj.name; });
        if (str(p.id)) {
          var cur = years.filter(function (y) { return y.id === str(p.id); })[0];
          if (!cur) fail('연차를 찾을 수 없어요.');
          store.update('years', cur.id, { startMonth: startMonth, endMonth: endMonth });
          return { state: loadFor(u), info: { yearNo: cur.yearNo } };
        }
        var no = years.reduce(function (m, y) { return Math.max(m, +y.yearNo || 0); }, 0) + 1;
        // 엑셀에서 불러온 RFP 항목 (연차 추가 창의 ‘RFP 엑셀 불러오기’)
        var xlsItems = Array.isArray(p.items) ? p.items : [];
        if (xlsItems.length > 1000) fail('RFP 항목은 한 번에 1000개까지 넣을 수 있어요.');
        store.append('years', [{ id: env.uuid(), project: proj.name, yearNo: String(no), startMonth: startMonth, endMonth: endMonth, createdAt: env.now(), createdBy: u.name }]);
        if (xlsItems.length) {
          var pr = planRows({}, proj.name, String(no), xlsItems, u.name, env.now());
          if (pr.rows.length) store.append('plan', pr.rows);
          return { state: loadFor(u), info: { yearNo: String(no), items: pr.rows.length, skipped: pr.kept + pr.invalid } };
        }
        // 이전 연차의 RFP 항목을 복사 (월은 연차 시작월 차이만큼 옮기고 상태는 '예정')
        if (p.copyPrev && no > 1) {
          var prev = years.filter(function (y) { return +y.yearNo === no - 1; })[0];
          var shift = prev ? monthIndex(startMonth) - monthIndex(prev.startMonth) : 0;
          var items = store.list('plan').filter(function (x) { return x.project === proj.name && +x.yearNo === no - 1; });
          if (items.length) {
            store.append('plan', items.map(function (x) {
              return {
                id: env.uuid(), project: proj.name, yearNo: String(no), code: x.code, title: x.title, detail: x.detail, output: x.output,
                startMonth: isMonth(x.startMonth) ? addMonths(x.startMonth, shift) : '', endMonth: isMonth(x.endMonth) ? addMonths(x.endMonth, shift) : '',
                status: '예정', updatedBy: u.name, updatedAt: env.now()
              };
            }));
          }
        }
        return { state: loadFor(u), info: { yearNo: String(no) } };
      });
    }
    function deleteYear(u, p) {
      return store.withLock(function () {

        var status = validateText(p.status, '진행상황', 30, true);
        var memo = validateText(p.memo, '진행 내용', 1000, false); // 진행 내용은 선택
        if (status === str(cur.status) && !memo) fail('진행상황을 바꾸거나 진행 내용을 적어 주세요.');
        var done = /완료/.test(status), now = env.now();
        // 완료로 바꾸면 완료일(비면 오늘), 완료가 아니면 완료일을 비움
        var doneDate = done ? (cleanDate(p.doneDate) || cleanDate(cur.doneDate) || env.today()) : '';
        store.update('mails', cur.id, { status: status, doneDate: doneDate, updatedAt: now, updatedBy: u.name });
        store.append('mailLogs', [{ id: env.uuid(), mailId: cur.id, prevStatus: str(cur.status), status: status, memo: memo, author: u.name, createdAt: now }]);
        return { state: loadFor(u), info: { id: cur.id } };
      });
    }
    // 엑셀에서 가져온 메일만 모두 지우기 (다시 가져오기 전 정리용, PI). 그 메일에 쌓인 진행 기록도 함께 지움
    function clearImportedMails(u) {
      requirePI(u);
      return store.withLock(function () {
        var ids = store.list('mails').filter(function (x) { return x.author === IMPORT_AUTHOR; }).map(function (x) { return x.id; });
        if (!ids.length) fail('가져온 메일이 없어요.');
        var set = {};
        ids.forEach(function (id) { set[id] = true; });
        var logs = store.list('mailLogs').filter(function (l) { return set[l.mailId]; }).map(function (l) { return l.id; });
        store.removeMany('mails', ids);
        if (logs.length) store.removeMany('mailLogs', logs);
        return { state: loadFor(u), info: { mails: ids.length, logs: logs.length } };
      });
    }
    function deleteMail(u, p) {
      requireMail(u);
      return store.withLock(function () {
        var cur = store.list('mails').filter(function (x) { return x.id === str(p.id); })[0];
        if (!cur) fail('이미 삭제된 기록이에요.');
        if (cur.author !== u.name && !isAdminRole(u.role)) fail('본인이 쓴 기록만 지울 수 있어요. (PI·PM은 모두 지울 수 있어요)');
        store.remove('mails', cur.id);
        var logs = store.list('mailLogs').filter(function (x) { return x.mailId === cur.id; }).map(function (x) { return x.id; });
        if (logs.length) store.removeMany('mailLogs', logs);
        return { state: loadFor(u) };
      });
    }
    // 엑셀(PEO→PMO 메일 송부 현황)에서 가져오기 (PI만, 과제 관리에서): 하나라도 잘못되면 아무것도 저장하지 않음. 이미 있는 메일은 건너뜀
    var MAIL_IMPORT_MAX = 3000;
    function importMails(u, p) {
      requirePI(u);
      var items = Array.isArray(p.items) ? p.items : [];
      if (!items.length) fail('가져올 줄이 없어요.');
      if (items.length > MAIL_IMPORT_MAX) fail('한 번에 ' + MAIL_IMPORT_MAX + '줄까지 가져올 수 있어요.');
      return store.withLock(function () {
        var have = {};
        store.list('mails').forEach(function (x) { have[mailKey(x)] = true; });
        var add = [], skipped = 0, now = env.now();
        items.forEach(function (x, i) {
          var obj;
          try { obj = mailFields(x || {}); } catch (e) { fail((str(x && x.sheet) || '') + ' ' + (str(x && x.row) || (i + 1)) + '번째 줄: ' + (e.message || e)); }
          if (!obj.requestDate) fail((str(x.sheet) || '') + ' ' + (str(x.row) || (i + 1)) + '번째 줄: 요청일을 알 수 없어요.');
          var key = mailKey(obj);
          if (have[key]) { skipped++; return; }
          have[key] = true;
          obj.id = env.uuid(); obj.author = IMPORT_AUTHOR; obj.createdAt = now; obj.updatedAt = now; obj.updatedBy = u.name;
          add.push(obj);
        });
        if (add.length) store.append('mails', add);
        return { state: loadFor(u), info: { added: add.length, skipped: skipped } };
      });
    }

    /* --- 유지보수 안건의 PEO 비고 --- */
    function saveCaseNote(u, p) {
      if (!seesBiz(u)) fail('PEO만 쓸 수 있어요.');
      return store.withLock(function () {
        var cur = str(p.id) ? store.list('caseNotes').filter(function (x) { return x.id === str(p.id); })[0] : null;
        if (str(p.id) && !cur) fail('비고를 찾을 수 없어요.');
        var projectName = cur ? cur.project : str(p.project), receiptNo = cur ? cur.receiptNo : str(p.receiptNo);
        requireMaint(u, projectName);
        if (cur && cur.author !== u.name) fail('본인이 쓴 비고만 수정할 수 있어요.');
        if (!cur && !store.list('records').some(function (r) { return r.project === projectName && r.receiptNo === receiptNo; })) fail('안건을 찾을 수 없어요.');
        var obj = { project: projectName, receiptNo: receiptNo, date: cleanDate(p.date) || env.today(),
          content: validateText(p.content, '비고', 3000, true), updatedAt: env.now() };
        if (cur) store.update('caseNotes', cur.id, obj);
        else { obj.id = env.uuid(); obj.author = u.name; store.append('caseNotes', [obj]); }
        return { state: loadFor(u) };
      });
    }
    function deleteCaseNote(u, p) {
      if (!seesBiz(u)) fail('PEO만 쓸 수 있어요.');
      return store.withLock(function () {
        var cur = store.list('caseNotes').filter(function (x) { return x.id === str(p.id); })[0];
        if (!cur) fail('이미 삭제된 비고예요.');
        requireMaint(u, cur.project);
        if (cur.author !== u.name && !isAdminRole(u.role)) fail('본인이 쓴 비고만 삭제할 수 있어요.');
        store.remove('caseNotes', cur.id);
        return { state: loadFor(u) };
      });
    }

    /* --- 유지보수 이력 (PEO 전용 장부, 월간보고용) ---
     * 쓰기·고치기·지우기: PI, PEO·PM(모든 유지보수 과제), PEO·연구자(배정된 과제). PMO는 데이터도 받지 않음 */
    function saveMaintHistory(u, p) {
      if (!seesBiz(u)) fail('PEO만 쓸 수 있어요.');
      return store.withLock(function () {
        var cur = str(p.id) ? store.list('maintHistory').filter(function (x) { return x.id === str(p.id); })[0] : null;
        if (str(p.id) && !cur) fail('이력을 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.');
        if (cur) requireMaint(u, cur.project); // 원래 사업도 내가 볼 수 있는 과제여야 고침
        var proj = requireMaint(u, str(p.project) || (cur ? cur.project : ''));
        var category = str(p.category);
        if (MH_CATEGORIES.indexOf(category) < 0) fail('구분(시스템·일반)을 골라 주세요.');
        var requestDate = cleanDate(p.requestDate);
        if (!requestDate) fail('요청일을 입력해 주세요.');
        var status = str(p.status);
        if (STATUSES.indexOf(status) < 0) fail('작업 진행 상황을 골라 주세요.');
        var obj = {
          project: proj.name, category: category, requester: validateText(p.requester, '요청자', 50, true), requestDate: requestDate,
          content: validateText(p.content, '세부 내용', 1000, true), result: validateText(p.result, '특이사항(처리내용)', 2000, false),
          status: status, dueDate: cleanDate(p.dueDate),
          researcher: validateText(p.researcher, '담당 연구원', 100, false), developer: validateText(p.developer, '담당 개발자', 100, false),
          designer: validateText(p.designer, '담당 디자인', 100, false),
          updatedAt: env.now(), updatedBy: u.name
        };
        if (cur) store.update('maintHistory', cur.id, obj);
        else { obj.id = env.uuid(); obj.author = u.name; obj.createdAt = obj.updatedAt; store.append('maintHistory', [obj]); }
        return { state: loadFor(u), info: { id: cur ? cur.id : obj.id } };
      });
    }
    function deleteMaintHistory(u, p) {
      if (!seesBiz(u)) fail('PEO만 쓸 수 있어요.');
      return store.withLock(function () {
        var cur = store.list('maintHistory').filter(function (x) { return x.id === str(p.id); })[0];
        if (!cur) fail('이미 삭제된 이력이에요.');
        requireMaint(u, cur.project);
        store.remove('maintHistory', cur.id);
        return { state: loadFor(u) };
      });
    }
    // 같은 이력인지: 사업·요청일·세부 내용 (앞뒤·겹친 공백 무시)
    function mhKey(x) { return [str(x.project), str(x.requestDate), str(x.content).replace(/\s+/g, ' ').trim()].join('|'); }
    // 엑셀(월간보고 이력 양식, 사업마다 시트)에서 가져오기 (PI만, 과제 관리에서). 하나라도 잘못되면 아무것도 저장하지 않음
    // 이미 있는 이력(같은 사업·요청일·세부 내용)은 건너뜀. 엑셀의 칸은 길이만 맞춰 자르고, 구분·진행 상황은 알 수 없으면 일반·진행중
    var MH_IMPORT_MAX = 3000;
    function importMaintHistory(u, p) {
      requirePI(u);
      var items = Array.isArray(p.items) ? p.items : [];
      if (!items.length) fail('가져올 줄이 없어요.');
      if (items.length > MH_IMPORT_MAX) fail('한 번에 ' + MH_IMPORT_MAX + '줄까지 가져올 수 있어요.');
      return store.withLock(function () {
        var projects = store.list('projects'), have = {};
        store.list('maintHistory').forEach(function (x) { have[mhKey(x)] = true; });
        var add = [], skipped = 0, now = env.now();
        items.forEach(function (x, i) {
          x = x || {};
          var where = (str(x.sheet) ? str(x.sheet) + ' ' : '') + (str(x.row) || (i + 1)) + '번째 줄: ';
          var proj = findProject(projects, str(x.project));
          if (!proj) fail(where + '사업(' + str(x.project) + ')을 찾을 수 없어요.');
          if (kindOf(proj) !== '유지보수') fail(where + proj.name + '은(는) 유지보수 과제가 아니에요.');
          var requestDate = cleanDate(x.requestDate);
          if (!requestDate) fail(where + '요청일을 알 수 없어요.');
          var content = cut(x.content, 1000);
          if (!content) fail(where + '세부 내용이 비어 있어요.');
          var obj = {
            project: proj.name, category: MH_CATEGORIES.indexOf(str(x.category)) >= 0 ? str(x.category) : '일반',
            requester: cut(x.requester, 50), requestDate: requestDate, content: content, result: cut(x.result, 2000),
            status: STATUSES.indexOf(str(x.status)) >= 0 ? str(x.status) : '진행중', dueDate: cleanDate(x.dueDate),
            researcher: cut(x.researcher, 100), developer: cut(x.developer, 100), designer: cut(x.designer, 100)
          };
          var key = mhKey(obj);
          if (have[key]) { skipped++; return; }
          have[key] = true;
          obj.id = env.uuid(); obj.author = IMPORT_AUTHOR; obj.createdAt = now; obj.updatedAt = now; obj.updatedBy = u.name;
          add.push(obj);
        });
        if (add.length) store.append('maintHistory', add);
        return { state: loadFor(u), info: { added: add.length, skipped: skipped } };
      });
    }
    // 엑셀에서 가져온 이력만 모두 지우기 (다시 가져오기 전 정리용, PI). 화면에서 직접 적은 이력은 남음
    function clearImportedMaintHistory(u) {
      requirePI(u);
      return store.withLock(function () {
        var ids = store.list('maintHistory').filter(function (x) { return x.author === IMPORT_AUTHOR; }).map(function (x) { return x.id; });
        if (!ids.length) fail('가져온 이력이 없어요.');
        store.removeMany('maintHistory', ids);
        return { state: loadFor(u), info: { count: ids.length } };
      });
    }

    function handle(req) {
      req = req || {};
      var p = req.payload || {};
      switch (req.action) {
        case 'bootstrap': return bootstrap();
        case 'setup': return setup(p);
        case 'login': return login(p);
      }
      var u = authenticate(req.token);
      if (req.action === 'logout') return logoutAll(u);
      var res = authed(u, req.action, p);
      // 사용할 때마다 로그인 연장: 새 토큰을 함께 돌려줌 (비밀번호를 바꿨다면 바뀐 세션번호로)
      var fresh = allUsers().filter(function (x) { return x.name === u.name; })[0];
      if (res && typeof res === 'object' && fresh && fresh.active !== 'N') res._token = makeToken(fresh);
      return res;
    }
    // 저장 공간 사용량 (Supabase: DB 크기 / 한도). 저장소가 알려 주지 않으면(구글 시트 등) null
    function storageInfo(u) { // PI·PM과 PEO 전체
      if (!isAdminRole(u.role) && !seesBiz(u)) fail('볼 수 없는 정보예요.');
      return { usage: typeof store.usage === 'function' ? store.usage() : null };
    }
    function authed(u, action, p) {
      switch (action) {
        case 'ping': return { ok: true, rev: revOf() };
        case 'storage': return storageInfo(u);
        case 'saveReport': return saveReport(u, p);
        case 'deleteReport': return deleteReport(u, p);
        case 'addReportStep': return addReportStep(u, p);
        case 'updateReportLog': return updateReportLog(u, p);
        case 'deleteReportLog': return deleteReportLog(u, p);
        case 'saveReportsBatch': return saveReportsBatch(u, p);
        case 'saveSetting': return saveSetting(u, p);
        case 'carryReports': return carryReports(u, p);
        case 'setReportsStatus': return setReportsStatus(u, p);
        case 'saveOutcome': return saveOutcome(u, p);
        case 'deleteOutcome': return deleteOutcome(u, p);
        case 'saveMail': return saveMail(u, p);
        case 'deleteMail': return deleteMail(u, p);
        case 'importMails': return importMails(u, p);
        case 'addMailStep': return addMailStep(u, p);
        case 'clearImportedMails': return clearImportedMails(u);
        case 'load': return { state: loadFor(u) };
        case 'saveRecord': return saveRecord(u, p);
        case 'deleteRecord': return deleteRecord(u, p);
        case 'saveProject': return saveProject(u, p);
        case 'deleteProject': return deleteProject(u, p);
        case 'reorderProjects': return reorderProjects(u, p);
        case 'saveUser': return saveUser(u, p);
        case 'deleteUser': return deleteUser(u, p);
        case 'changePassword': return changePassword(u, p);
        case 'importRecords': return importRecords(u, p);
        case 'clearImported': return clearImported(u);
        case 'closeCase': return closeCase(u, p);
        case 'reopenCase': return reopenCase(u, p);
        case 'saveYear': return saveYear(u, p);
        case 'deleteYear': return deleteYear(u, p);
        case 'savePlanItem': return savePlanItem(u, p);
        case 'deletePlanItem': return deletePlanItem(u, p);
        case 'saveTask': return saveTask(u, p);
        case 'deleteTask': return deleteTask(u, p);
        case 'saveLog': return saveLog(u, p);
        case 'deleteLog': return deleteLog(u, p);
        case 'saveMilestone': return saveMilestone(u, p);
        case 'deleteMilestone': return deleteMilestone(u, p);
        case 'saveCaseNote': return saveCaseNote(u, p);
        case 'deleteCaseNote': return deleteCaseNote(u, p);
        case 'saveMaintHistory': return saveMaintHistory(u, p);
        case 'deleteMaintHistory': return deleteMaintHistory(u, p);
        case 'importMaintHistory': return importMaintHistory(u, p);
        case 'pushDailySheet': return pushDailySheet(u, p);
        case 'clearImportedMaintHistory': return clearImportedMaintHistory(u);
        case 'importBiz': return importBiz(u, p);
        case 'clearImportedBiz': return clearImportedBiz(u);
        case 'exportAll': return exportAll(u);
        case 'importAll': return importAll(u, p);
      }
      fail('알 수 없는 요청이에요.');
    }

    return { handle: handle, hashPassword: hashPassword };
  }

  return {
    create: create,
    summarize: summarize,
    nextReceiptNo: nextReceiptNo,
    canEdit: canEdit,
    stageInfo: stageInfo,
    stageRank: stageRank,
    receiptSortKey: receiptSortKey,
    receiptYear: receiptYear,
    IMPORT_AUTHOR: IMPORT_AUTHOR,
    daysBetween: daysBetween,
    splitNames: splitNames,
    isDate: isDate,
    isMonth: isMonth,
    monthIndex: monthIndex,
    addMonths: addMonths,
    isCode: isCode,
    codeLevel: codeLevel,
    parentCode: parentCode,
    codeKey: codeKey,
    orgOf: orgOf,
    seesBiz: seesBiz,
    roleLabel: roleLabel,
    kindOf: kindOf,
    canSeeProject: canSeeProject,
    canEditBiz: canEditBiz,
    canManageProject: canManageProject,
    STAGES: STAGES,
    STATUSES: STATUSES,
    PLAN_STATUSES: PLAN_STATUSES,
    ROLES: ROLES,
    ORGS: ORGS,
    KINDS: KINDS,
    RESEARCH_TYPES: RESEARCH_TYPES,
    MINISTRIES: MINISTRIES,
    CONTRACT_TYPES: CONTRACT_TYPES,
    RANKS: RANKS,
    RANK_CODES: RANK_CODES,
    REPORT_KINDS: REPORT_KINDS,
    REPORT_STATUSES: REPORT_STATUSES,
    OUTCOME_TYPES: OUTCOME_TYPES,
    mondayOf: mondayOf,
    MS_KINDS: MS_KINDS,
    milestoneKind: milestoneKind,
    isAdminRole: isAdminRole,
    NEW_RECEIPT_STAGES: NEW_RECEIPT_STAGES,
    MAIL_URGENCY: MAIL_URGENCY,
    MAIL_DBDEV: MAIL_DBDEV,
    MAIL_TYPES: MAIL_TYPES,
    MAIL_STATUSES: MAIL_STATUSES,
    MH_CATEGORIES: MH_CATEGORIES,
    SERVER_BUILD: SERVER_BUILD,
    canSeeMail: canSeeMail,
    TABLES: TABLES
  };
})();

        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(r);
      });
      var items = order.map(function (k) {
        var head = L.summarize(groups[k], today(), 0)[0].record;
        // 대표 줄과 같은 단계로 이어 쓴 이전 기록은 대표 줄 뒤에 쌓고, 나머지 단계는 펼치면 보이는 이전 기록
        var runs = stackRuns(groups[k]);
        var headRun = runs.filter(function (run) { return run.front === head || run.backs.indexOf(head) >= 0; })[0] || { front: head, backs: [] };
        if (headRun.front !== head) headRun = { front: head, backs: headRun.backs.concat([headRun.front]).filter(function (x) { return x !== head; }).sort(newestFirst) };
        var others = runs.filter(function (run) { return run.front !== headRun.front && run.backs.indexOf(head) < 0; });
        var restN = others.reduce(function (n, run) { return n + 1 + run.backs.length; }, 0);
        return { key: k, head: head, headBacks: headRun.backs, others: others, restN: restN };
      });
      items = applySort('progress', items, function (it) { return it.head; });
      $('#count').textContent = '안건 ' + items.length + '건 · 기록 ' + rows.length + '건';
      items.forEach(function (it) {
        alt = !alt;
        var open = !!S.expanded[it.key] && it.restN > 0, k = esc(it.key);
        var toggle = it.restN
          ? '<button type="button" class="tg-btn" data-act="toggle-group" data-key="' + k + '" aria-expanded="' + open + '" title="이전 기록 ' + it.restN + '건 ' + (open ? '접기' : '펼치기') + '">' +
            '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 7 5 3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '</button><span class="tg-count">+' + it.restN + '</span>'
          : '';
        body += '<tr class="grp' + (alt ? ' alt' : '') + (open ? ' open' : '') + (it.restN ? ' has-rest' : '') + '"' + (it.restN ? ' data-act="toggle-group" data-key="' + k + '"' : '') + '>' +
          '<td class="tg">' + toggle + '</td>' + cells(it.head, closureOf(it.head.project, it.head.receiptNo), { n: it.headBacks.length }) + actsFor(it.head, true) + '</tr>';
        // 대표 줄 뒤에 쌓인 같은 단계 이전 기록 (최신 → 이전)
        var hOpen = !!S.stackOpen[it.head.id];
        it.headBacks.forEach(function (r) {
          body += '<tr class="stack-back' + (alt ? ' alt' : '') + '" data-stack="' + esc(it.head.id) + '"' + (hOpen ? '' : ' hidden') + '><td class="tg"></td>' + cells(r, null, { back: true }) + actsFor(r, false) + '</tr>';
        });
        // 다른 단계 기록: 단계 순서대로, 같은 단계로 이어 쓴 것은 최신 한 줄만 보이고 이전 것은 그 뒤에 쌓임
        var emitted = 0;
        it.others.forEach(function (run) {
          emitted++;
          var sOpen = !!S.stackOpen[run.front.id];
          body += '<tr class="child' + (emitted === it.restN ? ' child-last' : '') + '" data-parent="' + k + '"' + (open ? '' : ' hidden') + '><td class="tg"><span class="tg-line">└</span></td>' +
            cells(run.front, null, { n: run.backs.length }) + actsFor(run.front, false) + '</tr>';
          run.backs.forEach(function (r) {
            emitted++;
            body += '<tr class="child stack-back' + (emitted === it.restN ? ' child-last' : '') + '" data-parent="' + k + '" data-stack="' + esc(run.front.id) + '"' + (open && sOpen ? '' : ' hidden') + '><td class="tg"></td>' +
              cells(r, null, { back: true }) + actsFor(r, false) + '</tr>';
          });
        });
      });
    } else {
      // 같은 안건에서 같은 단계로 이어 쓴 기록은 최신 한 줄만 보이고, 이전 기록은 그 뒤에 쌓임 (이전 n 을 누르면 펼침)
      var byCase = {}, caseOrder = [];
      rows.forEach(function (r) {
        var ck = r.project + '|' + r.receiptNo;
        if (!byCase[ck]) { byCase[ck] = []; caseOrder.push(ck); }
        byCase[ck].push(r);
      });
      var backsOf = {}, fronts = [];
      caseOrder.forEach(function (ck) {
        stackRuns(byCase[ck]).forEach(function (run) { fronts.push(run.front); if (run.backs.length) backsOf[run.front.id] = run.backs; });
      });
      fronts.sort(function (a, b) { var c = sortByReceiptDesc(a, b); return c !== 0 ? c : (+a.seq || 0) - (+b.seq || 0); });
      fronts = applySort('progress', fronts);
      $('#count').textContent = rows.length + '건';
      // 접수번호마다 마지막 기록에만 '다음 단계' 버튼 (정렬 순서와 무관)
      var lastOf = {};
      S.data.records.forEach(function (r) {
        var k = r.project + '|' + r.receiptNo, cur = lastOf[k];
        if (!cur || (+r.seq || 0) > (+cur.seq || 0)) lastOf[k] = r;
      });
      var lastKey = null;
      fronts.forEach(function (r) {
        var key = r.project + '|' + r.receiptNo, backs = backsOf[r.id] || [];
        if (key !== lastKey) { alt = !alt; lastKey = key; }
        body += '<tr class="' + (alt ? 'alt' : '') + '">' + cells(r, lastOf[key] === r ? closureOf(r.project, r.receiptNo) : null, { n: backs.length }) + actsFor(r, lastOf[key] === r) + '</tr>';
        var sOpen = !!S.stackOpen[r.id];
        backs.forEach(function (b) {
          body += '<tr class="stack-back' + (alt ? ' alt' : '') + '" data-stack="' + esc(r.id) + '"' + (sOpen ? '' : ' hidden') + '>' + cells(b, null, { back: true }) + actsFor(b, false) + '</tr>';
        });
      });
    }
    area.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + (grouped ? '<th class="tg" aria-label="펼치기"></th>' : '') +
      [['project', '과제'], ['stage', '단계'], ['owners', '담당'], ['date', '작성일'], ['receipt', '접수번호'],
        ['content', '업무 내용'], ['status', '상태'], ['progress', '진도율'], ['dueDate', '완료예정일'], ['doneDate', '완료일'],
        ['requester', '요청자'], ['requestDeadline', '요청마감일'], ['note', '비고']].map(function (c) {
        return sortHead('progress', c[0], c[1], c[2]);
      }).join('') + (isPM() ? '' : '<th class="sticky-act">관리</th>') + '</tr></thead><tbody>' + body + '</tbody></table></div>';
    var hd = $('#hidden-done');
    if (hd) hd.textContent = f.hideDone && hiddenDone ? '(종결 ' + hiddenDone + '건 숨김)' : '';
  }
  /* 같은 단계 쌓기: 한 안건 안에서 단계가 같은 기록이 이어지면(＋다음 단계로 같은 단계를 또 쓴 경우) 한 묶음.
     맨 앞(front)은 가장 최근 기록, backs는 그 이전 기록(최신 → 이전 순) */
  function newestFirst(a, b) {
    var da = a.date || '', db = b.date || '';
    if (da !== db) return da < db ? 1 : -1;
    var sa = +a.seq || 0, sb = +b.seq || 0;
    if (sa !== sb) return sb - sa;
    return String(b.updatedAt || '') < String(a.updatedAt || '') ? -1 : 1;
  }
  function stackRuns(list) {
    var runs = [], cur = null;
    list.slice().sort(function (a, b) { return (+a.seq || 0) - (+b.seq || 0); }).forEach(function (r) {
      if (cur && cur.stage === r.stage) cur.items.push(r);
      else { cur = { stage: r.stage, items: [r] }; runs.push(cur); }
    });
    return runs.map(function (run) {
      var items = run.items.slice().sort(newestFirst);
      return { front: items[0], backs: items.slice(1) };
    });
  }
  function stackBtn(id, n) {
    var open = !!S.stackOpen[id];
    return '<button type="button" class="stack-btn' + (open ? ' on' : '') + '" data-act="toggle-stack" data-key="' + esc(id) + '" aria-expanded="' + open + '"' +
      ' title="같은 단계의 이전 기록 ' + n + '건 ' + (open ? '접기' : '보기') + '">이전 ' + n + '</button>';
  }
  // 쌓인 이전 기록 펼치기/접기 (다시 그리지 않고 줄만 보이거나 숨김)
  function toggleStack(id) {
    var open = !S.stackOpen[id];
    if (open) S.stackOpen[id] = true; else delete S.stackOpen[id];
    $$('#table-area tr[data-stack]').forEach(function (tr) {
      if (tr.getAttribute('data-stack') !== id) return;
      var p = tr.getAttribute('data-parent');
      tr.hidden = !open || (!!p && !S.expanded[p]);
    });
    $$('#table-area .stack-btn').forEach(function (b) {
      if (b.getAttribute('data-key') !== id) return;
      b.classList.toggle('on', open);
      b.setAttribute('aria-expanded', open);
      b.title = b.title.replace(/(보기|접기)$/, open ? '접기' : '보기');
    });
  }
  // 한 안건 펼치기/접기: 다시 그리지 않고 줄만 보이거나 숨겨서 스크롤 위치를 유지
  function toggleGroup(key) {
    var open = !S.expanded[key];
    if (open) S.expanded[key] = true; else delete S.expanded[key];
    $$('#table-area tr.child').forEach(function (tr) {
      if (tr.getAttribute('data-parent') !== key) return;
      var sk = tr.getAttribute('data-stack'); // 쌓인 이전 기록은 그 묶음을 펼쳤을 때만
      tr.hidden = !open || (!!sk && !S.stackOpen[sk]);
    });
    $$('#table-area tr.grp').forEach(function (tr) {
      if (tr.getAttribute('data-key') !== key) return;
      tr.classList.toggle('open', open);
      var b = tr.querySelector('.tg-btn');
      if (b) { b.setAttribute('aria-expanded', open); b.title = b.title.replace(/(펼치기|접기)$/, open ? '접기' : '펼치기'); }
    });
  }
  function expandAll(open) {
    S.expanded = {};
    if (open) $$('#table-area tr.grp.has-rest').forEach(function (tr) { S.expanded[tr.getAttribute('data-key')] = true; });
    renderProgressTable();
  }

  /* ---------- 안건별 요약 ---------- */
  function caseTouchedToday(s) {
    var t = today();
    if (s.record.date === t) return true;
    return recordsOf(s.project, s.receiptNo).some(function (r) { return r.date === t || String(r.updatedAt || '').slice(0, 10) === t; });
  }
  function filteredSummaries() {
    var sf = S.sf;
    var all = summaries(sf.hide ? sf.days : 0).filter(function (s) {
      var r = s.record;
      if (S.g.year && s.year !== S.g.year) return false;
      if (sf.project && s.project !== sf.project) return false;
      if (sf.stage && r.stage !== sf.stage) return false;
      if (sf.status === '최종완료' && !s.closed) return false;
      if (sf.status && sf.status !== '최종완료' && (s.closed || r.status !== sf.status)) return false;
      if (sf.owner && L.splitNames(r.owners).indexOf(sf.owner) < 0) return false;
      if (sf.delayedOnly && !s.delayed) return false;
      // 오늘 작성된 안건: 작성일이 오늘이거나, 오늘 고친 기록(진도율만 바꾼 것 포함)이 있는 안건
      if (sf.todayOnly && !caseTouchedToday(s)) return false;
      return matchQ(sf.q, [s.title, r.content, s.receiptNo, r.owners, s.requester, r.note, s.project]);
    });
    var hiddenCount = all.filter(function (s) { return s.hidden; }).length;
    var rows = applySort('summary', all.filter(function (s) { return !s.hidden; }).sort(sortByReceiptDesc));
    return { rows: rows, hiddenCount: hiddenCount };
  }
  function viewSummary() {
    var sf = S.sf;
    var names = {};
    S.data.records.forEach(function (r) { L.splitNames(r.owners).forEach(function (n) { names[n] = true; }); });
    var ownerList = Object.keys(names).sort();
    if (!maintProjects().length) {
      return '<div class="view-head"><h1>유지보수 안건별 요약</h1></div><div class="card empty"><strong>표시할 유지보수 과제가 없어요</strong></div>';
    }
    return '<div class="view-head"><h1>유지보수 안건별 요약</h1></div>' +
      '<div class="filters">' + yearSelect() + projectSelect('sf.project', sf.project) +
      '<select class="inp" data-filter="sf.stage" aria-label="현재 단계">' + options(stageOptions(), sf.stage, '현재 단계 전체') + '</select>' +
      '<select class="inp" data-filter="sf.status" aria-label="상태">' + options(L.STATUSES.concat(['최종완료']), sf.status, '전체 상태') + '</select>' +
      '<select class="inp" data-filter="sf.owner" aria-label="담당">' + options(ownerList, sf.owner, '전체 담당') + '</select>' +
      '<input type="search" class="inp search" data-filter="sf.q" placeholder="검색" value="' + esc(sf.q) + '" aria-label="검색">' +
      '<span class="filter-break"></span>' +
      '<label class="check"><input type="checkbox" data-filter="sf.hide"' + (sf.hide ? ' checked' : '') + '> 5단계(이력관리)·비기능 완료 후</label>' +
      '<input type="number" class="inp inline-num" min="1" max="365" data-filter="sf.days" value="' + esc(sf.days) + '" aria-label="숨김 기준 일수"' + (sf.hide ? '' : ' disabled') + '>' +
      '<span class="check" style="cursor:default">일 지난 안건 숨기기</span>' +
      '<label class="check"><input type="checkbox" data-filter="sf.delayedOnly"' + (sf.delayedOnly ? ' checked' : '') + '> 지연만 보기</label>' +
      '<label class="check"><input type="checkbox" data-filter="sf.todayOnly"' + (sf.todayOnly ? ' checked' : '') + '> 오늘 작성된 안건만</label>' +
      '</div><section class="panel"><div class="panel-head"><h2>안건</h2><span class="count" id="count"></span><span class="count" id="hidden-count"></span><span class="spacer"></span>' +
      '<button class="btn" data-act="export-summary">⤓ 엑셀 다운로드</button></div><div id="table-area"></div></section>';
  }
  function renderSummaryTable() {
    var area = $('#table-area');
    if (!area) return;
    var res = filteredSummaries();
    $('#count').textContent = res.rows.length + '건';
    var hc = $('#hidden-count');

    if (!res.rows.length) {
      area.innerHTML = '<div class="tbl-wrap"><div class="empty"><strong>조건에 맞는 안건이 없어요</strong></div></div>';

      return '<tr class="clickable" data-act="history" data-project="' + esc(s.project) + '" data-receipt="' + esc(s.receiptNo) + '">' +
        '<td>' + esc(s.project) + '</td><td>' + stageChip(r.stage) + '</td><td>' + owners(r) + '</td><td class="date">' + fmtDate(r.date) + '</td>' +
        '<td class="mono">' + esc(s.receiptNo) + '</td><td class="wrap">' + esc(r.content) + '</td>' +

        '<td>' + (esc(s.requester) || '-') + '</td><td class="date">' + fmtDate(s.requestDeadline) + '</td><td class="note">' + esc(caseNote(s)) + peoNoteTag(s) + '</td>' +
        (isPM() ? '<td class="sticky-act">' + caseButtons(s) + '</td>' : '') + '</tr>';
    }).join('');
    area.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      [['project', '과제'], ['stage', '단계'], ['owners', '담당'], ['date', '작성일'], ['receipt', '접수번호'],
        ['content', '업무 내용'], ['status', '상태'], ['dueDate', '완료예정일'], ['doneDate', '완료일'], ['progress', '진도율'],
        ['requester', '요청자'], ['requestDeadline', '요청마감일'], ['note', '비고']].map(function (c) {
        return sortHead('summary', c[0], c[1], c[2]);

  /* ---------- 엑셀 (SheetJS, 필요할 때만 불러옴) ---------- */
  var xlsxPromise = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxPromise) {
      xlsxPromise = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = XLSX_URL;
        s.onload = function () { resolve(window.XLSX); };
        s.onerror = function () { xlsxPromise = null; reject(new Error('엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')); };
        document.head.appendChild(s);
      });
    }
    return xlsxPromise;
  }
  function exportSummary() {
    var rows = filteredSummaries().rows;
    if (!rows.length) { toast('내려받을 안건이 없어요.', 'error'); return; }
    setBusy(true);
    loadXLSX().then(function (X) {
      var header = ['과제', '단계', '담당', '작성일', '접수번호', '업무 내용', '상태', '완료예정일', '완료일', '진도율', '요청자', '요청마감일', '비고'];
      var aoa = [header].concat(rows.map(function (s) {
        var r = s.record;
        return [s.project, L.stageInfo(r.stage).label, L.splitNames(r.owners).join(', '), r.date, s.receiptNo,
          r.content, s.closed ? '최종완료' : r.status + (s.delayed ? ' (지연 ' + s.delayDays + '일)' : ''), r.dueDate, caseDoneDate(s),
          s.closed || r.status === '완료' ? '100%' : (r.status === '진행중' ? (+r.progress || 0) + '%' : ''),
          s.requester, s.requestDeadline, caseNote(s)];
      }));
      var ws = X.utils.aoa_to_sheet(aoa);
      ws['!cols'] = [10, 18, 16, 11, 11, 60, 14, 11, 11, 8, 16, 11, 24].map(function (w) { return { wch: w }; });
      ws['!autofilter'] = { ref: ws['!ref'] };
      var wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, ws, '안건별 요약');
      X.writeFile(wb, '유지보수_안건별요약_' + (S.g.year ? S.g.year + '년접수_' : '') + (S.sf.todayOnly ? '오늘작성_' : '') + today().replace(/-/g, '') + '.xlsx');
      setBusy(false);
      toast(rows.length + '건을 엑셀로 내려받았어요.');
    }).catch(function (e) { setBusy(false); toast(e.message, 'error'); });
  }

  /* ---------- 이력 보기 ---------- */
  var historyOpen = null;
  function openHistory(project, receiptNo) {
    historyOpen = { project: project, receiptNo: receiptNo };
    openModal({ title: '접수번호 ' + receiptNo + ' · ' + project, size: 'xwide', body: historyBody(project, receiptNo), footer: historyFoot(project, receiptNo) });
  }
  function historyBody(project, receiptNo) {
    var list = recordsOf(project, receiptNo);
    if (!list.length) return '<div class="empty"><strong>기록이 없어요</strong>삭제되었을 수 있어요.</div>';
    var s = L.summarize(list, today(), 0, S.data.closures)[0];
    var head = '<p class="case-title">' + esc(s.title) + '</p><div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:14px;color:var(--ink-2)">' +
      '<span>현재 ' + stageChip(s.record.stage) + ' ' + caseStatus(s) + '</span>' +
      (s.closed ? '<span>최종완료 ' + fmtDate(s.closed.closedAt) + ' · 처리 ' + esc(s.closed.closedBy) + (s.closed.note ? ' · 사유: ' + esc(s.closed.note) : '') + '</span>' : '') +
      '<span>접수일 ' + fmtDate(s.receivedOn) + '</span>' + (s.requester ? '<span>요청자 ' + esc(s.requester) + '</span>' : '') +
      (s.requestDeadline ? '<span>요청마감일 ' + fmtDate(s.requestDeadline) + '</span>' : '') + '<span>기록 ' + list.length + '건</span></div>';
    return head + '<div class="tbl-wrap" style="max-height:none"><table class="tbl"><thead><tr>' +
      [['stage', '단계'], ['owners', '담당'], ['date', '작성일'], ['content', '업무 내용'], ['status', '상태'],
        ['progress', '진도율'], ['dueDate', '완료예정일'], ['doneDate', '완료일'], ['note', '비고']].map(function (c) {
        return sortHead('history', c[0], c[1], c[2]);
      }).join('') + (isPM() ? '' : '<th class="act-col">관리</th>') + '</tr></thead><tbody>' +
      applySort('history', list).map(function (r) {
        var acts = L.canEdit(S.user, r) ? '<div class="actions"><button class="btn sm" data-act="edit-record" data-id="' + esc(r.id) + '">수정</button><button class="btn sm danger-line" data-act="delete-record" data-id="' + esc(r.id) + '">삭제</button></div>' : '';

      }).join('') + '</tbody></table></div>' + peoNotesLink(project, receiptNo); // PEO 상세 기록: 내용은 사업 진행사항에서 (PEO·PI만, PMO에는 안 보임)
  }
  function historyFoot(project, receiptNo) {
    var pm = '';
    if (isPM()) {
      var s = L.summarize(recordsOf(project, receiptNo), today(), 0, S.data.closures)[0];
      if (s) pm = '<span class="left">' + caseButtons(s) + '</span>';
    }
    return pm + (memberOf(project) ? '<button class="btn primary" data-act="next-stage" data-project="' + esc(project) + '" data-receipt="' + esc(receiptNo) + '">+ 다음 단계 기록</button>' : '') +
      '<button class="btn" data-act="modal-close">닫기</button>';
  }
  function refreshHistoryIfOpen() {
